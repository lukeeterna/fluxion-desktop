        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64,zlib,hashlib
          raw=zlib.decompress(base64.b64decode(os.environ['PATCH_Z64']))
          assert hashlib.sha256(raw).hexdigest() == '8d866b1fd53043ec00f492e299494d3fd06b0f3ac8afb357d69dcf294c7da6db'
          open('/tmp/apply_live_transfer.py','wb').write(raw)
          PY
          python3 /tmp/apply_live_transfer.py
          gofmt -w voice-agent/engine/main.go voice-agent/engine/main_test.go
          rm -f .github/workflows/_tmp-live-transfer-inspect.yml .github/workflows/_tmp-live-transfer-apply.yml
      - name: Validate Go engine
        working-directory: voice-agent/engine
        run: go test ./...
      - name: Validate Python
        run: |
          set -euo pipefail
          python3 -m py_compile voice-agent/src/voip_goengine.py voice-agent/src/orchestrator.py voice-agent/tests/test_live_transfer_goengine.py
          cd voice-agent
          python3 -m pip install -q pytest pytest-asyncio aiohttp
          pytest tests/test_live_transfer_goengine.py tests/test_nlu_fsm_bypass.py -q
      - name: Validate final diff
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/_tmp-live-transfer-inspect.yml
          test ! -e .github/workflows/_tmp-live-transfer-apply.yml
          git status --short
          git diff --stat HEAD
      - name: Commit product patch
        run: |
          set -euo pipefail
          git config user.name "FLUXION SOL"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(voice): add real SIP live transfer"
          git push origin HEAD:agent/sara-live-transfer-p0
