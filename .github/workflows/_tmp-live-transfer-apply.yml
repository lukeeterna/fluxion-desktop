name: TMP Validate Sara Live Transfer Markers
on:
  push:
    branches: [agent/sara-live-transfer-p0]
    paths: ['.github/workflows/_tmp-live-transfer-apply.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all deterministic source markers
        env:
          VALIDATOR_Z64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64,zlib
          src=zlib.decompress(base64.b64decode(os.environ['VALIDATOR_Z64']))
          open('/tmp/validate.py','wb').write(src)
          PY
          python3 /tmp/validate.py
