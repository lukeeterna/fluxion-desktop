          git diff --check
          test ! -e .github/workflows/_tmp-live-transfer-inspect.yml
          test ! -e .github/workflows/_tmp-live-transfer-apply.yml
          git status --short
          git diff --stat HEAD
      - name: Commit product patch
        run: |
          set -euo pipefail
          git config user.name "FLUXION SOL"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(voice): add real SIP live transfer"
          git push origin HEAD:agent/sara-live-transfer-p0
