name: FLUXION Soleur Fast Self-Test

on:
  pull_request:
    paths:
      - '.github/bootstrap/fluxion-soleur-adapter.py'
      - '.github/workflows/fluxion-soleur.yml'
      - '.github/workflows/fluxion-soleur-fast-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOLEUR_COMMIT: 154302d32114abba3165ce47daefe5bfe508d02f
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch only control files from PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .github/bootstrap .github/workflows
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/bootstrap/fluxion-soleur-adapter.py?ref=${HEAD_SHA}" --jq .content | base64 -d > .github/bootstrap/fluxion-soleur-adapter.py
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/fluxion-soleur.yml?ref=${HEAD_SHA}" --jq .content | base64 -d > .github/workflows/fluxion-soleur.yml

      - name: Adapter deterministic self-test
        run: |
          set -euo pipefail
          python3 -m py_compile .github/bootstrap/fluxion-soleur-adapter.py
          python3 .github/bootstrap/fluxion-soleur-adapter.py self-test
          python3 .github/bootstrap/fluxion-soleur-adapter.py static-workflow --workflow .github/workflows/fluxion-soleur.yml

      - name: Verify exact Soleur pin and overlay
        run: |
          set -euo pipefail
          SOLEUR_ROOT="$RUNNER_TEMP/soleur"
          git init "$SOLEUR_ROOT"
          git -C "$SOLEUR_ROOT" remote add origin https://github.com/jikig-ai/soleur.git
          git -C "$SOLEUR_ROOT" fetch --depth=1 origin "$SOLEUR_COMMIT"
          git -C "$SOLEUR_ROOT" checkout --detach "$SOLEUR_COMMIT"
          python3 .github/bootstrap/fluxion-soleur-adapter.py overlay --soleur-root "$SOLEUR_ROOT"
          grep -Fq 'FLUXION_SOLEUR_READY' "$SOLEUR_ROOT/plugins/soleur/skills/ship/SKILL.md"
          grep -Fq '<promise>READY_FOR_SOL_000020</promise>' "$SOLEUR_ROOT/plugins/soleur/skills/one-shot/SKILL.md"
          grep -Fq 'FLUXION_EXTERNAL_PUBLISH=PASS' "$SOLEUR_ROOT/plugins/soleur/skills/postmerge/SKILL.md"
          echo 'SOLEUR_FAST_SELFTEST=PASS'
