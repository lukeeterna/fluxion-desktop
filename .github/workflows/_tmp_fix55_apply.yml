name: FIX55 temporary deterministic repair

on:
  push:
    branches:
      - fix/soleur-subagent-drain-20260814

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/soleur-subagent-drain-20260814
          fetch-depth: 1
          sparse-checkout: |
            .github/bootstrap
            .github/workflows

      - name: Apply exact repair
        run: |
          set -euo pipefail
          python3 .github/bootstrap/_tmp_fix55_apply.py

      - name: Deterministic regression
        run: |
          set -euo pipefail
          python3 -m py_compile .github/bootstrap/fluxion-soleur-adapter.py
          python3 .github/bootstrap/fluxion-soleur-adapter.py self-test
          python3 .github/bootstrap/fluxion-soleur-adapter.py static-workflow --workflow .github/workflows/fluxion-soleur.yml
          SOLEUR_ROOT="$RUNNER_TEMP/soleur"
          git init "$SOLEUR_ROOT"
          git -C "$SOLEUR_ROOT" remote add origin https://github.com/jikig-ai/soleur.git
          git -C "$SOLEUR_ROOT" fetch --depth=1 origin 154302d32114abba3165ce47daefe5bfe508d02f
          git -C "$SOLEUR_ROOT" checkout --detach 154302d32114abba3165ce47daefe5bfe508d02f
          python3 .github/bootstrap/fluxion-soleur-adapter.py overlay --soleur-root "$SOLEUR_ROOT"
          grep -Fq 'FLUXION_SUBAGENT_DRAIN' "$SOLEUR_ROOT/plugins/soleur/skills/one-shot/SKILL.md"
          grep -Fq 'Never return a' "$SOLEUR_ROOT/plugins/soleur/skills/one-shot/SKILL.md"
          grep -Fq 'Monitor` / agent-status polling' "$SOLEUR_ROOT/plugins/soleur/skills/one-shot/SKILL.md"
          grep -Fq 'fail closed' "$SOLEUR_ROOT/plugins/soleur/skills/one-shot/SKILL.md"
          git diff --check

      - name: Commit only permanent adapter repair
        run: |
          set -euo pipefail
          git config user.name 'FLUXION deterministic repair'
          git config user.email 'fluxion-repair@users.noreply.github.com'
          git add .github/bootstrap/fluxion-soleur-adapter.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = '.github/bootstrap/fluxion-soleur-adapter.py'
          git commit -m 'fix(ci): drain Soleur review agents before final result'
          git push origin HEAD:fix/soleur-subagent-drain-20260814
