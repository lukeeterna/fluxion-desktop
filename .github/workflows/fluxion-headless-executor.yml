name: FLUXION Headless Executor Bootstrap

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fluxion-headless-executor.yml'
      - 'docs/judge/HEADLESS-CC-EXECUTOR-SYSTEM.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluxion-machine-executor
  cancel-in-progress: false

jobs:
  t-exposure:
    name: T-EXPOSURE M1-M6 — Claude Code local executor
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 120
    env:
      FLUXION_ROOT: /Volumes/MontereyT7/FLUXION
      TASK_ID: T-EXPOSURE.EXECUTE.20260807
      MANDATE_SHA256: 14e21bc77cada3f5105fea4874ffb6f9156bb8b09cbf466c390c45ee1ede63a5
      RESULT_SESSION_ID: CC-IMPLEMENTER-900001

    steps:
      - name: Preflight canonical machine plane
        shell: bash
        run: |
          set -euo pipefail
          DRAFT_BUS="$HOME/.local/bin/fluxion-draft-bus-secure"
          test -d "$FLUXION_ROOT/.git"
          test -x "$DRAFT_BUS"
          command -v claude >/dev/null
          command -v python3 >/dev/null
          command -v git >/dev/null
          test ! -e "$FLUXION_ROOT/vos/STOP"
          cd "$FLUXION_ROOT"
          remote="$(git remote get-url origin)"
          case "$remote" in
            https://github.com/lukeeterna/fluxion-desktop|https://github.com/lukeeterna/fluxion-desktop.git|git@github.com:lukeeterna/fluxion-desktop.git) ;;
            *) echo "BLOCKED: noncanonical origin" >&2; exit 2 ;;
          esac
          git fetch origin master --quiet
          test "$(git branch --show-current)" = "master"
          git merge --ff-only origin/master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
          python3 bin/vos_machine.py validate
          python3 bin/vos_machine.py verify --role repo_authority
          actual="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          print(hashlib.sha256(Path('docs/judge/mandati/T-EXPOSURE.md').read_bytes()).hexdigest())
          PY
          )"
          test "$actual" = "$MANDATE_SHA256"

      - name: Execute sealed mandate with fresh bare Claude Code
        id: execute
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$FLUXION_ROOT"
          RUN_DIR="$(git rev-parse --git-dir)/vos-control/headless/$TASK_ID-${GITHUB_RUN_ID}"
          mkdir -p "$RUN_DIR"
          PROMPT_FILE="$RUN_DIR/task.txt"
          cat > "$PROMPT_FILE" <<'EOF'
          Execute the canonical sealed FLUXION unit `T-EXPOSURE v2` from `docs/judge/mandati/T-EXPOSURE.md` exactly, M1 through M6 only.

          Authorization already granted by the founder for this exact mandate:
          GO FOUNDER T-EXPOSURE mandate_sha256=14e21bc77cada3f5105fea4874ffb6f9156bb8b09cbf466c390c45ee1ede63a5

          You are Claude Code local and only the machine executor. Do not author, repair, redesign or reinterpret any code or instruction. If any pinned fact, gate, path, hash, machine authority, lane lock, STOP control or expected PASS/FAIL count differs, fail closed and produce the mandated RED closure without adapting the unit.

          Execute GATE-0 and then M1-M6 exactly as written. Preserve all sensitive local bytes; never read/print DB, licence, secret or customer contents. Never touch :3002, telephony or application runtime. Never use history rewrite, force push, direct master push, git add -A, reset, clean, stash, restore, rebase or permission bypass.

          The execution must finish on the dedicated result branch required by the mandate, publish that branch, and open the execution PR toward master if and only if the mandate reaches M6 GREEN. Do not merge or enable auto-merge. Do not perform the independent semantic review yourself.

          The final line of stdout must be exactly `VERDETTO: VERDE` or `VERDETTO: ROSSO`.
          EOF

          claude --bare -p \
            --system-prompt-file "$FLUXION_ROOT/docs/judge/HEADLESS-CC-EXECUTOR-SYSTEM.md" \
            --permission-mode dontAsk \
            --tools "Bash,Read,Grep,Glob" \
            --allowedTools "Read" "Grep" "Glob" "Bash" \
            --disallowedTools "Edit,Write,NotebookEdit,Agent,WebFetch,WebSearch" \
            --disable-slash-commands \
            --max-turns 100 \
            --output-format text \
            "$(cat "$PROMPT_FILE")" \
            > "$RUN_DIR/claude.stdout" 2> "$RUN_DIR/claude.stderr"
          rc=$?
          printf '%s\n' "$rc" > "$RUN_DIR/claude.rc"
          cat "$RUN_DIR/claude.stdout"
          exit "$rc"

      - name: Publish content-addressed RESULT draft
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DRAFT_BUS="$HOME/.local/bin/fluxion-draft-bus-secure"
          cd "$FLUXION_ROOT"
          RUN_DIR="$(git rev-parse --git-dir)/vos-control/headless/$TASK_ID-${GITHUB_RUN_ID}"
          mkdir -p "$RUN_DIR"
          touch "$RUN_DIR/claude.stdout" "$RUN_DIR/claude.stderr" "$RUN_DIR/claude.rc" "$RUN_DIR/task.txt"
          verdict="$(grep -E '^VERDETTO: (VERDE|ROSSO)$' "$RUN_DIR/claude.stdout" 2>/dev/null | tail -n1 || true)"
          branch="$(git branch --show-current 2>/dev/null || true)"
          head="$(git rev-parse HEAD 2>/dev/null || true)"
          if [ "$verdict" = "VERDETTO: VERDE" ] && [ -n "$head" ] && [ "$branch" != "master" ]; then
            status="PASS"
            result_commit="$head"
          elif [ -n "$verdict" ]; then
            status="FAIL"
            result_commit="NONE"
          else
            status="BLOCKED"
            result_commit="NONE"
          fi

          printf 'task_id=%s\nstatus=%s\nbranch=%s\nresult_commit=%s\nverdict=%s\n' \
            "$TASK_ID" "$status" "$branch" "$result_commit" "$verdict" \
            > "$RUN_DIR/summary.txt"

          PACKET="$RUN_DIR/result-${TASK_ID}-${GITHUB_RUN_ID}.zip"
          python3 - "$RUN_DIR" "$PACKET" <<'PY'
          import sys, zipfile
          from pathlib import Path
          run = Path(sys.argv[1]); packet = Path(sys.argv[2])
          names = ['claude.stdout','claude.stderr','claude.rc','summary.txt','task.txt']
          with zipfile.ZipFile(packet, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p = run / name
                  if p.exists(): z.write(p, arcname=name)
          PY
          packet_sha="$(shasum -a 256 "$PACKET" | awk '{print $1}')"
          packet_name="$(basename "$PACKET")"
          base="$(git merge-base origin/master HEAD 2>/dev/null || git rev-parse origin/master)"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          META="$RUN_DIR/result.json"
          python3 - "$META" "$created" "$base" "$result_commit" "$status" "$packet_name" "$packet_sha" "$branch" "$verdict" <<'PY'
          import json, sys
          path, created, base, result_commit, status, packet_name, packet_sha, branch, verdict = sys.argv[1:]
          data = {
              'schema_version': 1,
              'channel': 'FXD-824F35830C8A',
              'kind': 'RESULT',
              'session_id': 'CC-IMPLEMENTER-900001',
              'task_id': 'T-EXPOSURE.EXECUTE.20260807',
              'created_at': created,
              'base_commit': base,
              'result_commit': result_commit,
              'status': status,
              'packet_name': packet_name,
              'packet_sha256': packet_sha,
              'summary': f'headless_runner=true;branch={branch};verdict={verdict or "MISSING"};next_event=' + ('INDEPENDENT_REVIEW_T_EXPOSURE_EXECUTION_PR' if status == 'PASS' else 'SOL_ORCHESTRATOR_TRIAGE'),
          }
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2, sort_keys=True); f.write('\n')
          PY
          "$DRAFT_BUS" create-result-draft "$META" "$PACKET"

      - name: Enforce execution outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$FLUXION_ROOT"
          RUN_DIR="$(git rev-parse --git-dir)/vos-control/headless/$TASK_ID-${GITHUB_RUN_ID}"
          verdict="$(grep -E '^VERDETTO: (VERDE|ROSSO)$' "$RUN_DIR/claude.stdout" 2>/dev/null | tail -n1 || true)"
          test "$verdict" = "VERDETTO: VERDE"
