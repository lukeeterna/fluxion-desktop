name: FLUXION TCC Canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tcc-canary:
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 5
    steps:
      - name: Read-only TCC and filesystem discrimination
        shell: bash
        run: |
          set +e
          RUNNER="/Users/macbook/actions-runner-fluxion/bin/Runner.Listener"
          REPO="/Volumes/MontereyT7/FLUXION"
          VOL="/Volumes/MontereyT7"
          
          echo "=== TCC CANARY IDENTITY ==="
          whoami
          id
          pwd -P
          printf 'SHELL_PID=%s SHELL_PPID=%s\n' "$$" "$PPID"
          ps -o pid=,ppid=,user=,comm=,args= -p "$$" -p "$PPID" 2>&1
          pgrep -af 'Runner.Listener|Runner.Worker|runsvc.sh' 2>&1
          
          echo
          echo "=== ACCESS PROBES ==="
          ls -ld "$VOL"
          rc=$?
          echo "LS_VOLUME_RC=$rc"
          ls -ld "$REPO/.git"
          rc=$?
          echo "LS_REPO_GIT_RC=$rc"
          git -C "$REPO" rev-parse HEAD
          rc=$?
          echo "GIT_HEAD_RC=$rc"
          head -c 32 "$REPO/.git/HEAD"
          rc=$?
          echo
          echo "READ_GIT_HEAD_RC=$rc"
          
          echo
          echo "=== RUNNER CODESIGN METADATA ==="
          /usr/bin/codesign -dv --verbose=4 "$RUNNER" 2>&1 | grep -Ei 'Identifier|TeamIdentifier|Authority|Signature|flags'
          rc=${PIPESTATUS[0]}
          echo "CODESIGN_METADATA_RC=$rc"
          
          echo
          echo "=== RUNNER DESIGNATED REQUIREMENT ==="
          /usr/bin/codesign -d -r- "$RUNNER" 2>&1
          rc=$?
          echo "CODESIGN_DR_RC=$rc"
          
          echo
          echo "=== TCC LOG ==="
          /usr/bin/log show --last 30m --style compact --predicate '(process == "tccd") OR (subsystem == "com.apple.TCC")' 2>&1 | tail -80
          rc=${PIPESTATUS[0]}
          echo "TCC_LOG_RC=$rc"
          
          echo
          echo "=== MOUNT ==="
          /sbin/mount | grep -i MontereyT7
          rc=${PIPESTATUS[0]}
          echo "MOUNT_MONTEREYT7_RC=$rc"
          
          echo
          echo "=== FLAGS ACL XATTR ==="
          ls -ldO@ "$VOL" "$REPO" 2>&1
          rc=$?
          echo "FLAGS_ACL_RC=$rc"
          
          echo
          echo "TCC_CANARY_COMPLETE=YES"
          exit 0
