name: VOS Rollover Diagnostic

on:
  push:
    branches:
      - sol/vos-zero-shuttle-20260828
    paths:
      - '.github/workflows/vos-rollover-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect failed rollover JSONL only
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 5
    steps:
      - name: Sanitize command execution evidence
        shell: bash
        run: |
          set -euo pipefail
          set +x
          jsonl="/Volumes/MontereyT7/VOS_FABRIC_SPIKE/20260823T170806/evidence/zero-shuttle-rollover-33193354147/evidence/context-rollover.jsonl"
          test -f "$jsonl"
          python3 - "$jsonl" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          count = 0
          for lineno, raw in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              if not raw.strip():
                  continue
              event = json.loads(raw)
              item = event.get('item') if isinstance(event, dict) else None
              if isinstance(item, dict) and item.get('type') == 'command_execution':
                  count += 1
                  print('COMMAND_EVENT_LINE=' + str(lineno))
                  print('EVENT_TYPE=' + str(event.get('type')))
                  print('COMMAND=' + repr(item.get('command')))
                  print('STATUS=' + repr(item.get('status')))
                  print('EXIT_CODE=' + repr(item.get('exit_code')))
                  print('OUTPUT=' + repr(item.get('aggregated_output')))
          print('COMMAND_EVENT_COUNT=' + str(count))
          print('JSONL_READ_ONLY=YES')
          PY
