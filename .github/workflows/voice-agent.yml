name: Fluxion Voice Agent CI/CD

on:
  push:
    branches: [master, main]
    paths:
      - 'voice-agent/**'
      - '.github/workflows/voice-agent.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'voice-agent/**'
      - '.github/workflows/voice-agent.yml'
  schedule:
    - cron: '0 6 * * *'

env:
  PYTHON_VERSION: '3.11'
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('voice-agent/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        working-directory: voice-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff mypy pytest pytest-asyncio
      - name: Run Ruff linter
        working-directory: voice-agent
        run: ruff check src/ tests/
      - name: Run Ruff formatter check
        working-directory: voice-agent
        run: ruff format --check src/ tests/
      - name: Run MyPy type check
        working-directory: voice-agent
        run: mypy src/ --ignore-missing-imports --follow-imports=skip || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('voice-agent/requirements.txt') }}
      - name: Install dependencies
        working-directory: voice-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio pytest-cov
      - name: Run unit tests
        working-directory: voice-agent
        run: |
          pytest tests/ -v \
            --ignore=tests/test_booking_e2e_complete.py \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -x
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./voice-agent/coverage.xml
          flags: unittests
          name: voice-agent-unit-tests

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        working-directory: voice-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Run E2E tests
        working-directory: voice-agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest tests/test_booking_e2e_complete.py -v --tb=short || true

  complete-tests:
    name: Complete Test Suite (CoVe)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        working-directory: voice-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Run Complete Test Suite
        working-directory: voice-agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/test_voice_agent_complete.py -v --tb=short \
            -k "TestClientMatchingSecurity or TestPhoneticMatching or TestIntentClassification or TestStateMachineTransitions" || true

  smoke-tests:
    name: Smoke Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: voice-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        working-directory: voice-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
      - name: Smoke Test - Import Modules
        working-directory: voice-agent
        shell: bash
        run: |
          python -c "from src.booking_state_machine import BookingStateMachine; print('BookingStateMachine OK')"
          python -c "from src.disambiguation_handler import DisambiguationHandler; print('DisambiguationHandler OK')"
          python -c "from src.intent_classifier import classify_intent; print('IntentClassifier OK')"
          python -c "from src.entity_extractor import extract_all; print('EntityExtractor OK')"
          python -c "from src.latency_optimizer import FluxionLatencyOptimizer; print('FluxionLatencyOptimizer OK')"
          python -c "from src.turn_tracker import FluxionTurnTracker; print('FluxionTurnTracker OK')"
          python -c "from src.groq_client import GroqClient; print('GroqClient OK')"
          python -c "from src.stt import get_stt_engine; print('STT OK')"
          python -c "from src.tts import get_tts_engine; print('TTS OK')"
          python -c "from src.analytics import ConversationLogger; print('Analytics OK')"
      - name: Smoke Test - State Machine
        working-directory: voice-agent
        shell: bash
        run: |
          python - <<'PY'
          from src.booking_state_machine import BookingStateMachine, BookingState
          sm = BookingStateMachine()
          assert sm.context.state == BookingState.IDLE
          assert len(list(BookingState)) == 23
          print('State machine smoke PASS')
          PY
      - name: Smoke Test - Intent Classification
        working-directory: voice-agent
        shell: bash
        run: |
          python - <<'PY'
          from src.intent_classifier import classify_intent, IntentCategory
          result = classify_intent('Vorrei prenotare')
          assert result.category == IntentCategory.PRENOTAZIONE
          assert result.confidence > 0.7
          assert classify_intent('Voglio cancellare').category == IntentCategory.CANCELLAZIONE
          assert classify_intent('Sì, confermo').category == IntentCategory.CONFERMA
          print('Intent smoke PASS')
          PY

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: smoke-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        working-directory: voice-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run Performance Tests
        working-directory: voice-agent
        run: |
          python - <<'PY'
          import time
          import tracemalloc
          from src.booking_state_machine import BookingStateMachine
          start = time.time()
          sm = BookingStateMachine()
          sm.handle_input('Vorrei prenotare')
          elapsed = (time.time() - start) * 1000
          print(f'State machine latency: {elapsed:.1f}ms')
          assert elapsed < 1000
          tracemalloc.start()
          sessions = []
          for i in range(100):
              item = BookingStateMachine()
              item.context.session_id = f'test_{i}'
              item.handle_input('Test')
              sessions.append(item)
          current, _ = tracemalloc.get_traced_memory()
          tracemalloc.stop()
          memory_per_session = current / 100
          print(f'Memory per session: {memory_per_session / 1024:.1f}KB')
          assert memory_per_session < 1_000_000
          PY

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install security tools
        run: python -m pip install bandit safety
      - name: Run Bandit security scan
        working-directory: voice-agent
        run: bandit -r src/ -f json -o bandit-report.json || true
      - name: Check for hardcoded secret literals
        working-directory: voice-agent
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import sys

          MARKERS = ('api_key', 'apikey', 'token', 'secret', 'password')
          findings = []

          def sensitive(name):
              return any(marker in name.lower() for marker in MARKERS)

          def literal(value):
              return isinstance(value, ast.Constant) and isinstance(value.value, str) and len(value.value.strip()) >= 8

          def names(target):
              if isinstance(target, ast.Name):
                  return [target.id]
              if isinstance(target, ast.Attribute):
                  return [target.attr]
              if isinstance(target, (ast.Tuple, ast.List)):
                  return [name for item in target.elts for name in names(item)]
              return []

          for path in Path('src').rglob('*.py'):
              if path.name.startswith('._') or any(part.startswith('._') for part in path.parts):
                  continue
              try:
                  tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              except (UnicodeDecodeError, SyntaxError) as exc:
                  print(f'Cannot scan {path}: {exc}', file=sys.stderr)
                  sys.exit(2)

              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign):
                      target_names = [name for target in node.targets for name in names(target)]
                      if any(sensitive(name) for name in target_names) and literal(node.value):
                          findings.append(f'{path}:{node.lineno}: literal assigned to {target_names}')
                  elif isinstance(node, ast.AnnAssign):
                      target_names = names(node.target)
                      if any(sensitive(name) for name in target_names) and node.value is not None and literal(node.value):
                          findings.append(f'{path}:{node.lineno}: literal assigned to {target_names}')
                  elif isinstance(node, ast.Call):
                      for keyword in node.keywords:
                          if keyword.arg and sensitive(keyword.arg) and literal(keyword.value):
                              findings.append(f'{path}:{node.lineno}: literal passed as {keyword.arg}')

          if findings:
              print('Potential hardcoded secret literals found:', file=sys.stderr)
              print('\n'.join(findings), file=sys.stderr)
              sys.exit(1)
          print('No hardcoded secret literals detected')
          PY

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [smoke-tests, performance]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        working-directory: voice-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build package
        working-directory: voice-agent
        shell: bash
        run: |
          mkdir -p dist/fluxion-voice-agent
          cp -r src/ dist/fluxion-voice-agent/
          cp main.py requirements.txt dist/fluxion-voice-agent/
          cp requirements-windows.txt dist/fluxion-voice-agent/ || true
          cd dist
          tar -czf fluxion-voice-agent.tar.gz fluxion-voice-agent/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxion-voice-agent
          path: voice-agent/dist/fluxion-voice-agent.tar.gz
          retention-days: 7

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-tests, complete-tests, smoke-tests, performance, security]
    if: always()
    steps:
      - name: Check critical jobs
        shell: bash
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Complete Tests: ${{ needs.complete-tests.result }}"
          echo "Smoke Tests: ${{ needs.smoke-tests.result }}"
          echo "Performance: ${{ needs.performance.result }}"
          echo "Security: ${{ needs.security.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.smoke-tests.result }}" != "success" ] || \
             [ "${{ needs.performance.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            exit 1
          fi
