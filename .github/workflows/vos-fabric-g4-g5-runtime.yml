name: VOS Fabric G4 G5 Runtime

on:
  push:
    branches:
      - "sol/vos-fabric-g4-g5-runtime-*"
    paths:
      - "docs/judge/runtime-triggers/vos-fabric-g4-g5-live.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vos-fabric-g4-g5-runtime
  cancel-in-progress: false

jobs:
  certify:
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 15
    env:
      FABRIC_SHA: 18752fb147f6700d4dc0633a55b9367d00ef0d91
      G3_SHA: 1f16ab2505480adab67b20411cf0b5819179a2b2
      MANDATE_SHA256: 9a7785af557da76405dfd2b28f9a9b481603f51a8e6bd77057132722a36ad46c
      VOS_CODEX_MODEL: gpt-5.6-terra
      G2_QUALIFICATION_REF: "G2=GREEN;run=34964332252;job=certify;fabric=18752fb147f6700d4dc0633a55b9367d00ef0d91;head=4d71653fce595c043636f78ae75aafa7f5612435;runtime_parent_run=34888246045;runtime_parent_job=104321135055"
      G2_CERT_JOB_ID: "104365115820"
      G2_SOURCE_THREAD_ID: "01a0a453-c93a-71c0-a3b9-3a579a7510b1"
      G2_GATE_SHA256: 3f0846f4acb50a278c6ddfc764f7b180127d7f282589f21c2567148c641cf362
      G2_CODEX_VERSION: "0.154.0"
    steps:
      - name: Certify routed PUBLIC-only G4 G5 chain on isolated worker
        shell: bash
        run: |
          set -euo pipefail
          : "${G2_QUALIFICATION_REF:?}"
          : "${G2_SOURCE_THREAD_ID:?}"
          case "$G2_QUALIFICATION_REF" in
            *"G2=GREEN"*"run=34964332252"*"job=certify"*"fabric=${FABRIC_SHA}"*"head=4d71653fce595c043636f78ae75aafa7f5612435"*) ;;
            *) echo 'G4_G5_BLOCKED=G2_QUALIFICATION_REF_INVALID' >&2; exit 2 ;;
          esac
          [ "$G2_CERT_JOB_ID" = "104365115820" ] || { echo 'G4_G5_BLOCKED=G2_CERT_JOB_ID_INVALID' >&2; exit 2; }

          SRC="$RUNNER_TEMP/vos-g4-g5-${GITHUB_RUN_ID}"
          rm -rf "$SRC"
          mkdir -p "$SRC/fabric" "$SRC/runtime"
          cleanup_local() { rm -rf "$SRC"; }
          trap cleanup_local EXIT INT TERM

          fluxion_base="https://raw.githubusercontent.com/lukeeterna/fluxion-desktop/${GITHUB_SHA}"
          fabric_base="https://raw.githubusercontent.com/lukeeterna/venture-os/${FABRIC_SHA}"
          for path in bridge.py checkpoint.py rollover.py router.py worker_adapter.py; do
            curl -4 -fsSL --connect-timeout 8 --max-time 30 --retry 4 --retry-delay 2 --retry-all-errors \
              "$fabric_base/components/fabric/$path" -o "$SRC/fabric/$path"
            test -s "$SRC/fabric/$path"
          done
          for path in \
            tests/vos_fabric_g4_g5_runtime.py \
            tests/vos_fabric_live_codex_worker.py \
            docs/judge/mandati/T-VOS-FABRIC-G4-G5.md \
            docs/judge/mandati/T-VOS-FABRIC-G4-G5.json; do
            out="$SRC/runtime/$(basename "$path")"
            curl -4 -fsSL --connect-timeout 8 --max-time 30 --retry 4 --retry-delay 2 --retry-all-errors \
              "$fluxion_base/$path" -o "$out"
            test -s "$out"
          done

          python3 - "$SRC/runtime/T-VOS-FABRIC-G4-G5.md" "$SRC/runtime/T-VOS-FABRIC-G4-G5.json" "$MANDATE_SHA256" <<'PY'
          import hashlib,json,sys
          md,manifest_path,expected=sys.argv[1:]
          actual=hashlib.sha256(open(md,'rb').read()).hexdigest()
          manifest=json.load(open(manifest_path,encoding='utf-8'))
          assert actual == expected == manifest['mandate_sha256']
          assert manifest['max_cost_usd'] == 0
          assert manifest['paid_api_fallback'] is False
          assert manifest['quota_circumvention'] is False
          assert manifest['production_mutation'] is False
          print('G4_G5_MANDATE_EXACT_SHA=GREEN')
          PY
          python3 -m py_compile "$SRC/runtime/vos_fabric_g4_g5_runtime.py" "$SRC/runtime/vos_fabric_live_codex_worker.py" "$SRC/fabric/"*.py

          tar -C "$SRC" -czf "$SRC/bundle.tgz" fabric runtime
          BUNDLE_SHA="$(shasum -a 256 "$SRC/bundle.tgz" | awk '{print $1}')"
          PROXY_PORT=$((26000 + GITHUB_RUN_ID % 10000))
          AUTH_REF="mandate_sha256=${MANDATE_SHA256};g3=${G3_SHA};fabric=${FABRIC_SHA};g2=${G2_QUALIFICATION_REF};g2_job_id=${G2_CERT_JOB_ID}"

          PROXY="$SRC/proxy.py"
          cat > "$PROXY" <<'PY'
          #!/usr/bin/env python3
          import os,select,socket,socketserver
          bind=("192.168.64.1",int(os.environ["VOS_PROXY_PORT"]))
          allowed_source=os.environ["VOS_GUEST_IP"]
          class Handler(socketserver.StreamRequestHandler):
              def handle(self):
                  if self.client_address[0] != allowed_source: return
                  self.connection.settimeout(30)
                  line=self.rfile.readline(8192).decode("ascii","replace").strip(); parts=line.split()
                  if len(parts)!=3 or parts[0].upper()!="CONNECT" or ":" not in parts[1]: return
                  host,port_s=parts[1].rsplit(":",1)
                  try: port=int(port_s)
                  except ValueError: return
                  if port!=443:
                      self.wfile.write(b"HTTP/1.1 403 Forbidden\r\n\r\n"); return
                  print("CONNECT_HOST=%s:443"%host,flush=True)
                  while True:
                      h=self.rfile.readline(8192)
                      if h in (b"\r\n",b"\n",b""): break
                  try: upstream=socket.create_connection((host,443),timeout=20)
                  except OSError as exc:
                      print("UPSTREAM_ERROR=%s"%type(exc).__name__,flush=True)
                      self.wfile.write(b"HTTP/1.1 502 Bad Gateway\r\n\r\n"); return
                  with upstream:
                      upstream.setblocking(False); self.connection.setblocking(False)
                      self.wfile.write(b"HTTP/1.1 200 Connection Established\r\n\r\n")
                      sockets=[self.connection,upstream]
                      while True:
                          readable,_,exceptional=select.select(sockets,[],sockets,120)
                          if exceptional or not readable: return
                          for src in readable:
                              dst=upstream if src is self.connection else self.connection
                              try: data=src.recv(65536)
                              except OSError: return
                              if not data: return
                              try: dst.sendall(data)
                              except OSError: return
          class Server(socketserver.ThreadingTCPServer):
              allow_reuse_address=True; daemon_threads=True
          with Server(bind,Handler) as server:
              print("READY=%s:%d source=%s"%(bind[0],bind[1],allowed_source),flush=True)
              server.serve_forever()
          PY
          chmod 700 "$PROXY"

          HOST="$SRC/host.sh"
          cat > "$HOST" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          export LC_ALL=C LANG=C
          : "${VOS_PROXY_PORT:?}"; : "${FABRIC_SHA:?}"; : "${G3_SHA:?}"; : "${MANDATE_SHA256:?}"
          : "${VOS_CODEX_MODEL:?}"; : "${G2_QUALIFICATION_REF:?}"; : "${G2_SOURCE_THREAD_ID:?}"
          : "${G2_CERT_JOB_ID:?}"; : "${G2_GATE_SHA256:?}"; : "${G2_CODEX_VERSION:?}"
          : "${BUNDLE_SHA:?}"; : "${AUTH_REF:?}"
          fail(){ printf 'G4_G5_BLOCKED=%s\n' "$*" >&2; exit 2; }
          pass(){ printf 'PASS %-34s %s\n' "$1" "${2:-}"; }
          bounded(){
            local seconds="$1"; shift
            /usr/bin/python3 - "$seconds" "$@" <<'PY'
          import subprocess,sys
          seconds=float(sys.argv[1]); cmd=sys.argv[2:]
          try:
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=seconds)
              if p.stdout: print(p.stdout,end='')
              raise SystemExit(p.returncode)
          except subprocess.TimeoutExpired as exc:
              out=exc.stdout or ''
              if isinstance(out,bytes): out=out.decode('utf-8','replace')
              if out: print(out,end='')
              print('BOUNDED_COMMAND_TIMEOUT=1')
              raise SystemExit(124)
          PY
          }
          production_green(){
            uid="$(id -u)"
            launch_running(){
              label="$1"
              for domain in "gui/$uid" "user/$uid" system; do
                launchctl print "$domain/$label" 2>/dev/null | grep -Eq 'state = running|pid = [0-9]+' && return 0
              done
              launchctl list 2>/dev/null | awk -v label="$label" '$3==label && $1 ~ /^[0-9]+$/ {ok=1} END{exit ok?0:1}'
            }
            launch_running com.zeroclaw.fall-detector && launch_running com.go2rtc && launch_running com.mosquitto.broker && \
            curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null && \
            lsof -nP -iTCP:3002 -sTCP:LISTEN 2>/dev/null | grep -q ':3002' && \
            { lsof -nP -iUDP:5080 2>/dev/null | grep -q ':5080' || lsof -nP -iTCP:5080 -sTCP:LISTEN 2>/dev/null | grep -q ':5080'; } && \
            mount | grep -q ' on /Volumes/NAS_LOCAL '
          }
          production_green || fail PRE_PRODUCTION_REGRESSION
          pass PRE_PRODUCTION 'Guardian/FLUXION/NAS green'

          MP=''
          for c in "$(command -v multipass 2>/dev/null || true)" /usr/local/bin/multipass /opt/homebrew/bin/multipass "/Library/Application Support/com.canonical.multipass/bin/multipass"; do
            [ -n "$c" ] && [ -x "$c" ] && { MP="$c"; break; }
          done
          [ -n "$MP" ] || fail MULTIPASS_MISSING
          guest_ip="$(bounded 25 "$MP" exec vos-worker -- sh -c "hostname -I | awk '{print \$1}'" | tail -1)" || fail VOS_WORKER_UNREACHABLE
          printf '%s\n' "$guest_ip" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' || fail GUEST_IP_FORMAT
          [ "$(bounded 25 "$MP" exec vos-worker -- sh -c 'cat /var/lib/vos-fabric/worker-owner' | tail -1)" = VOS_FABRIC_G2 ] || fail VOS_WORKER_OWNER
          [ "$(bounded 25 "$MP" exec vos-worker -- /usr/local/bin/codex --version | tail -1)" = "codex-cli ${G2_CODEX_VERSION}" ] || fail CODEX_VERSION_DRIFT
          [ "$(bounded 25 "$MP" exec vos-worker -- sha256sum /usr/local/lib/vos-fabric/codex_worker_gate.sh | awk 'NF{v=$1} END{print v}')" = "$G2_GATE_SHA256" ] || fail G2_GATE_SHA_DRIFT
          bounded 25 "$MP" exec vos-worker -- sh -c 'if mount | grep -Eq " type (9p|virtiofs|fuse\.multipass-sshfs|fuse\.sshfs) "; then exit 9; fi' >/dev/null || fail UNEXPECTED_HOST_MOUNT
          bounded 25 "$MP" exec vos-worker -- timeout 15s env CODEX_HOME=/home/ubuntu/.codex-vos-fabric /usr/local/bin/codex login status >/dev/null || fail CODEX_AUTH_NOT_PERSISTED
          pass VOS_WORKER_BOUNDARY "guest=$guest_ip exact G2 owner/gate/auth/no-host-mounts"

          actual_bundle="$(shasum -a 256 /tmp/vos-g4-g5-bundle.tgz | awk '{print $1}')"
          [ "$actual_bundle" = "$BUNDLE_SHA" ] || fail BUNDLE_SHA_MISMATCH
          guest_root="/tmp/vos-fabric-g4-g5-${GITHUB_RUN_ID}"
          bounded 30 "$MP" exec vos-worker -- rm -rf "$guest_root" >/dev/null || fail GUEST_CLEANUP_PRE
          bounded 30 "$MP" exec vos-worker -- mkdir -p "$guest_root" >/dev/null || fail GUEST_ROOT_CREATE
          bounded 60 "$MP" transfer /tmp/vos-g4-g5-bundle.tgz "vos-worker:$guest_root/bundle.tgz" >/dev/null || fail BUNDLE_TRANSFER
          bounded 30 "$MP" exec vos-worker -- tar -C "$guest_root" -xzf "$guest_root/bundle.tgz" >/dev/null || fail BUNDLE_EXTRACT
          bounded 30 "$MP" exec vos-worker -- rm -f "$guest_root/bundle.tgz" >/dev/null || fail BUNDLE_REMOVE

          proxy_pid=''
          cleanup(){
            [ -z "$proxy_pid" ] || kill "$proxy_pid" >/dev/null 2>&1 || true
            bounded 25 "$MP" exec vos-worker -- rm -rf "$guest_root" >/dev/null 2>&1 || true
            rm -f /tmp/vos-g4-g5-bundle.tgz /tmp/vos-g4-g5-proxy.py /tmp/vos-g4-g5-proxy.log
          }
          trap cleanup EXIT INT TERM
          VOS_PROXY_PORT="$VOS_PROXY_PORT" VOS_GUEST_IP="$guest_ip" /usr/bin/python3 /tmp/vos-g4-g5-proxy.py > /tmp/vos-g4-g5-proxy.log 2>&1 & proxy_pid=$!
          for _ in 1 2 3 4 5; do
            grep -q "^READY=192.168.64.1:${VOS_PROXY_PORT} source=${guest_ip}$" /tmp/vos-g4-g5-proxy.log 2>/dev/null && break
            sleep 1
          done
          grep -q "^READY=192.168.64.1:${VOS_PROXY_PORT} source=${guest_ip}$" /tmp/vos-g4-g5-proxy.log || fail PROXY_NOT_READY
          pass EPHEMERAL_PROXY "port=$VOS_PROXY_PORT source=$guest_ip CONNECT:443 only"

          common=(
            --fabric-dir "$guest_root/fabric"
            --runtime-dir "$guest_root/runtime"
            --live-worker "$guest_root/runtime/vos_fabric_live_codex_worker.py"
            --mandate-md "$guest_root/runtime/T-VOS-FABRIC-G4-G5.md"
            --mandate-json "$guest_root/runtime/T-VOS-FABRIC-G4-G5.json"
            --authorization-ref "$AUTH_REF"
            --fabric-sha "$FABRIC_SHA"
            --model "$VOS_CODEX_MODEL"
            --proxy-url "http://192.168.64.1:${VOS_PROXY_PORT}"
            --g2-qualification-ref "$G2_QUALIFICATION_REF"
          )
          set +e
          stage1_out="$(bounded 240 "$MP" exec vos-worker -- /usr/bin/python3 "$guest_root/runtime/vos_fabric_g4_g5_runtime.py" stage1 "${common[@]}" --g2-source-thread-id "$G2_SOURCE_THREAD_ID" 2>&1)"
          stage1_rc=$?
          set -e
          printf '%s\n' "$stage1_out"
          if [ "$stage1_rc" -ne 0 ]; then
            echo '--- G4_G5_PROXY_TRACE ---'
            grep -E '^(READY|CONNECT_HOST|UPSTREAM_ERROR)=' /tmp/vos-g4-g5-proxy.log || true
            echo '--- END_G4_G5_PROXY_TRACE ---'
            fail "G4_STAGE1_RC=$stage1_rc"
          fi
          pass G4_STAGE1 'router -> bridge -> exact G2 continuation -> checkpoint'

          set +e
          stage2_out="$(bounded 360 "$MP" exec vos-worker -- /usr/bin/python3 "$guest_root/runtime/vos_fabric_g4_g5_runtime.py" stage2 "${common[@]}" 2>&1)"
          stage2_rc=$?
          set -e
          printf '%s\n' "$stage2_out"
          [ "$stage2_rc" -eq 0 ] || fail "G5_STAGE2_RC=$stage2_rc"
          pass G5_STAGE2 'durable reload -> fork -> exactly-once replay guard -> resume'

          bounded 30 "$MP" exec vos-worker -- python3 - "$guest_root/runtime/g4-g5-runtime-evidence.json" <<'PY'
          import json,sys
          e=json.load(open(sys.argv[1],encoding='utf-8'))
          assert e['g4']=='GREEN' and e['g5']=='GREEN' and e['router']=='GREEN'
          assert e['data_class']=='PUBLIC' and e['data_policy']=='PUBLIC_ONLY'
          assert e['founder_prompt_shuttling']==0
          assert e['paid_api_fallback']==0 and e['production_mutations']==0
          assert e['effect_claimed_once'] is True and e['effect_replay_claimed_now'] is False
          print('G4_G5_FINAL_EVIDENCE_OBJECT=GREEN')
          PY
          evidence_sha="$(bounded 25 "$MP" exec vos-worker -- sha256sum "$guest_root/runtime/g4-g5-runtime-evidence.json" | awk 'NF{v=$1} END{print v}')"
          checkpoint_sha="$(bounded 25 "$MP" exec vos-worker -- sha256sum "$guest_root/runtime/g5.checkpoint.json" | awk 'NF{v=$1} END{print v}')"
          printf '%s\n' "$evidence_sha" | grep -Eq '^[0-9a-f]{64}$' || fail EVIDENCE_HASH
          printf '%s\n' "$checkpoint_sha" | grep -Eq '^[0-9a-f]{64}$' || fail CHECKPOINT_HASH
          pass EVIDENCE_HASHES "final=$evidence_sha checkpoint=$checkpoint_sha"

          production_green || fail POST_PRODUCTION_REGRESSION
          bounded 25 "$MP" exec vos-worker -- sh -c 'if mount | grep -Eq " type (9p|virtiofs|fuse\.multipass-sshfs|fuse\.sshfs) "; then exit 9; fi' >/dev/null || fail UNEXPECTED_HOST_MOUNT_AFTER
          pass POST_PRODUCTION 'Guardian/FLUXION/NAS green; no host mounts'
          echo "FABRIC_SHA=$FABRIC_SHA"
          echo "G3_SHA=$G3_SHA"
          echo "G2_QUALIFICATION_REF_SHA256=$(printf '%s' "$G2_QUALIFICATION_REF" | shasum -a 256 | awk '{print $1}')"
          echo "G2_SOURCE_THREAD_ID_SHA256=$(printf '%s' "$G2_SOURCE_THREAD_ID" | shasum -a 256 | awk '{print $1}')"
          echo "G4_G5_FINAL_EVIDENCE_SHA256=$evidence_sha"
          echo "G5_FINAL_CHECKPOINT_SHA256=$checkpoint_sha"
          echo 'FOUNDER_PROMPT_SHUTTLING=0'
          echo 'G5_DUPLICATED_EFFECTS=0'
          echo 'G4_G5_PAID_API_FALLBACK=0'
          echo 'PRODUCTION_MUTATIONS=0'
          echo 'G4=GREEN'
          echo 'G5=GREEN'
          REMOTE
          chmod 700 "$HOST"

          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$SRC/bundle.tgz" imac:/tmp/vos-g4-g5-bundle.tgz
          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$PROXY" imac:/tmp/vos-g4-g5-proxy.py
          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$HOST" imac:/tmp/vos-g4-g5-host.sh
          ssh -o BatchMode=yes -o ConnectTimeout=8 imac \
            "GITHUB_RUN_ID='$GITHUB_RUN_ID' VOS_PROXY_PORT='$PROXY_PORT' FABRIC_SHA='$FABRIC_SHA' G3_SHA='$G3_SHA' MANDATE_SHA256='$MANDATE_SHA256' VOS_CODEX_MODEL='$VOS_CODEX_MODEL' BUNDLE_SHA='$BUNDLE_SHA' AUTH_REF='$AUTH_REF' G2_QUALIFICATION_REF='$G2_QUALIFICATION_REF' G2_CERT_JOB_ID='$G2_CERT_JOB_ID' G2_SOURCE_THREAD_ID='$G2_SOURCE_THREAD_ID' G2_GATE_SHA256='$G2_GATE_SHA256' G2_CODEX_VERSION='$G2_CODEX_VERSION' bash /tmp/vos-g4-g5-host.sh </dev/null; rc=\$?; rm -f /tmp/vos-g4-g5-host.sh; exit \$rc"
