name: U3 targeted validation

on:
  push:
    branches:
      - validate/u3-nlu-fsm-bypass-20260816

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: voice-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: voice-agent/requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Targeted U3 regression test
        run: pytest tests/test_nlu_fsm_bypass.py -q

      - name: Python compile gate
        run: python3 -m py_compile src/orchestrator.py tests/test_nlu_fsm_bypass.py

      - name: Diff whitespace gate
        working-directory: .
        run: git diff --check 80dd5b9c2170fec2a1c72b1df853975a0e9c8cc0...HEAD -- voice-agent/src/orchestrator.py voice-agent/tests/test_nlu_fsm_bypass.py
