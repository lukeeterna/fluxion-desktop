name: VOS Codex Qualification

on:
  push:
    branches:
      - sol/vos-macbook-qualification-20260825
    paths:
      - 'tools/vos_codex_qualification.py'
      - 'tests/test_vos_codex_qualification.py'
      - '.github/workflows/vos-codex-qualification-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vos-codex-qualification
  cancel-in-progress: true

jobs:
  unit:
    name: Qualification harness unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact-SHA qualification sources without checkout action
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vos-codex-qualification"
          mkdir -p "$work/tools" "$work/tests"
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          curl --fail --silent --show-error --location "$base/tools/vos_codex_qualification.py" -o "$work/tools/vos_codex_qualification.py"
          curl --fail --silent --show-error --location "$base/tests/test_vos_codex_qualification.py" -o "$work/tests/test_vos_codex_qualification.py"
          touch "$work/tests/__init__.py"
          echo "QUALIFICATION_TEST_ROOT=$work" >> "$GITHUB_ENV"
      - name: Run fail-closed qualification tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$QUALIFICATION_TEST_ROOT"
          python3 -m unittest -v tests.test_vos_codex_qualification
          python3 -m py_compile tools/vos_codex_qualification.py tests/test_vos_codex_qualification.py

  macbook:
    name: Real MacBook Codex auth + Sol + exec/resume
    needs: unit
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 15
    env:
      SPIKE_ROOT: /Volumes/MontereyT7/VOS_FABRIC_SPIKE/20260823T170806
      EXPECTED_CODEX_VERSION: 0.149.0
      EXPECTED_MODEL: gpt-5.6-sol
    steps:
      - name: Qualify exact installed Codex without touching source checkout
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set +x

          spike="$SPIKE_ROOT"
          env_file="$spike/env.sh"
          test -d "$spike"
          test -f "$env_file"

          # Never source an opaque shell file. Accept only simple environment
          # assignments/exports and reject command substitution or shell control.
          python3 - "$env_file" <<'PY'
          import re, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          bad = []
          keys = []
          assignment = re.compile(r'^(?:export[ \t]+)?([A-Za-z_][A-Za-z0-9_]*)=(.*)$')
          forbidden = ('$(', '`', ';', '&&', '||', '>', '<')
          for lineno, raw in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              match = assignment.fullmatch(line)
              if not match:
                  bad.append((lineno, 'non-assignment'))
                  continue
              key, value = match.groups()
              keys.append(key)
              if any(token in value for token in forbidden):
                  bad.append((lineno, 'shell-control'))
          print('SPIKE_ENV_KEYS=' + ','.join(sorted(set(keys))))
          if bad:
              print('SPIKE_ENV_SAFE_TO_SOURCE=NO')
              for lineno, kind in bad:
                  print(f'SPIKE_ENV_REJECT_LINE={lineno}:{kind}')
              raise SystemExit(2)
          print('SPIKE_ENV_SAFE_TO_SOURCE=YES')
          PY

          # shellcheck disable=SC1090
          source "$env_file"

          case "${CODEX_HOME:-}" in
            /Volumes/MontereyT7/*) ;;
            *) echo 'BLOCKED: CODEX_HOME is not on MontereyT7' >&2; exit 20 ;;
          esac
          test -d "$CODEX_HOME"

          # The spike may contain the extracted official binary without a PATH
          # shim. Resolve only bounded candidates under CODEX_INSTALL_DIR and
          # accept a single real executable that reports the exact qualified pin.
          candidates_file="$spike/evidence/codex-candidates-${GITHUB_RUN_ID}.txt"
          : > "$candidates_file"
          from_path="$(command -v codex || true)"
          [ -z "$from_path" ] || printf '%s\n' "$from_path" >> "$candidates_file"
          if [ -n "${CODEX_INSTALL_DIR:-}" ] && [ -d "$CODEX_INSTALL_DIR" ]; then
            for candidate in "$CODEX_INSTALL_DIR/codex" "$CODEX_INSTALL_DIR/bin/codex"; do
              [ -x "$candidate" ] && printf '%s\n' "$candidate" >> "$candidates_file"
            done
            find "$CODEX_INSTALL_DIR" -maxdepth 2 -type f -perm -111 -name 'codex*' -print 2>/dev/null >> "$candidates_file" || true
          fi

          matched_file="$spike/evidence/codex-matched-${GITHUB_RUN_ID}.txt"
          : > "$matched_file"
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            [ -x "$candidate" ] || continue
            version="$($candidate --version 2>/dev/null || true)"
            case "$version" in
              *"$EXPECTED_CODEX_VERSION"*)
                canonical="$(python3 - "$candidate" <<'PY'
          import os, sys
          print(os.path.realpath(sys.argv[1]))
          PY
          )"
                printf '%s\n' "$canonical" >> "$matched_file"
                ;;
            esac
          done < "$candidates_file"
          sort -u "$matched_file" -o "$matched_file"
          matched_count="$(sed '/^$/d' "$matched_file" | wc -l | tr -d ' ')"
          echo "CODEX_PINNED_CANDIDATE_COUNT=$matched_count"
          if [ "$matched_count" != 1 ]; then
            echo 'BLOCKED: expected exactly one executable Codex 0.149.0 candidate' >&2
            exit 21
          fi
          codex_bin="$(sed -n '1p' "$matched_file")"
          version="$($codex_bin --version 2>/dev/null || true)"
          echo "CODEX_VERSION_OBSERVED=$version"

          if "$codex_bin" login status >/dev/null 2>&1; then
            echo 'CODEX_CHATGPT_AUTH_STATUS=ACTIVE_OR_OTHER_STORED_AUTH'
          else
            echo 'CODEX_CHATGPT_AUTH_STATUS=NOT_ACTIVE'
            echo 'NEXT_SINGLE_BLOCKER=FOUNDER_CHATGPT_DEVICE_LOGIN'
            exit 23
          fi

          run_root="$spike/evidence/codex-qualification-${GITHUB_RUN_ID}"
          runtime="$run_root/runtime"
          evidence="$run_root/evidence"
          workspace="$run_root/workspace"
          mkdir -p "$runtime" "$evidence" "$workspace"

          harness="$runtime/vos_codex_qualification.py"
          raw_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/tools/vos_codex_qualification.py"
          curl --fail --silent --show-error --location "$raw_url" --output "$harness"
          chmod 700 "$harness"

          python3 "$harness" \
            --codex "$codex_bin" \
            --codex-home "$CODEX_HOME" \
            --evidence "$evidence" \
            --workspace "$workspace" \
            --model "$EXPECTED_MODEL" \
            --timeout 300

          echo "EVIDENCE_ROOT=$evidence"
          echo 'SOURCE_REPOS_MUTATED=NO'
          echo 'PAID_API_FALLBACK=NO'
          echo 'VOS_CODEX_QUALIFICATION=GREEN'
