name: Test Suite

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SQLX_OFFLINE: true
  PYTHON_VERSION: '3.12'

jobs:
  test-backend:
    name: Backend Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-
      - name: Install system dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features sqlite
        continue-on-error: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run Domain Layer Tests
        working-directory: ./src-tauri
        shell: bash
        run: cargo test --lib --verbose domain
      - name: Run Service Layer Tests
        working-directory: ./src-tauri
        shell: bash
        run: cargo test --lib --verbose services
        env:
          DATABASE_URL: "sqlite::memory:"
          RUST_LOG: debug
      - name: Run Integration Tests
        working-directory: ./src-tauri
        shell: bash
        continue-on-error: true
        run: cargo test --test '*' --verbose
        env:
          DATABASE_URL: "sqlite::memory:"
      - name: Run Documentation Tests
        working-directory: ./src-tauri
        shell: bash
        continue-on-error: true
        run: cargo test --doc --all-features --verbose

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check Rust formatting
        working-directory: ./src-tauri
        run: cargo fmt --all -- --check
      - name: Run Clippy
        working-directory: ./src-tauri
        continue-on-error: true
        run: |
          cargo clippy --all-targets --all-features --verbose -- \
            -W warnings \
            -A dead_code \
            -A unused_imports \
            -A unused_variables

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type check
        run: npx tsc --noEmit
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  build-tauri:
    name: Build Tauri App (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm
            os: macos-14
            rust_target: aarch64-apple-darwin
            executable: voice-agent
          - platform: windows
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            executable: voice-agent.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install audio deps (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Voice Agent dependencies
        working-directory: ./voice-agent
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            python -m pip install -r requirements-windows.txt
          else
            python -m pip install -r requirements.txt
          fi
          python -m pip install pyinstaller
      - name: Download Piper TTS model
        shell: bash
        run: |
          mkdir -p voice-agent/models/tts
          curl -L --fail --retry 3 -o voice-agent/models/tts/it_IT-paola-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx"
          curl -L --fail --retry 3 -o voice-agent/models/tts/it_IT-paola-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx.json"
      - name: Set PyInstaller path separator
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "PY_SEP=;" >> "$GITHUB_ENV"
          else
            echo "PY_SEP=:" >> "$GITHUB_ENV"
          fi
      - name: Build Voice Agent sidecar
        working-directory: ./voice-agent
        shell: bash
        run: |
          ADD_DATA_ARGS="--add-data models${{ env.PY_SEP }}models"
          if [ -d "config" ]; then
            ADD_DATA_ARGS="$ADD_DATA_ARGS --add-data config${{ env.PY_SEP }}config"
          fi
          pyinstaller --onefile --name voice-agent \
            $ADD_DATA_ARGS \
            --hidden-import=piper \
            --hidden-import=groq \
            --hidden-import=sounddevice \
            --hidden-import=numpy \
            --hidden-import=aiohttp \
            --hidden-import=onnxruntime \
            --exclude-module=webrtcvad \
            --exclude-module=pipecat \
            --exclude-module=aiortc \
            main.py
      - name: Health-check Voice Agent sidecar
        working-directory: ./voice-agent/dist
        shell: bash
        run: |
          set -e
          ./${{ matrix.executable }} --version
          HEALTH_OUT=$(./${{ matrix.executable }} --health-check)
          echo "$HEALTH_OUT"
          echo "$HEALTH_OUT" | grep -q '"status": "healthy"'
      - name: Install target-specific Tauri sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp voice-agent/dist/voice-agent.exe "src-tauri/binaries/voice-agent-${{ matrix.rust_target }}.exe"
          else
            cp voice-agent/dist/voice-agent "src-tauri/binaries/voice-agent-${{ matrix.rust_target }}"
            chmod +x "src-tauri/binaries/voice-agent-${{ matrix.rust_target }}"
          fi
          ls -la src-tauri/binaries
      - name: Build Tauri app (debug)
        run: npm run tauri build -- --debug

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - quality
      - test-frontend
      - build-tauri
    if: always()
    steps:
      - name: Check all jobs status
        shell: bash
        run: |
          if [ "${{ needs.test-backend.result }}" != "success" ] || \
             [ "${{ needs.test-frontend.result }}" != "success" ] || \
             [ "${{ needs.build-tauri.result }}" != "success" ]; then
            echo "One or more critical jobs failed"
            exit 1
          fi
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "Quality check failed (currently non-blocking)"
          fi
          echo "All critical jobs passed"
