name: VOS Fabric Cancel Stale G2

on:
  push:
    branches:
      - "sol/vos-fabric-g2-worker-*"
    paths:
      - ".github/workflows/vos-fabric-cancel-stale-g2.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Force-cancel only stale G2 run 34825592842
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: "34825592842"
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}"
          state="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
          status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$state")"
          if [ "$status" = "completed" ]; then
            echo "STALE_G2_ALREADY_COMPLETED=1"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/force-cancel" >/dev/null
          echo "STALE_G2_FORCE_CANCEL_REQUESTED=1"
