name: VOS Fabric A2 Stream Shape Diagnostic

on:
  push:
    branches:
      - "sol/vos-fabric-g4-g5-runtime-*"
    paths:
      - ".github/workflows/vos-fabric-a2-stream-shape-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vos-fabric-a2-stream-shape-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, fluxion-imac-physical]
    timeout-minutes: 15
    env:
      HELPER_SOURCE_SHA: 843017f133da2a5b173b96ec017aed03ba8c35e8
      A2_MODEL: gemini-3.8-flash-high
      A2_BINARY_SHA256: c4c8a6722f9b570e370941b0953ba29051336307d7999ec842bdf7500b0ca7c8
    steps:
      - name: Classify stream structure under exact minimal worker environment
        shell: bash
        run: |
          set -euo pipefail
          fail(){ echo "A2_STREAM_SHAPE_BLOCKED=$*" >&2; exit 2; }
          prod(){
            uid="$(id -u)"
            lr(){ l="$1"; for d in "gui/$uid" "user/$uid" system; do launchctl print "$d/$l" 2>/dev/null|grep -Eq 'state = running|pid = [0-9]+'&&return 0; done; launchctl list 2>/dev/null|awk -v l="$l" '$3==l&&$1~/^[0-9]+$/{ok=1}END{exit ok?0:1}'; }
            lr com.zeroclaw.fall-detector && lr com.go2rtc && lr com.mosquitto.broker && curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null && lsof -nP -iTCP:3002 -sTCP:LISTEN 2>/dev/null|grep -q ':3002' && { lsof -nP -iUDP:5080 2>/dev/null|grep -q ':5080' || lsof -nP -iTCP:5080 -sTCP:LISTEN 2>/dev/null|grep -q ':5080'; } && mount|grep -q ' on /Volumes/NAS_LOCAL '
          }
          prod || fail PRE_PRODUCTION
          MP=''
          for c in "$(command -v multipass 2>/dev/null||true)" /usr/local/bin/multipass /opt/homebrew/bin/multipass "/Library/Application Support/com.canonical.multipass/bin/multipass"; do [ -z "$c" ]||[ ! -x "$c" ]||{ MP="$c";break; }; done
          [ -n "$MP" ] || fail MULTIPASS
          "$MP" info vos-worker|grep -q 'State:[[:space:]]*Running' || fail VM_NOT_RUNNING
          guest_ip="$($MP exec vos-worker -- sh -c "hostname -I|awk '{print \$1}'")"
          [ "$($MP exec vos-worker -- sha256sum /home/ubuntu/.local/bin/agy|awk '{print $1}')" = "$A2_BINARY_SHA256" ] || fail BINARY_SHA
          "$MP" exec vos-worker -- sh -c 'if mount | grep -Eq " type (9p|virtiofs|fuse\.multipass-sshfs|fuse\.sshfs) "; then exit 9; fi' >/dev/null || fail HOST_MOUNT

          tmp="$RUNNER_TEMP/a2-stream-shape-${GITHUB_RUN_ID}"; mkdir -p "$tmp"
          root="/tmp/vos-a2-stream-shape-${GITHUB_RUN_ID}"
          curl -4 -fsSL --retry 4 --retry-delay 2 --retry-all-errors "https://raw.githubusercontent.com/lukeeterna/fluxion-desktop/${HELPER_SOURCE_SHA}/tests/vos_fabric_live_antigravity_worker.py" -o "$tmp/helper.py"
          printf '%s\n' 'PUBLIC VOS Fabric certification objective. Your structured output field named proof must be exactly: VOS_G4_A2_RUNTIME=OK' > "$tmp/prompt.txt"
          cat > "$tmp/proxy.py" <<'PY'
          import os,select,socket,socketserver
          bind=('192.168.64.1',int(os.environ['PORT'])); allowed=os.environ['GUEST']
          class H(socketserver.StreamRequestHandler):
            def handle(self):
              if self.client_address[0]!=allowed:return
              p=self.rfile.readline(8192).decode('ascii','replace').strip().split()
              if len(p)!=3 or p[0].upper()!='CONNECT' or ':' not in p[1]:return
              host,ps=p[1].rsplit(':',1)
              try:port=int(ps)
              except ValueError:return
              if port!=443:return
              while True:
                x=self.rfile.readline(8192)
                if x in (b'\r\n',b'\n',b''):break
              try:up=socket.create_connection((host,443),timeout=20)
              except OSError:return
              with up:
                up.setblocking(False);self.connection.setblocking(False);self.wfile.write(b'HTTP/1.1 200 Connection Established\r\n\r\n');s=[self.connection,up]
                while True:
                  r,_,e=select.select(s,[],s,120)
                  if e or not r:return
                  for src in r:
                    dst=up if src is self.connection else self.connection
                    try:data=src.recv(65536)
                    except OSError:return
                    if not data:return
                    try:dst.sendall(data)
                    except OSError:return
          class S(socketserver.ThreadingTCPServer):allow_reuse_address=True;daemon_threads=True
          with S(bind,H) as s:print('READY',flush=True);s.serve_forever()
          PY
          cat > "$tmp/shape.py" <<'PY'
          import collections,json,sys
          p=sys.argv[1]; expected=sys.argv[2]
          counts=collections.Counter(); json_lines=0; invalid=0; init=None; result_event=None; result=None
          for raw in open(p,encoding='utf-8',errors='replace'):
              raw=raw.strip()
              if not raw: continue
              try:e=json.loads(raw)
              except Exception: invalid+=1; continue
              json_lines+=1
              if not isinstance(e,dict): counts['NON_OBJECT']+=1; continue
              et=e.get('event')
              counts[str(et) if et is not None else 'MISSING']+=1
              if et=='init': init=e
              if et=='result': result_event=e; result=e.get('result')
          print('A2_STREAM_JSON_LINES='+str(json_lines))
          print('A2_STREAM_INVALID_JSON_LINES='+str(invalid))
          print('A2_STREAM_EVENT_COUNTS='+','.join('%s:%d'%(k,counts[k]) for k in sorted(counts)))
          print('A2_STREAM_HAS_INIT='+str(int(isinstance(init,dict))))
          print('A2_STREAM_HAS_RESULT_EVENT='+str(int(isinstance(result_event,dict))))
          print('A2_STREAM_RESULT_IS_OBJECT='+str(int(isinstance(result,dict))))
          if isinstance(result,dict):
              print('A2_STREAM_RESULT_KEYS='+','.join(sorted(str(k) for k in result.keys())))
              status=result.get('status')
              print('A2_STREAM_STATUS_CLASS='+str(status if status in ('SUCCESS','FAILED','ERROR','CANCELLED') else 'OTHER_OR_MISSING'))
              structured=result.get('structured_output')
              print('A2_STREAM_STRUCTURED_IS_OBJECT='+str(int(isinstance(structured,dict))))
              if isinstance(structured,dict):
                  print('A2_STREAM_STRUCTURED_KEYS='+','.join(sorted(str(k) for k in structured.keys())))
                  print('A2_STREAM_PROOF_MATCH='+str(int(structured.get('proof')==expected)))
              else:
                  print('A2_STREAM_STRUCTURED_KEYS=')
                  print('A2_STREAM_PROOF_MATCH=0')
              cid=result.get('conversation_id') or (init.get('conversation_id') if isinstance(init,dict) else None)
              print('A2_STREAM_CONVERSATION_ID_PRESENT='+str(int(isinstance(cid,str) and bool(cid))))
          else:
              print('A2_STREAM_RESULT_KEYS=')
              print('A2_STREAM_STATUS_CLASS=NO_RESULT')
              print('A2_STREAM_STRUCTURED_IS_OBJECT=0')
              print('A2_STREAM_STRUCTURED_KEYS=')
              print('A2_STREAM_PROOF_MATCH=0')
              cid=init.get('conversation_id') if isinstance(init,dict) else None
              print('A2_STREAM_CONVERSATION_ID_PRESENT='+str(int(isinstance(cid,str) and bool(cid))))
          print('A2_STREAM_CONTENT_EXPOSED=0')
          PY
          port=$((30000 + GITHUB_RUN_ID % 8000))
          PORT="$port" GUEST="$guest_ip" /usr/bin/python3 "$tmp/proxy.py" >"$tmp/proxy.log" 2>&1 & pp=$!
          cleanup(){ kill "$pp" >/dev/null 2>&1||true; "$MP" exec vos-worker -- rm -rf "$root" >/dev/null 2>&1||true; rm -rf "$tmp"; }
          trap cleanup EXIT INT TERM
          for _ in 1 2 3 4 5; do grep -q '^READY$' "$tmp/proxy.log"&&break;sleep 1;done
          grep -q '^READY$' "$tmp/proxy.log" || fail PROXY
          "$MP" exec vos-worker -- rm -rf "$root"; "$MP" exec vos-worker -- mkdir -p "$root"
          for f in helper.py prompt.txt shape.py; do "$MP" transfer "$tmp/$f" "vos-worker:$root/$f" >/dev/null; done
          set +e
          "$MP" exec vos-worker -- env -i HOME=/home/ubuntu USER=ubuntu LOGNAME=ubuntu PATH=/home/ubuntu/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HTTPS_PROXY="http://192.168.64.1:$port" HTTP_PROXY="http://192.168.64.1:$port" https_proxy="http://192.168.64.1:$port" http_proxy="http://192.168.64.1:$port" LC_ALL=C LANG=C /usr/bin/python3 "$root/helper.py" --mode start --agy-bin /home/ubuntu/.local/bin/agy --model "$A2_MODEL" --prompt-file "$root/prompt.txt" --events-file "$root/events.jsonl" --stderr-file "$root/stderr.txt" --evidence-file "$root/evidence.json" --expected-proof VOS_G4_A2_RUNTIME=OK --timeout-seconds 180 >"$tmp/exec.log" 2>&1
          rc=$?
          set -e
          "$MP" exec vos-worker -- test -s "$root/events.jsonl" || fail EVENTS_MISSING
          "$MP" exec vos-worker -- /usr/bin/python3 "$root/shape.py" "$root/events.jsonl" VOS_G4_A2_RUNTIME=OK
          "$MP" exec vos-worker -- test -s "$root/evidence.json" || fail EVIDENCE_MISSING
          "$MP" exec vos-worker -- python3 -c 'import json,sys;e=json.load(open(sys.argv[1])); ks=("phase","failure_class","exit_code","structured_output_verified","api_key_fallback","credit_fallback","paid_api_fallback","production_mutations","events_sha256","stderr_sha256"); print("A2_STREAM_BOUNDED_EVIDENCE="+json.dumps({k:e.get(k) for k in ks if k in e},sort_keys=True,separators=(",",":")))' "$root/evidence.json"
          echo "A2_STREAM_HELPER_RC=$rc"
          echo MAX_COST_USD=0
          echo PAID_API_FALLBACK=0
          echo PRODUCTION_MUTATIONS=0
          prod || fail POST_PRODUCTION
          "$MP" exec vos-worker -- sh -c 'if mount | grep -Eq " type (9p|virtiofs|fuse\.multipass-sshfs|fuse\.sshfs) "; then exit 9; fi' >/dev/null || fail HOST_MOUNT_AFTER
          # This diagnostic is informative even when the helper correctly fails closed.
          echo A2_STREAM_SHAPE_DIAGNOSTIC=COMPLETE
