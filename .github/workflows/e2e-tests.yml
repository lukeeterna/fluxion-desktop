# E2E Test Workflow
# Enterprise-grade E2E testing pipeline for FLUXION

name: E2E Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - critical
          - visual
          - a11y

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  BASE_URL: http://localhost:1420
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHON_VERSION: '3.12'

jobs:
  # ============================================
  # Smoke Tests (Fast, runs on every push)
  # ============================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate SHA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${CANDIDATE_SHA}"
          echo "ACTUAL_SHA=${actual}"
          test "${actual}" = "${CANDIDATE_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd e2e-tests && npm ci

      - name: Install Playwright
        run: cd e2e-tests && npx playwright install --with-deps firefox

      - name: Build App
        run: npm run build

      - name: Start App
        run: |
          npm run preview -- --host 127.0.0.1 --port 1420 &
          npx wait-on http://localhost:1420 --timeout 60000

      - name: Run Smoke Tests
        run: cd e2e-tests && npm run test:smoke

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            e2e-tests/reports/
            e2e-tests/test-results/
          retention-days: 7

  # ============================================
  # Full E2E Suite (Matrix: macOS, Windows)
  # ============================================
  e2e-full:
    name: E2E Full - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: smoke-tests
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.test_suite == 'all'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm
            executable: voice-agent
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            platform: windows
            executable: voice-agent.exe
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate SHA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${CANDIDATE_SHA}"
          echo "ACTUAL_SHA=${actual}"
          test "${actual}" = "${CANDIDATE_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python for authentic Voice Agent sidecar
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            voice-agent/requirements.txt
            voice-agent/requirements-windows.txt

      - name: Install Voice Agent native dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install portaudio

      - name: Install Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          npm ci
          cd e2e-tests && npm ci

      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          npm ci
          cd e2e-tests && npm ci

      - name: Build and verify authentic Voice Agent sidecar
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m pip install -r voice-agent/requirements-windows.txt
            sep=';'
          else
            python -m pip install -r voice-agent/requirements.txt
            sep=':'
          fi
          python -m pip install pyinstaller
          mkdir -p voice-agent/models/tts
          curl --fail --location --retry 3 -o voice-agent/models/tts/it_IT-paola-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx"
          curl --fail --location --retry 3 -o voice-agent/models/tts/it_IT-paola-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx.json"
          cd voice-agent
          pyinstaller --onefile --name voice-agent \
            --add-data "models${sep}models" \
            --hidden-import=piper \
            --hidden-import=groq \
            --hidden-import=sounddevice \
            --hidden-import=numpy \
            --hidden-import=aiohttp \
            --hidden-import=onnxruntime \
            --exclude-module=webrtcvad \
            --exclude-module=pipecat \
            --exclude-module=aiortc \
            main.py
          cd dist
          ./${{ matrix.executable }} --version
          health="$(./${{ matrix.executable }} --health-check)"
          echo "$health"
          grep -q '"status": "healthy"' <<<"$health"
          cd ../..
          mkdir -p src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp voice-agent/dist/voice-agent.exe "src-tauri/binaries/voice-agent-${{ matrix.rust_target }}.exe"
            test -s "src-tauri/binaries/voice-agent-${{ matrix.rust_target }}.exe"
          else
            cp voice-agent/dist/voice-agent "src-tauri/binaries/voice-agent-${{ matrix.rust_target }}"
            chmod +x "src-tauri/binaries/voice-agent-${{ matrix.rust_target }}"
            test -x "src-tauri/binaries/voice-agent-${{ matrix.rust_target }}"
          fi
          echo "AUTHENTIC_SIDECAR=PASS target=${{ matrix.rust_target }}"

      - name: Install Playwright
        run: cd e2e-tests && npx playwright install --with-deps

      - name: Build Tauri App
        run: npm run tauri build -- --debug

      - name: Run E2E Tests
        run: |
          cd e2e-tests
          npm run test:ci
        env:
          CI: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: |
            e2e-tests/reports/
            e2e-tests/test-results/
            e2e-tests/.allure-results/
          retention-days: 14

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: e2e-tests/reports/html/
          retention-days: 14

  # ============================================
  # Visual Regression Tests
  # ============================================
  visual-tests:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: smoke-tests
    if: github.event_name == 'pull_request' || github.event.inputs.test_suite == 'visual'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate SHA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${CANDIDATE_SHA}"
          echo "ACTUAL_SHA=${actual}"
          test "${actual}" = "${CANDIDATE_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd e2e-tests && npm ci

      - name: Install Playwright
        run: cd e2e-tests && npx playwright install --with-deps firefox

      - name: Build App
        run: npm run build

      - name: Start App
        run: |
          npm run preview -- --host 127.0.0.1 --port 1420 &
          npx wait-on http://localhost:1420 --timeout 60000

      - name: Run Visual Tests
        run: cd e2e-tests && npm run test:visual

      - name: Upload Visual Diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            e2e-tests/test-results/
            e2e-tests/reports/artifacts/
          retention-days: 7

  # ============================================
  # Accessibility Tests
  # ============================================
  a11y-tests:
    name: Accessibility (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate SHA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${CANDIDATE_SHA}"
          echo "ACTUAL_SHA=${actual}"
          test "${actual}" = "${CANDIDATE_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd e2e-tests && npm ci

      - name: Install Playwright
        run: cd e2e-tests && npx playwright install --with-deps firefox

      - name: Build App
        run: npm run build

      - name: Start App
        run: |
          npm run preview -- --host 127.0.0.1 --port 1420 &
          npx wait-on http://localhost:1420 --timeout 60000

      - name: Run Accessibility Tests
        run: cd e2e-tests && npm run test:a11y

      - name: Upload A11y Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: e2e-tests/reports/
          retention-days: 7

  # ============================================
  # Generate Allure Report
  # ============================================
  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [e2e-full]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Download All Results
        uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: e2e-results-*
          merge-multiple: true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results/.allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history

      - name: Deploy Report to GitHub Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          destination_dir: allure-report

  # ============================================
  # Summary
  # ============================================
  e2e-summary:
    name: E2E Summary
    runs-on: ubuntu-latest
    needs: [smoke-tests, e2e-full, visual-tests, a11y-tests]
    if: always()

    steps:
      - name: Check Results
        run: |
          echo "## E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Full | ${{ needs.e2e-full.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Visual | ${{ needs.visual-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| A11y | ${{ needs.a11y-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          for result in "${{ needs.smoke-tests.result }}" "${{ needs.e2e-full.result }}" "${{ needs.visual-tests.result }}" "${{ needs.a11y-tests.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required E2E lane is not successful: $result"
              exit 1
            fi
          done
