name: FLUXION Independent Guarded Qwen Review PR 2

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  REPOSITORY_URL: https://github.com/lukeeterna/fluxion-desktop.git
  CONTROL_BRANCH: sol/zerotouch-headless-reviewer-20260805
  TARGET_REF: 5fa55b25337905b12a805f2ba7b7483d347bf78e
  OLLAMA_MODEL: qwen3:4b

concurrency:
  group: fluxion-independent-guarded-review-pr2-5fa55b25
  cancel-in-progress: true

jobs:
  independent-review:
    name: Guarded mandate-design reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone reviewed control plane without submodules
        run: |
          set -euo pipefail
          git clone \
            --no-recurse-submodules \
            --single-branch \
            --branch "$CONTROL_BRANCH" \
            --depth 1 \
            "$REPOSITORY_URL" control

      - name: Clone sealed PR 2 head without submodules
        run: |
          set -euo pipefail
          git clone --no-recurse-submodules "$REPOSITORY_URL" target
          git -C target checkout --detach "$TARGET_REF"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_REF"

      - name: Install and start isolated Ollama
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/ollama.log
              exit 2
            fi
            sleep 1
          done
          ollama pull "$OLLAMA_MODEL"
          ollama list

      - name: Run guarded fail-closed mandate review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 control/tools/fluxion_headless_reviewer_fast.py target artifacts \
            2>&1 | tee artifacts/RUN.log

      - name: Preserve Ollama diagnostics on failure
        if: failure()
        run: |
          cp /tmp/ollama.log artifacts/OLLAMA.log 2>/dev/null || true

      - name: Upload content-addressed guarded result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxion-pr2-guarded-review-5fa55b25
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
