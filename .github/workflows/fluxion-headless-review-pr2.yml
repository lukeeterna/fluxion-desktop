name: FLUXION Headless Independent Sonnet Review

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fluxion-sonnet-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  independent-review:
    name: Independent Sonnet review
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve sealed pull request target
        id: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          event_name = os.environ["GITHUB_EVENT_NAME"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if event_name == "pull_request":
              pr = event["pull_request"]
          else:
              number = os.environ.get("DISPATCH_PR_NUMBER", "").strip()
              if not number.isdigit():
                  raise SystemExit("workflow_dispatch requires numeric pr_number")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{number}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "fluxion-sonnet-headless-reviewer",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  pr = json.load(response)

          meta = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(pr["number"]),
              "title": pr.get("title", ""),
              "body": pr.get("body") or "",
              "author": (pr.get("user") or {}).get("login", ""),
              "base_ref": pr["base"]["ref"],
              "head_ref": pr["head"]["ref"],
              "base_sha": pr["base"]["sha"],
              "head_sha": pr["head"]["sha"],
          }
          Path("artifacts/PR_META.json").write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          control_sha = meta["head_sha"] if meta["pr_number"] == 3 else meta["base_sha"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in {
                  "pr_number": meta["pr_number"],
                  "base_sha": meta["base_sha"],
                  "head_sha": meta["head_sha"],
                  "control_sha": control_sha,
              }.items():
                  handle.write(f"{key}={value}\n")
          print(
              f"PR #{meta['pr_number']} base={meta['base_sha']} "
              f"head={meta['head_sha']} control={control_sha}"
          )
          PY

      - name: Clone immutable control plane
        env:
          CONTROL_SHA: ${{ steps.target.outputs.control_sha }}
        run: |
          set -euo pipefail
          git clone --no-recurse-submodules https://github.com/${GITHUB_REPOSITORY}.git control
          git -C control checkout --detach "$CONTROL_SHA"
          test "$(git -C control rev-parse HEAD)" = "$CONTROL_SHA"

      - name: Clone sealed pull request head
        env:
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          git clone --no-recurse-submodules https://github.com/${GITHUB_REPOSITORY}.git target
          git -C target fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git -C target checkout --detach "$HEAD_SHA"
          test "$(git -C target rev-parse HEAD)" = "$HEAD_SHA"
          git -C target merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"

      - name: Prepare sealed deterministic dossier
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 control/tools/fluxion_sonnet_reviewer.py \
            prepare target artifacts artifacts/PR_META.json \
            2>&1 | tee artifacts/PREPARE.log

      - name: Run fresh no-tools Sonnet review
        id: sonnet
        if: steps.prepare.outputs.invoke_model == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action/base-action@v1
        with:
          prompt_file: ${{ steps.prepare.outputs.prompt_path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model sonnet
            --max-turns 3
            --disallowedTools "Bash,Edit,Write,Read,Grep,Glob,WebFetch,WebSearch,NotebookEdit,Task,TaskOutput,KillTask"
            --json-schema
            '{"type":"object","additionalProperties":false,"properties":{"verdict":{"type":"string","enum":["GREEN","RED","BLOCKED"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"string"}},"required_changes":{"type":"array","items":{"type":"string"}},"safe_to_merge":{"type":"string","enum":["yes","no"]},"next_action":{"type":"string"}},"required":["verdict","summary","findings","required_changes","safe_to_merge","next_action"]}'

      - name: Validate and publish content-addressed verdict
        if: always() && steps.prepare.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_STEP_OUTCOME: ${{ steps.sonnet.outcome }}
          STRUCTURED_OUTPUT: ${{ steps.sonnet.outputs.structured_output }}
        run: |
          set -o pipefail
          python3 control/tools/fluxion_sonnet_reviewer.py \
            finalize target artifacts artifacts/PR_META.json \
            2>&1 | tee artifacts/FINALIZE.log

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxion-sonnet-review-pr-${{ steps.target.outputs.pr_number }}-${{ steps.target.outputs.head_sha }}
          path: |
            artifacts/PR_META.json
            artifacts/AUDIT.json
            artifacts/AUDIT.sha256
            artifacts/PROMPT.sha256
            artifacts/RESULT.json
            artifacts/RESULT.sha256
            artifacts/PREPARE.log
            artifacts/FINALIZE.log
          if-no-files-found: warn
          retention-days: 30
