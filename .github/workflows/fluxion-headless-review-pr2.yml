name: FLUXION Independent Groq Review PR 2

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  REPOSITORY_URL: https://github.com/lukeeterna/fluxion-desktop.git
  CONTROL_BRANCH: sol/zerotouch-headless-reviewer-20260805
  TARGET_REF: 5fa55b25337905b12a805f2ba7b7483d347bf78e

concurrency:
  group: fluxion-independent-review-pr2-5fa55b25
  cancel-in-progress: true

jobs:
  independent-review:
    name: Fresh stateless GitHub-hosted reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clone reviewed control plane without submodules
        run: |
          set -euo pipefail
          git clone \
            --no-recurse-submodules \
            --single-branch \
            --branch "$CONTROL_BRANCH" \
            --depth 1 \
            "$REPOSITORY_URL" control

      - name: Clone sealed PR 2 head without submodules
        run: |
          set -euo pipefail
          git clone --no-recurse-submodules "$REPOSITORY_URL" target
          git -C target checkout --detach "$TARGET_REF"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_REF"

      - name: Run fail-closed independent Groq review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 control/tools/fluxion_headless_reviewer_v2.py target artifacts \
            2>&1 | tee artifacts/RUN.log

      - name: Upload content-addressed result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxion-pr2-independent-review-5fa55b25
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
