name: FLUXION Headless Review PR 2

on:
  push:
    branches:
      - sol/zerotouch-headless-reviewer-20260805
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CONTROL_REF: sol/zerotouch-headless-reviewer-20260805
  TARGET_REF: 22938cf3ce13a9559d7f6eeda5216f2f3225ef1c
  DISABLE_AUTOUPDATER: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

concurrency:
  group: fluxion-headless-review-pr2-22938cf3
  cancel-in-progress: false

jobs:
  independent-review:
    name: Fresh stateless reviewer
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 20

    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_REF }}
          path: control
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout sealed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          path: target
          persist-credentials: false
          fetch-depth: 0

      - name: Run fail-closed independent reviewer
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 control/tools/fluxion_headless_reviewer.py target artifacts \
            2>&1 | tee artifacts/RUN.log

      - name: Upload content-addressed result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxion-pr2-headless-review-22938cf3
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
