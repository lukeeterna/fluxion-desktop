name: FLUXION Independent GitHub Models Review PR 2

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  models: read

env:
  CONTROL_REF: sol/zerotouch-headless-reviewer-20260805
  TARGET_REF: 5fa55b25337905b12a805f2ba7b7483d347bf78e

concurrency:
  group: fluxion-independent-review-pr2-5fa55b25
  cancel-in-progress: true

jobs:
  independent-review:
    name: Fresh stateless GitHub-hosted reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout reviewed control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_REF }}
          path: control
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout sealed PR 2 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          path: target
          persist-credentials: false
          fetch-depth: 0

      - name: Run fail-closed independent GitHub Models review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 control/tools/fluxion_headless_reviewer_v2.py target artifacts \
            2>&1 | tee artifacts/RUN.log

      - name: Upload content-addressed result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxion-pr2-independent-review-5fa55b25
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
