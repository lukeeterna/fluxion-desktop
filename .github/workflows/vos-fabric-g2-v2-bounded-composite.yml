name: VOS Fabric G2 V2 Bounded Composite

on:
  push:
    branches:
      - "sol/vos-fabric-g2-worker-*"
    paths:
      - ".github/workflows/vos-fabric-g2-v2-bounded-composite.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vos-fabric-g2-v2-bounded-composite
  cancel-in-progress: false

jobs:
  runtime:
    name: G2 v2 runtime core
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 12
    outputs:
      source_thread_id: ${{ steps.certify.outputs.source_thread_id }}
      fork_thread_id: ${{ steps.certify.outputs.fork_thread_id }}
      first_events_sha256: ${{ steps.certify.outputs.first_events_sha256 }}
      resume_events_sha256: ${{ steps.certify.outputs.resume_events_sha256 }}
      fork_events_sha256: ${{ steps.certify.outputs.fork_events_sha256 }}
      guest_ip: ${{ steps.certify.outputs.guest_ip }}
    env:
      FABRIC_SHA: 18752fb147f6700d4dc0633a55b9367d00ef0d91
      GATE_SHA256: 3f0846f4acb50a278c6ddfc764f7b180127d7f282589f21c2567148c641cf362
      CODEX_VERSION: 0.154.0
      VOS_CODEX_MODEL: gpt-5.6-terra
    steps:
      - id: certify
        name: Real Codex exec tool resume fork
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$RUNNER_TEMP/g2-v2-runtime-${GITHUB_RUN_ID}.sh"
          cat > "$REMOTE" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          export LC_ALL=C LANG=C
          : "${FABRIC_SHA:?}"; : "${GATE_SHA256:?}"; : "${CODEX_VERSION:?}"; : "${VOS_CODEX_MODEL:?}"; : "${VOS_PROXY_PORT:?}"
          fail(){ printf 'G2_V2_BLOCKED=%s\n' "$*" >&2; exit 2; }
          pass(){ printf 'PASS %-32s %s\n' "$1" "${2:-}"; }
          bounded(){
            local seconds="$1"; shift
            /usr/bin/python3 - "$seconds" "$@" <<'PY'
          import subprocess,sys
          seconds=float(sys.argv[1]); cmd=sys.argv[2:]
          try:
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=seconds)
              if p.stdout: print(p.stdout,end='')
              raise SystemExit(p.returncode)
          except subprocess.TimeoutExpired as e:
              out=e.stdout or ''
              if isinstance(out,bytes): out=out.decode('utf-8','replace')
              if out: print(out,end='')
              print('BOUNDED_COMMAND_TIMEOUT=1')
              raise SystemExit(124)
          PY
          }
          production_green(){
            uid="$(id -u)"
            launch_running(){
              label="$1"
              for d in "gui/$uid" "user/$uid" system; do
                launchctl print "$d/$label" 2>/dev/null | grep -Eq 'state = running|pid = [0-9]+' && return 0
              done
              launchctl list 2>/dev/null | awk -v label="$label" '$3==label && $1 ~ /^[0-9]+$/ {ok=1} END{exit ok?0:1}'
            }
            launch_running com.zeroclaw.fall-detector && \
            launch_running com.go2rtc && \
            launch_running com.mosquitto.broker && \
            curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null && \
            lsof -nP -iTCP:3002 -sTCP:LISTEN 2>/dev/null | grep -q ':3002' && \
            { lsof -nP -iUDP:5080 2>/dev/null | grep -q ':5080' || lsof -nP -iTCP:5080 -sTCP:LISTEN 2>/dev/null | grep -q ':5080'; } && \
            mount | grep -q ' on /Volumes/NAS_LOCAL '
          }
          production_green || fail PRE_PRODUCTION_REGRESSION
          pass PRE_PRODUCTION 'Guardian/FLUXION/NAS green'

          MP=''
          for c in "$(command -v multipass 2>/dev/null || true)" /usr/local/bin/multipass /opt/homebrew/bin/multipass "/Library/Application Support/com.canonical.multipass/bin/multipass"; do
            [ -n "$c" ] && [ -x "$c" ] && { MP="$c"; break; }
          done
          [ -n "$MP" ] || fail MULTIPASS_MISSING

          owner="$(bounded 25 "$MP" exec vos-worker -- sh -c 'cat /var/lib/vos-fabric/worker-owner 2>/dev/null || true' | tail -1)" || fail OWNER_PROBE
          [ "$owner" = VOS_FABRIC_G2 ] || fail OWNER
          arch="$(bounded 25 "$MP" exec vos-worker -- uname -m | tail -1)" || fail ARCH_PROBE
          [ "$arch" = x86_64 ] || fail ARCH
          version="$(bounded 25 "$MP" exec vos-worker -- /usr/local/bin/codex --version | tail -1)" || fail CODEX_VERSION_PROBE
          [ "$version" = "codex-cli ${CODEX_VERSION}" ] || fail CODEX_VERSION
          gate_sha="$(bounded 25 "$MP" exec vos-worker -- sha256sum /usr/local/lib/vos-fabric/codex_worker_gate.sh | awk 'NF {v=$1} END {print v}')" || fail GATE_SHA_PROBE
          [ "$gate_sha" = "$GATE_SHA256" ] || fail GATE_SHA_CHANGED
          bounded 25 "$MP" exec vos-worker -- sh -c 'if mount | grep -Eq " type (9p|virtiofs|fuse\.multipass-sshfs|fuse\.sshfs) "; then exit 9; fi' >/dev/null || fail UNEXPECTED_HOST_MOUNT
          bounded 25 "$MP" exec vos-worker -- sh -c 'test -z "${OPENAI_API_KEY:-}"' >/dev/null || fail PAID_API_ENV_PRESENT
          bounded 25 "$MP" exec vos-worker -- timeout 15s env CODEX_HOME=/home/ubuntu/.codex-vos-fabric /usr/local/bin/codex login status >/dev/null || fail CHATGPT_AUTH
          guest_ip="$(bounded 25 "$MP" exec vos-worker -- sh -c "hostname -I | awk '{print \$1}'" | tail -1)" || fail GUEST_IP
          printf '%s\n' "$guest_ip" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' || fail GUEST_IP_FORMAT
          pass PREFLIGHT "guest=$guest_ip gate=$gate_sha"

          PROXY=/tmp/vos-g2-v2-proxy-${VOS_PROXY_PORT}.py
          PROXY_LOG=/tmp/vos-g2-v2-proxy-${VOS_PROXY_PORT}.log
          cat > "$PROXY" <<'PY'
          #!/usr/bin/env python3
          import os,select,socket,socketserver
          bind=('192.168.64.1',int(os.environ['VOS_PROXY_PORT']))
          allowed=os.environ['VOS_GUEST_IP']
          class H(socketserver.StreamRequestHandler):
              def handle(self):
                  if self.client_address[0] != allowed: return
                  line=self.rfile.readline(8192).decode('ascii','replace').strip(); p=line.split()
                  if len(p)!=3 or p[0].upper()!='CONNECT' or ':' not in p[1]: return
                  host,ps=p[1].rsplit(':',1)
                  try: port=int(ps)
                  except ValueError: return
                  if port!=443:
                      self.wfile.write(b'HTTP/1.1 403 Forbidden\r\n\r\n'); return
                  print('CONNECT_HOST=%s:443'%host,flush=True)
                  while True:
                      h=self.rfile.readline(8192)
                      if h in (b'\r\n',b'\n',b''): break
                  try: up=socket.create_connection((host,443),timeout=20)
                  except OSError:
                      self.wfile.write(b'HTTP/1.1 502 Bad Gateway\r\n\r\n'); return
                  with up:
                      up.setblocking(False); self.connection.setblocking(False)
                      self.wfile.write(b'HTTP/1.1 200 Connection Established\r\n\r\n')
                      sockets=[self.connection,up]
                      while True:
                          r,_,x=select.select(sockets,[],sockets,120)
                          if x or not r: return
                          for s in r:
                              d=up if s is self.connection else self.connection
                              try: data=s.recv(65536)
                              except OSError: return
                              if not data: return
                              try: d.sendall(data)
                              except OSError: return
          class S(socketserver.ThreadingTCPServer):
              allow_reuse_address=True; daemon_threads=True
          with S(bind,H) as s:
              print('READY=%s:%d'%bind,flush=True); s.serve_forever()
          PY
          proxy_pid=''
          cleanup(){
            [ -z "$proxy_pid" ] || kill "$proxy_pid" >/dev/null 2>&1 || true
            rm -f "$PROXY" "$PROXY_LOG"
          }
          trap cleanup EXIT INT TERM
          VOS_PROXY_PORT="$VOS_PROXY_PORT" VOS_GUEST_IP="$guest_ip" /usr/bin/python3 "$PROXY" >"$PROXY_LOG" 2>&1 & proxy_pid=$!
          for _ in 1 2 3 4 5; do grep -q "^READY=192.168.64.1:${VOS_PROXY_PORT}$" "$PROXY_LOG" 2>/dev/null && break; sleep 1; done
          grep -q "^READY=192.168.64.1:${VOS_PROXY_PORT}$" "$PROXY_LOG" || fail PROXY_NOT_READY

          set +e
          gate_out="$(/usr/bin/python3 - "$MP" "$VOS_PROXY_PORT" "$VOS_CODEX_MODEL" <<'PY'
          import subprocess,sys
          mp,port,model=sys.argv[1:]
          proxy='http://192.168.64.1:'+port
          cmd=[mp,'exec','vos-worker','--','env',
               'CODEX_HOME=/home/ubuntu/.codex-vos-fabric',
               'HTTPS_PROXY='+proxy,'HTTP_PROXY='+proxy,'https_proxy='+proxy,'http_proxy='+proxy,
               'VOS_CODEX_MODEL='+model,'VOS_CODEX_TURN_TIMEOUT_SECONDS=120',
               '/usr/local/lib/vos-fabric/codex_worker_gate.sh','qualify']
          try:
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=360)
              print(p.stdout,end=''); raise SystemExit(p.returncode)
          except subprocess.TimeoutExpired as e:
              out=e.stdout or ''
              if isinstance(out,bytes): out=out.decode('utf-8','replace')
              print(out,end=''); print('G2_V2_CODEX_TIMEOUT=1'); raise SystemExit(124)
          PY
          )"
          gate_rc=$?
          set -e
          printf '%s\n' "$gate_out"
          echo '--- PROXY TRACE ---'; grep -E '^(READY|CONNECT_HOST)=' "$PROXY_LOG" || true; echo '--- END PROXY TRACE ---'
          [ "$gate_rc" -eq 0 ] || fail "CODEX_GATE_RC=$gate_rc"

          for marker in \
            'CODEX_CHATGPT_AUTH=GREEN' \
            'CODEX_EXEC_JSON=GREEN' \
            'CODEX_TOOL_EXECUTION=GREEN' \
            'CODEX_EXACT_RESUME=GREEN' \
            'CODEX_EXACT_FORK=GREEN' \
            'LINUX_CODEX_WORKER_LOCAL_QUALIFICATION=GREEN' \
            'PASS CODEX_RUNTIME'; do
            printf '%s\n' "$gate_out" | grep -F "$marker" >/dev/null || fail "MISSING_MARKER:$marker"
          done
          source_thread="$(printf '%s\n' "$gate_out" | awk -F= '/^CODEX_SOURCE_THREAD_ID=/{v=$2} END{print v}')"
          fork_thread="$(printf '%s\n' "$gate_out" | awk -F= '/^CODEX_FORK_THREAD_ID=/{v=$2} END{print v}')"
          first_sha="$(printf '%s\n' "$gate_out" | awk -F= '/^CODEX_FIRST_EVENTS_SHA256=/{v=$2} END{print v}')"
          resume_sha="$(printf '%s\n' "$gate_out" | awk -F= '/^CODEX_RESUME_EVENTS_SHA256=/{v=$2} END{print v}')"
          fork_sha="$(printf '%s\n' "$gate_out" | awk -F= '/^CODEX_FORK_EVENTS_SHA256=/{v=$2} END{print v}')"
          [ -n "$source_thread" ] && [ -n "$fork_thread" ] && [ "$source_thread" != "$fork_thread" ] || fail THREAD_IDS
          for h in "$first_sha" "$resume_sha" "$fork_sha"; do printf '%s\n' "$h" | grep -Eq '^[0-9a-f]{64}$' || fail EVENT_HASH; done
          production_green || fail POST_RUNTIME_PRODUCTION_REGRESSION
          pass POST_RUNTIME_PRODUCTION 'Guardian/FLUXION/NAS green'
          echo "G2_V2_GUEST_IP=$guest_ip"
          echo "G2_V2_SOURCE_THREAD_ID=$source_thread"
          echo "G2_V2_FORK_THREAD_ID=$fork_thread"
          echo "G2_V2_FIRST_EVENTS_SHA256=$first_sha"
          echo "G2_V2_RESUME_EVENTS_SHA256=$resume_sha"
          echo "G2_V2_FORK_EVENTS_SHA256=$fork_sha"
          echo 'G2_V2_RUNTIME_CORE=GREEN'
          echo 'G2_PAID_API_FALLBACK=0'
          echo 'PRODUCTION_REGRESSION=0'
          REMOTE
          chmod 700 "$REMOTE"
          PROXY_PORT=$((23000 + GITHUB_RUN_ID % 10000))
          set +e
          out="$(ssh -o BatchMode=yes -o ConnectTimeout=8 imac \
            "FABRIC_SHA='$FABRIC_SHA' GATE_SHA256='$GATE_SHA256' CODEX_VERSION='$CODEX_VERSION' VOS_CODEX_MODEL='$VOS_CODEX_MODEL' VOS_PROXY_PORT='$PROXY_PORT' bash -s" < "$REMOTE" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          source_thread="$(printf '%s\n' "$out" | awk -F= '/^G2_V2_SOURCE_THREAD_ID=/{v=$2} END{print v}')"
          fork_thread="$(printf '%s\n' "$out" | awk -F= '/^G2_V2_FORK_THREAD_ID=/{v=$2} END{print v}')"
          first_sha="$(printf '%s\n' "$out" | awk -F= '/^G2_V2_FIRST_EVENTS_SHA256=/{v=$2} END{print v}')"
          resume_sha="$(printf '%s\n' "$out" | awk -F= '/^G2_V2_RESUME_EVENTS_SHA256=/{v=$2} END{print v}')"
          fork_sha="$(printf '%s\n' "$out" | awk -F= '/^G2_V2_FORK_EVENTS_SHA256=/{v=$2} END{print v}')"
          guest_ip="$(printf '%s\n' "$out" | awk -F= '/^G2_V2_GUEST_IP=/{v=$2} END{print v}')"
          {
            echo "source_thread_id=$source_thread"
            echo "fork_thread_id=$fork_thread"
            echo "first_events_sha256=$first_sha"
            echo "resume_events_sha256=$resume_sha"
            echo "fork_events_sha256=$fork_sha"
            echo "guest_ip=$guest_ip"
          } >> "$GITHUB_OUTPUT"

  lifecycle:
    name: G2 bounded lifecycle
    needs: runtime
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 6
    env:
      CODEX_VERSION: 0.154.0
      GUEST_IP: ${{ needs.runtime.outputs.guest_ip }}
    steps:
      - name: Clean stop start with state proof
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$RUNNER_TEMP/g2-v2-lifecycle-${GITHUB_RUN_ID}.sh"
          cat > "$REMOTE" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          export LC_ALL=C LANG=C
          : "${GUEST_IP:?}"; : "${CODEX_VERSION:?}"
          fail(){ printf 'G2_V2_BLOCKED=%s\n' "$*" >&2; exit 2; }
          bounded(){
            local seconds="$1"; shift
            /usr/bin/python3 - "$seconds" "$@" <<'PY'
          import subprocess,sys
          seconds=float(sys.argv[1]); cmd=sys.argv[2:]
          try:
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=seconds)
              if p.stdout: print(p.stdout,end='')
              raise SystemExit(p.returncode)
          except subprocess.TimeoutExpired as e:
              out=e.stdout or ''
              if isinstance(out,bytes): out=out.decode('utf-8','replace')
              if out: print(out,end='')
              print('BOUNDED_COMMAND_TIMEOUT=1')
              raise SystemExit(124)
          PY
          }
          production_green(){
            uid="$(id -u)"
            launch_running(){ label="$1"; for d in "gui/$uid" "user/$uid" system; do launchctl print "$d/$label" 2>/dev/null | grep -Eq 'state = running|pid = [0-9]+' && return 0; done; launchctl list 2>/dev/null | awk -v label="$label" '$3==label && $1 ~ /^[0-9]+$/ {ok=1} END{exit ok?0:1}'; }
            launch_running com.zeroclaw.fall-detector && launch_running com.go2rtc && launch_running com.mosquitto.broker && curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null && lsof -nP -iTCP:3002 -sTCP:LISTEN 2>/dev/null | grep -q ':3002' && { lsof -nP -iUDP:5080 2>/dev/null | grep -q ':5080' || lsof -nP -iTCP:5080 -sTCP:LISTEN 2>/dev/null | grep -q ':5080'; } && mount | grep -q ' on /Volumes/NAS_LOCAL '
          }
          MP=''
          for c in "$(command -v multipass 2>/dev/null || true)" /usr/local/bin/multipass /opt/homebrew/bin/multipass "/Library/Application Support/com.canonical.multipass/bin/multipass"; do [ -n "$c" ] && [ -x "$c" ] && { MP="$c"; break; }; done
          [ -n "$MP" ] || fail MULTIPASS_MISSING
          production_green || fail PRE_LIFECYCLE_PRODUCTION
          [ "$(bounded 25 "$MP" exec vos-worker -- sh -c 'cat /var/lib/vos-fabric/worker-owner' | tail -1)" = VOS_FABRIC_G2 ] || fail OWNER_BEFORE_STOP

          set +e
          stop_out="$(bounded 35 "$MP" stop vos-worker 2>&1)"; stop_rc=$?
          set -e
          printf '%s\n' "$stop_out"
          echo "G2_V2_STOP_CLI_RC=$stop_rc"
          stopped=0
          for _ in $(seq 1 45); do
            if ! nc -z -w 1 "$GUEST_IP" 22 >/dev/null 2>&1; then stopped=1; break; fi
            sleep 1
          done
          [ "$stopped" -eq 1 ] || fail VM_NOT_STOPPED_BY_STATE
          echo 'G2_V2_CLEAN_STOP=GREEN'
          production_green || fail PRODUCTION_AFTER_STOP

          set +e
          start_out="$(bounded 35 "$MP" start vos-worker 2>&1)"; start_rc=$?
          set -e
          printf '%s\n' "$start_out"
          echo "G2_V2_START_CLI_RC=$start_rc"
          started=0
          for _ in $(seq 1 90); do
            if nc -z -w 1 "$GUEST_IP" 22 >/dev/null 2>&1; then started=1; break; fi
            sleep 1
          done
          [ "$started" -eq 1 ] || fail VM_NOT_RUNNING_BY_STATE

          owner=''
          for _ in 1 2 3 4 5; do
            set +e
            owner="$(bounded 25 "$MP" exec vos-worker -- sh -c 'cat /var/lib/vos-fabric/worker-owner' | tail -1)"; rc=$?
            set -e
            [ "$rc" -eq 0 ] && [ "$owner" = VOS_FABRIC_G2 ] && break
            sleep 2
          done
          [ "$owner" = VOS_FABRIC_G2 ] || fail OWNER_AFTER_RESTART
          [ "$(bounded 25 "$MP" exec vos-worker -- /usr/local/bin/codex --version | tail -1)" = "codex-cli ${CODEX_VERSION}" ] || fail CODEX_VERSION_AFTER_RESTART
          bounded 25 "$MP" exec vos-worker -- timeout 15s env CODEX_HOME=/home/ubuntu/.codex-vos-fabric /usr/local/bin/codex login status >/dev/null || fail AUTH_AFTER_RESTART
          bounded 25 "$MP" exec vos-worker -- sh -c 'if mount | grep -Eq " type (9p|virtiofs|fuse\.multipass-sshfs|fuse\.sshfs) "; then exit 9; fi' >/dev/null || fail HOST_MOUNT_AFTER_RESTART
          production_green || fail POST_LIFECYCLE_PRODUCTION
          echo 'G2_V2_LIFECYCLE_CORE=GREEN'
          echo 'G2_POST_RESTART=GREEN'
          echo 'G2_PAID_API_FALLBACK=0'
          echo 'PRODUCTION_REGRESSION=0'
          REMOTE
          chmod 700 "$REMOTE"
          ssh -o BatchMode=yes -o ConnectTimeout=8 imac "GUEST_IP='$GUEST_IP' CODEX_VERSION='$CODEX_VERSION' bash -s" < "$REMOTE"

  composite:
    name: G2 exact composite certificate
    needs: [runtime, lifecycle]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit fail-closed exact qualification
        shell: bash
        env:
          SOURCE_THREAD_ID: ${{ needs.runtime.outputs.source_thread_id }}
          FORK_THREAD_ID: ${{ needs.runtime.outputs.fork_thread_id }}
          FIRST_EVENTS_SHA256: ${{ needs.runtime.outputs.first_events_sha256 }}
          RESUME_EVENTS_SHA256: ${{ needs.runtime.outputs.resume_events_sha256 }}
          FORK_EVENTS_SHA256: ${{ needs.runtime.outputs.fork_events_sha256 }}
        run: |
          set -euo pipefail
          [ -n "$SOURCE_THREAD_ID" ]
          [ -n "$FORK_THREAD_ID" ]
          [ "$SOURCE_THREAD_ID" != "$FORK_THREAD_ID" ]
          for h in "$FIRST_EVENTS_SHA256" "$RESUME_EVENTS_SHA256" "$FORK_EVENTS_SHA256"; do
            printf '%s\n' "$h" | grep -Eq '^[0-9a-f]{64}$'
          done
          echo "G2_QUALIFICATION_REF=run:${GITHUB_RUN_ID}:attempt:${GITHUB_RUN_ATTEMPT}:head:${GITHUB_SHA}"
          echo "G2_SOURCE_THREAD_ID=$SOURCE_THREAD_ID"
          echo "G2_FORK_THREAD_ID=$FORK_THREAD_ID"
          echo "G2_FIRST_EVENTS_SHA256=$FIRST_EVENTS_SHA256"
          echo "G2_RESUME_EVENTS_SHA256=$RESUME_EVENTS_SHA256"
          echo "G2_FORK_EVENTS_SHA256=$FORK_EVENTS_SHA256"
          echo 'G2_V2_RUNTIME_CORE=GREEN'
          echo 'G2_LIFECYCLE_CORE=GREEN'
          echo 'G2_POST_RESTART=GREEN'
          echo 'G2_PAID_API_FALLBACK=0'
          echo 'PRODUCTION_REGRESSION=0'
          echo 'G2=GREEN'
