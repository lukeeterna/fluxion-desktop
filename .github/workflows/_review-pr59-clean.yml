name: PR59 independent exact-SHA review

on:
  pull_request:
    branches: [master]
    paths: [.github/workflows/_review-pr59-clean.yml]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO: lukeeterna/fluxion-desktop
      PR_NUMBER: '59'
      PR_BRANCH: agent/sara-live-transfer-p0-v2
      BASE_SHA: 2ce9ed07bb2de6cc60533bcb9cf503d8edaa4d15
      FINAL_FIX_PARENT: 9177ab1048ef1dd2f8ab69b12b7465d8e1519be3
    steps:
      - name: Checkout review control branch without write credential
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Freeze and validate exact PR59 candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$(git ls-remote "https://github.com/$REPO.git" "refs/heads/$PR_BRANCH" | awk '{print $1}')"
          test -n "$CANDIDATE"
          git fetch --no-tags --depth=80 "https://github.com/$REPO.git" \
            "$CANDIDATE" "$BASE_SHA" "$FINAL_FIX_PARENT"
          test "$(git rev-parse "$CANDIDATE^")" = "$FINAL_FIX_PARENT"

          mapfile -t FINAL_FILES < <(git diff --name-only "$FINAL_FIX_PARENT" "$CANDIDATE")
          test "${#FINAL_FILES[@]}" = "7"
          printf '%s\n' "${FINAL_FILES[@]}" | grep -Fxq 'voice-agent/requirements.txt'
          printf '%s\n' "${FINAL_FILES[@]}" | grep -Fxq 'voice-agent/requirements-ci.txt'
          printf '%s\n' "${FINAL_FILES[@]}" | grep -Fxq 'voice-agent/requirements-windows.txt'
          printf '%s\n' "${FINAL_FILES[@]}" | grep -Fxq 'voice-agent/src/orchestrator.py'
          printf '%s\n' "${FINAL_FILES[@]}" | grep -Fxq 'voice-agent/tests/test_live_transfer_orchestrator.py'
          printf '%s\n' "${FINAL_FILES[@]}" | grep -Fxq 'src-tauri/src/http_bridge.rs'
          printf '%s\n' "${FINAL_FILES[@]}" | grep -Fxq 'src-tauri/tests/integration_operatori.rs'
          test -z "$(printf '%s\n' "${FINAL_FILES[@]}" | grep '^\.github/' || true)"

          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Build sealed full-PR dossier
        shell: bash
        env:
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review"
          {
            echo 'FLUXION PR #59 — INDEPENDENT REVIEW DOSSIER'
            echo "BASE_SHA=$BASE_SHA"
            echo "CANDIDATE_SHA=$CANDIDATE"
            echo "FINAL_FIX_PARENT=$FINAL_FIX_PARENT"
            echo
            echo '=== COMMITS BASE..CANDIDATE ==='
            git log --oneline --decorate "$BASE_SHA..$CANDIDATE"
            echo
            echo '=== DIFF STAT ==='
            git diff --stat "$BASE_SHA" "$CANDIDATE"
            echo
            echo '=== FULL DIFF ==='
            git diff --no-ext-diff --no-color --unified=50 "$BASE_SHA" "$CANDIDATE"
          } > "$RUNNER_TEMP/review/dossier.txt"
          sha256sum "$RUNNER_TEMP/review/dossier.txt" > "$RUNNER_TEMP/review/dossier.sha256"

      - name: Build no-tools reviewer prompt
        shell: bash
        env:
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'review'
          dossier = (root / 'dossier.txt').read_text(encoding='utf-8')
          prompt = f'''You are the independent FRESH_REVIEWER for FLUXION PR #59.
You did not author this code. Use no tools. Judge only the sealed dossier below.
Candidate SHA: {os.environ['CANDIDATE']}

Review the COMPLETE master-to-candidate diff, not just the final fix. Treat RED as a veto for any concrete P0/P1 correctness, privacy/security, routing, state-machine, telephony-transfer, migration, or regression-testing defect. GREEN means no concrete blocking defect found. BLOCKED only if the supplied full diff is genuinely insufficient to judge.

Required checks:
- transfer success is not claimed before a real connected operator leg/media bridge;
- trusted destination validation and caller-controlled SIP/number injection safety;
- encrypted operator-phone handling and no accidental PII exposure;
- operator opt-in/reachability/priority plus holidays, pauses, schedules and absences;
- owner/private notification phone is never exposed/read to caller or used as an unchecked live route;
- public general fallback semantics and truthful no-route wording;
- busy/no-answer/no-route/failure retry/fallback behavior for Go and pjsua2 paths;
- migration/backward compatibility and operator CRUD/UI consistency;
- Python 3.13 audioop compatibility;
- tests cover the important positive and negative contracts without merely matching implementation.

Return only the required structured object.

SEALED DOSSIER:\n{dossier}'''
          (root / 'prompt.txt').write_text(prompt, encoding='utf-8')
          PY

      - name: Independent Sonnet review with no tools
        id: review
        uses: anthropics/claude-code-base-action@f1b5c5c49125f0e6adc48c1203ebd77f83ea9adb
        with:
          prompt_file: ${{ runner.temp }}/review/prompt.txt
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model sonnet
            --max-turns 20
            --allowedTools ""
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","findings","required_changes","summary"],"properties":{"verdict":{"type":"string","enum":["GREEN","RED","BLOCKED"]},"findings":{"type":"array","items":{"type":"string"}},"required_changes":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"}}}'

      - name: Seal verdict and comment exact evidence on PR59
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
          REVIEW_SESSION: ${{ steps.review.outputs.session_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = json.loads(os.environ['STRUCTURED_OUTPUT'])
          out['candidate_sha'] = os.environ['CANDIDATE']
          out['review_session'] = os.environ.get('REVIEW_SESSION','')
          p = Path(os.environ['RUNNER_TEMP']) / 'review' / 'verdict.json'
          p.write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          if out['verdict'] != 'GREEN':
              raise SystemExit(f"INDEPENDENT_REVIEW={out['verdict']}")
          PY
          {
            echo '## Independent Sonnet exact-SHA review — GREEN'
            echo
            echo "Candidate: \`$CANDIDATE\`"
            echo "Review session: \`$REVIEW_SESSION\`"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/review/verdict.json"
            echo '```'
          } > "$RUNNER_TEMP/review/comment.md"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/review/comment.md"

      - name: Upload sealed review evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr59-independent-review-${{ steps.candidate.outputs.candidate }}
          path: ${{ runner.temp }}/review/
          if-no-files-found: error
          retention-days: 30
