name: TMP Live Transfer Inspect
on:
  push:
    branches: [agent/sara-live-transfer-p0]
    paths: ['.github/workflows/_tmp-live-transfer-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect targeted resolver only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('voice-agent/src/orchestrator.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          needles=['def _resolve_escalation_phone','async def _resolve_escalation_phone','def _trigger_wa_escalation_call','async def _trigger_wa_escalation_call','def _build_escalation_response']
          found=0
          for i,line in enumerate(lines):
              if any(n in line for n in needles):
                  found+=1
                  lo=max(0,i-3); hi=min(len(lines),i+95)
                  print(f'===== {p}:{i+1} =====')
                  for j in range(lo,hi): print(f'{j+1:05d}: {lines[j]}')
          if not found:
              raise SystemExit('target resolver helpers not found')
          PY
