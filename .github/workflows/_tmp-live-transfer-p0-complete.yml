name: TMP Complete Sara Live Transfer P0
on:
  push:
    branches: [agent/sara-live-transfer-p0-v2]
    paths: ['.github/workflows/_tmp-live-transfer-p0-complete.yml']
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic P0 completion patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ------------------------------------------------------------------
          # Orchestrator: defer WhatsApp while an in-hours live VoIP transfer
          # is possible; keep WA as an explicit fallback after live transfer.
          # ------------------------------------------------------------------
          orch = 'voice-agent/src/orchestrator.py'
          replace_once(
              orch,
              '    async def _trigger_wa_escalation_call(self, escalation_type: str) -> str:\n',
              '    async def _trigger_wa_escalation_call(self, escalation_type: str, force_notify: bool = False) -> str:\n',
          )
          replace_once(
              orch,
              '''        is_bh = self._is_business_hours()\n        urgency = "URGENTE" if is_bh else "NON URGENTE (fuori orario)"\n''',
              '''        is_bh = self._is_business_hours()\n        # P0 LIVE TRANSFER: during an active in-hours VoIP call, the live SIP\n        # route is authoritative. Do not pre-notify WhatsApp before we know the\n        # transfer failed; WA remains the fallback path (force_notify=True).\n        if getattr(self, "_is_voip_call", False) and is_bh and not force_notify:\n            logger.info("[ESC] Live transfer eligible; WhatsApp deferred until SIP transfer failure")\n            return escalation_phone\n\n        urgency = "URGENTE" if is_bh else "NON URGENTE (fuori orario)"\n''',
          )
          replace_once(
              orch,
              '''        if not esc_phone:\n            return prefix + "Mi dispiace, al momento non riesco a metterla in contatto con un operatore. Può riprovare più tardi."\n        if is_bh:\n            return (\n''',
              '''        if not esc_phone:\n            return prefix + "Mi dispiace, al momento non riesco a metterla in contatto con un operatore. Può riprovare più tardi."\n        if is_bh and getattr(self, "_is_voip_call", False):\n            return prefix + "Capisco. Rimanga in linea, provo a passarla subito a un operatore."\n        if is_bh:\n            return (\n''',
          )

          # ------------------------------------------------------------------
          # Go adapter: start transfer on should_escalate+trusted target even if
          # should_exit=False; on failure, then and only then send WA fallback.
          # ------------------------------------------------------------------
          goa = 'voice-agent/src/voip_goengine.py'
          replace_once(
              goa,
              '''    def _speak_transfer_fallback(self, status: str):\n        if status == "busy":\n''',
              '''    def _notify_transfer_failure(self, status: str):\n        """Best-effort operator notification after a live SIP transfer fails."""\n        callback = getattr(self.pipeline, "_trigger_wa_escalation_call", None) if self.pipeline else None\n        if callback is None or self._main_loop is None:\n            return\n        try:\n            fut = asyncio.run_coroutine_threadsafe(\n                callback(f"live_transfer_{status}", force_notify=True), self._main_loop\n            )\n            fut.result(timeout=6)\n        except Exception as exc:\n            logger.warning("WA fallback dopo transfer fallito non riuscito: %s", exc)\n\n    def _speak_transfer_fallback(self, status: str):\n        self._notify_transfer_failure(status)\n        if status == "busy":\n''',
          )
          old = '''            if result and result.get("should_exit"):\n                # FSM-HANGUP GUARD (FASE 2 spec 2.3): Sara NON riaggancia mai per prima.\n                # should_exit ha molte origini nella FSM (booking done, confusione,\n                # garbage bare-name); riagganciamo SOLO su intento di congedo esplicito\n                # (mutuo "arrivederci"). Su ogni altro should_exit Sara resta in linea →\n                # è il chiamante a chiudere. Elimina l'auto-hangup su STT sporco del GATE B.\n                _intent = (result.get("intent") or "").lower()\n                # E6-FIX: also authorize BYE on escalation exit (3-strike E6) via\n                # either "escalat" in intent or explicit should_escalate flag.\n                _should_escalate = result.get("should_escalate", False)\n                _transfer_phone = result.get("transfer_phone") or ""\n                if _should_escalate and _transfer_phone:\n                    threading.Thread(\n                        target=self._transfer_after_drain,\n                        args=(_transfer_phone,),\n                        daemon=True,\n                        name="goengine-live-transfer",\n                    ).start()\n                    return\n                _explicit_goodbye = (\n'''
          new = '''            # P0 LIVE TRANSFER is independent from should_exit: an explicit\n            # human request may keep the FSM open while still requiring immediate handoff.\n            if result:\n                _should_escalate = result.get("should_escalate", False)\n                _transfer_phone = result.get("transfer_phone") or ""\n                if _should_escalate and _transfer_phone:\n                    threading.Thread(\n                        target=self._transfer_after_drain,\n                        args=(_transfer_phone,),\n                        daemon=True,\n                        name="goengine-live-transfer",\n                    ).start()\n                    return\n\n            if result and result.get("should_exit"):\n                # FSM-HANGUP GUARD (FASE 2 spec 2.3): Sara NON riaggancia mai per prima.\n                # should_exit ha molte origini nella FSM (booking done, confusione,\n                # garbage bare-name); riagganciamo SOLO su intento di congedo esplicito\n                # (mutuo "arrivederci"). Su ogni altro should_exit Sara resta in linea →\n                # è il chiamante a chiudere. Elimina l'auto-hangup su STT sporco del GATE B.\n                _intent = (result.get("intent") or "").lower()\n                _should_escalate = result.get("should_escalate", False)\n                _explicit_goodbye = (\n'''
          replace_once(goa, old, new)

          # ------------------------------------------------------------------
          # pjsua2: thread-confined SIP REFER via Call.xfer() and final NOTIFY.
          # ------------------------------------------------------------------
          pjs = 'voice-agent/src/voip_pjsua2.py'
          replace_once(
              pjs,
              '''        self.on_connected = None   # Callback: call connected\n        self.on_disconnected = None  # Callback: call ended\n''',
              '''        self.on_connected = None   # Callback: call connected\n        self.on_disconnected = None  # Callback: call ended\n        self.on_transfer_status = None  # Callback: outgoing REFER progress/final status\n''',
          )
          marker = '''\n\n# =============================================================================\n# SIP Account\n# =============================================================================\n'''
          transfer_cb = '''\n\n    def onCallTransferStatus(self, prm):\n        """pjsua2 callback for a REFER previously sent by Call.xfer()."""\n        code = int(getattr(prm, "statusCode", 0) or 0)\n        reason = str(getattr(prm, "reason", "") or "")\n        final = bool(getattr(prm, "finalNotify", False))\n        logger.info("TRANSFER PJSUA2 status=%s final=%s reason=%s", code, final, reason)\n        if self.on_transfer_status:\n            self.on_transfer_status(self, code, reason, final)\n        if final:\n            # No further NOTIFY callbacks are required after the terminal result.\n            try:\n                prm.cont = False\n            except Exception:\n                pass\n'''
          replace_once(pjs, marker, transfer_cb + marker)
          replace_once(
              pjs,
              '''        self._hangup_pending = False  # L5: Prevent multiple hangup threads\n        self._current_call: Optional[SaraCall] = None\n\n        # Simple energy-based VAD for caller speech detection\n''',
              '''        self._hangup_pending = False  # L5: Prevent multiple hangup threads\n        self._current_call: Optional[SaraCall] = None\n\n        # P0 live-transfer state. The audio worker only enqueues commands; the\n        # actual pjsua2 Call.xfer()/hangup operations run on _pjsua2_thread.\n        self._pending_transfers: "queue.Queue[tuple]" = queue.Queue()\n        self._pending_transfer_hangups: "queue.Queue[SaraCall]" = queue.Queue()\n        self._transfer_lock = threading.Lock()\n        self._transfer_event = threading.Event()\n        self._transfer_status = "idle"\n        self._transfer_code = 0\n\n        # Simple energy-based VAD for caller speech detection\n''',
          )
