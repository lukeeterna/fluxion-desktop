name: TMP Complete Sara Live Transfer P0
on:
  push:
    branches:
      - agent/sara-live-transfer-p0-v2
    paths:
      - .github/workflows/_tmp-live-transfer-p0-complete.yml
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic P0 patch
        run: python3 .github/bootstrap/_tmp_live_transfer_p0_complete.py
      - name: Validate Go REFER engine
        working-directory: voice-agent/engine
        run: |
          set -euo pipefail
          gofmt -w main.go main_test.go
          go test ./...
      - name: Install Voice Agent test dependencies
        working-directory: voice-agent
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest pytest-asyncio
      - name: Validate Python P0 gates
        run: |
          set -euo pipefail
          python3 -m py_compile voice-agent/src/orchestrator.py voice-agent/src/voip_goengine.py voice-agent/src/voip_pjsua2.py voice-agent/tests/test_live_transfer_goengine.py voice-agent/tests/test_live_transfer_pjsua2.py voice-agent/tests/test_live_transfer_orchestrator.py voice-agent/tests/test_nlu_fsm_bypass.py
          cd voice-agent
          pytest tests/test_live_transfer_goengine.py tests/test_live_transfer_pjsua2.py tests/test_live_transfer_orchestrator.py tests/test_nlu_fsm_bypass.py -q
      - name: Final scope and diff gate
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-live-transfer-p0-complete.yml .github/bootstrap/_tmp_live_transfer_p0_complete.py
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' .github/bootstrap/_tmp_live_transfer_p0_complete.py .github/workflows/_tmp-live-transfer-p0-complete.yml voice-agent/src/orchestrator.py voice-agent/src/voip_goengine.py voice-agent/src/voip_pjsua2.py voice-agent/tests/test_live_transfer_orchestrator.py voice-agent/tests/test_live_transfer_pjsua2.py | sort)"
          test "$changed" = "$expected"
          echo LIVE_TRANSFER_P0_COMPLETION_SCOPE=PASS
      - name: Commit product delta and self-remove temporary transport
        run: |
          set -euo pipefail
          git config user.name "FLUXION SOL"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(voice): complete live transfer for Go and pjsua2"
          git push origin HEAD:agent/sara-live-transfer-p0-v2
