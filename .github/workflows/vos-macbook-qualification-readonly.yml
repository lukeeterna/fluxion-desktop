name: VOS MacBook Qualification — Read Only

on:
  push:
    branches:
      - sol/vos-macbook-qualification-20260825
    paths:
      - '.github/workflows/vos-macbook-qualification-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vos-macbook-qualification-readonly
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile local VOS baseline without mutation
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 3
    env:
      LC_ALL: C
      LANG: C
      FLUXION_ROOT: /Volumes/MontereyT7/FLUXION
      SPIKE_ROOT: /Volumes/MontereyT7/VOS_FABRIC_SPIKE/20260823T170806
      U1_SOURCE_SHA: 518e2a9dce0a95767fe787f312f3316733304e15
      KERNEL_SHA: 2ce9ed07bb2de6cc60533bcb9cf503d8edaa4d15
    steps:
      - name: Read-only machine and Git reconciliation
        shell: bash
        run: |
          set -u

          root="$FLUXION_ROOT"
          spike="$SPIKE_ROOT"
          u1="$U1_SOURCE_SHA"
          kernel="$KERNEL_SHA"

          echo '===== VOS MACBOOK READ-ONLY RECONCILIATION V3 ====='
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "FLUXION_ROOT=$root"
          echo "SPIKE_ROOT=$spike"
          echo "U1_SOURCE_SHA=$u1"
          echo "KERNEL_SHA=$kernel"

          if [ ! -d "$root/.git" ]; then
            echo 'REPO_PRESENT=NO'
            echo 'RECONCILIATION=BLOCKED'
            exit 2
          fi
          echo 'REPO_PRESENT=YES'

          head="$(git -C "$root" rev-parse HEAD 2>/dev/null || true)"
          branch="$(git -C "$root" branch --show-current 2>/dev/null || true)"
          echo "LOCAL_HEAD=$head"
          echo "LOCAL_BRANCH=${branch:-DETACHED}"

          tracked_paths="$( { git -C "$root" diff --name-only -- 2>/dev/null; git -C "$root" diff --cached --name-only -- 2>/dev/null; } | sed '/^$/d' | sort -u )"
          tracked_count="$(printf '%s\n' "$tracked_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
          untracked_count="$(git -C "$root" ls-files --others --exclude-standard 2>/dev/null | wc -l | tr -d ' ')"
          echo "LOCAL_TRACKED_DIRTY_COUNT=$tracked_count"
          echo "LOCAL_UNTRACKED_COUNT=$untracked_count"
          if [ "$tracked_count" = 0 ] && [ "$untracked_count" = 0 ]; then
            echo 'LOCAL_WORKTREE_CLEAN=YES'
          else
            echo 'LOCAL_WORKTREE_CLEAN=NO'
          fi

          if [ "$tracked_count" -gt 0 ]; then
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              echo "TRACKED_DIRTY_PATH=$p"
            done <<EOF
          $tracked_paths
          EOF
          fi
          if [ "$untracked_count" -gt 0 ]; then
            echo 'UNTRACKED_PATH_NAMES_REDACTED=YES'
          else
            echo 'UNTRACKED_PATH_NAMES_REDACTED=NO'
          fi

          origin_master="$(git -C "$root" rev-parse refs/remotes/origin/master 2>/dev/null || true)"
          echo "LOCAL_ORIGIN_MASTER=${origin_master:-MISSING}"

          if git -C "$root" cat-file -e "${u1}^{commit}" 2>/dev/null; then
            u1_present=YES
          else
            u1_present=NO
          fi
          echo "U1_SHA_OBJECT_PRESENT=$u1_present"

          if git -C "$root" cat-file -e "${kernel}^{commit}" 2>/dev/null; then
            kernel_present=YES
          else
            kernel_present=NO
          fi
          echo "KERNEL_SHA_OBJECT_PRESENT=$kernel_present"

          relation=UNRESOLVED
          merge_base=NONE
          if [ "$u1_present" = YES ] && [ "$kernel_present" = YES ]; then
            merge_base="$(git -C "$root" merge-base "$u1" "$kernel" 2>/dev/null || true)"
            if git -C "$root" merge-base --is-ancestor "$kernel" "$u1" 2>/dev/null; then
              relation='U1_DESCENDS_FROM_KERNEL'
            elif git -C "$root" merge-base --is-ancestor "$u1" "$kernel" 2>/dev/null; then
              relation='KERNEL_DESCENDS_FROM_U1'
            elif [ -n "$merge_base" ]; then
              relation='DIVERGED_WITH_COMMON_ANCESTOR'
            else
              relation='NO_COMMON_ANCESTOR'
            fi
          elif [ "$u1_present" = NO ] && [ "$kernel_present" = YES ]; then
            relation='U1_OBJECT_MISSING_LOCALLY'
          elif [ "$u1_present" = YES ] && [ "$kernel_present" = NO ]; then
            relation='KERNEL_OBJECT_MISSING_LOCALLY'
          else
            relation='BOTH_OBJECTS_MISSING_LOCALLY'
          fi
          echo "MERGE_BASE=$merge_base"
          echo "BASELINE_RELATION=$relation"

          if [ "$u1_present" = YES ]; then
            echo "U1_SUBJECT=$(git -C "$root" show -s --format=%s "$u1" 2>/dev/null || true)"
            echo "U1_PARENT_COUNT=$(git -C "$root" show -s --format=%P "$u1" 2>/dev/null | awk '{print NF}')"
          fi
          if [ "$kernel_present" = YES ]; then
            echo "KERNEL_SUBJECT=$(git -C "$root" show -s --format=%s "$kernel" 2>/dev/null || true)"
            echo "KERNEL_PARENT_COUNT=$(git -C "$root" show -s --format=%P "$kernel" 2>/dev/null | awk '{print NF}')"
          fi
          if [ -n "$merge_base" ] && [ "$merge_base" != NONE ]; then
            echo "U1_COMMITS_AFTER_MERGE_BASE=$(git -C "$root" rev-list --count "$merge_base..$u1" 2>/dev/null || true)"
            echo "KERNEL_COMMITS_AFTER_MERGE_BASE=$(git -C "$root" rev-list --count "$merge_base..$kernel" 2>/dev/null || true)"
          fi

          vos_paths='bin/vos_apply.py bin/vos_common.py bin/vos_machine.py bin/vos_plan.sh bin/vos_check.sh tests/test_vos_apply.py tests/test_vos_machine.py .github/workflows/fluxion-headless-executor.yml'
          vos_equal=YES
          if [ "$u1_present" = YES ] && [ "$kernel_present" = YES ]; then
            for p in $vos_paths; do
              u1_blob="$(git -C "$root" rev-parse "$u1:$p" 2>/dev/null || true)"
              kernel_blob="$(git -C "$root" rev-parse "$kernel:$p" 2>/dev/null || true)"
              if [ -z "$u1_blob" ] || [ -z "$kernel_blob" ]; then
                echo "VOS_BLOB_COMPARE=$p:MISSING"
                vos_equal=NO
              elif [ "$u1_blob" = "$kernel_blob" ]; then
                echo "VOS_BLOB_COMPARE=$p:EQUAL:$u1_blob"
              else
                echo "VOS_BLOB_COMPARE=$p:DIFF:U1=$u1_blob:KERNEL=$kernel_blob"
                vos_equal=NO
              fi
            done
          else
            vos_equal=UNRESOLVED
          fi
          echo "KNOWN_VOS_BLOBS_IDENTICAL=$vos_equal"

          internal_kib="$(df -Pk / 2>/dev/null | awk 'NR==2 {print $4}')"
          if [ -n "$internal_kib" ]; then
            internal_gib="$(awk -v k="$internal_kib" 'BEGIN {printf "%.2f", k/1024/1024}')"
          else
            internal_gib=UNKNOWN
          fi
          echo "INTERNAL_FREE_GIB=$internal_gib"

          if [ "$internal_gib" != UNKNOWN ] && awk -v v="$internal_gib" 'BEGIN {exit !(v >= 7.0)}'; then
            echo 'AUTH_DISK_TARGET_MET=YES'
          else
            echo 'AUTH_DISK_TARGET_MET=NO'
          fi

          if [ -d /Volumes/MontereyT7 ]; then
            t7_kib="$(df -Pk /Volumes/MontereyT7 2>/dev/null | awk 'NR==2 {print $4}')"
            t7_gib="$(awk -v k="$t7_kib" 'BEGIN {printf "%.2f", k/1024/1024}')"
            echo 'T7_PRESENT=YES'
            echo "T7_FREE_GIB=$t7_gib"
          else
            echo 'T7_PRESENT=NO'
            echo 'T7_FREE_GIB=UNKNOWN'
          fi

          if [ -d "$spike" ]; then
            echo 'SPIKE_PRESENT=YES'
          else
            echo 'SPIKE_PRESENT=NO'
          fi
          if [ -f "$spike/env.sh" ]; then
            echo 'SPIKE_ENV_PRESENT=YES'
          else
            echo 'SPIKE_ENV_PRESENT=NO'
          fi

          echo 'SOURCE_REPOS_MUTATED=NO'
          echo 'FETCH_PERFORMED=NO'
          echo 'CHECKOUT_PERFORMED=NO'
          echo 'CLEANUP_PERFORMED=NO'
          echo 'AUTH_ATTEMPTED=NO'
          echo 'RECONCILIATION_COMMANDS_BOUNDED=YES'
          echo '===== END VOS MACBOOK READ-ONLY RECONCILIATION V3 ====='
