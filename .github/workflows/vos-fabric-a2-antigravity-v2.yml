name: VOS Fabric A2 Antigravity Package Inspect

on:
  push:
    branches:
      - "sol/vos-fabric-a2-antigravity-*"
    paths:
      - ".github/workflows/vos-fabric-a2-antigravity-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 10
    env:
      AGY_VERSION: 1.2.3
      AGY_PACKAGE_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.2.3-5101874907578368/linux-x64/cli_linux_x64.tar.gz
    steps:
      - name: Inspect exact official package without installation
        shell: bash
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/cli_linux_x64-${AGY_VERSION}.tar.gz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 "$AGY_PACKAGE_URL" -o "$PKG"
          echo "ANTIGRAVITY_PACKAGE_SHA256=$(shasum -a 256 "$PKG" | awk '{print $1}')"
          echo 'A2_PACKAGE_MEMBERS_BEGIN'
          tar -tzf "$PKG" | sed -n '1,120p'
          echo 'A2_PACKAGE_MEMBERS_END'
          echo 'A2_EXECUTABLE_CANDIDATES_BEGIN'
          TMP="$(mktemp -d -t agy-inspect.XXXXXX)"
          trap 'rm -rf "$TMP"' EXIT
          tar -xzf "$PKG" -C "$TMP"
          find "$TMP" -type f -perm -u+x -maxdepth 5 -print | sed "s#^$TMP/##" | sed -n '1,80p'
          echo 'A2_EXECUTABLE_CANDIDATES_END'
