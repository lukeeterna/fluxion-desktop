name: VOS Fabric A2 Antigravity Install Auth Probe

on:
  push:
    branches:
      - "sol/vos-fabric-a2-antigravity-*"
    paths:
      - ".github/workflows/vos-fabric-a2-antigravity-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vos-fabric-a2-antigravity-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 20
    env:
      AGY_VERSION: 1.2.3
      AGY_PACKAGE_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.2.3-5101874907578368/linux-x64/cli_linux_x64.tar.gz
    steps:
      - name: Download exact official package and transfer to iMac
        shell: bash
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/cli_linux_x64-${AGY_VERSION}.tar.gz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 "$AGY_PACKAGE_URL" -o "$PKG"
          [ "$(tar -tzf "$PKG")" = "antigravity" ]
          echo "ANTIGRAVITY_PACKAGE_SHA256=$(shasum -a 256 "$PKG" | awk '{print $1}')"
          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$PKG" imac:/tmp/vos-a2-antigravity-package.tar.gz

      - name: Install inside vos-worker and locate exact auth boundary
        shell: bash
        run: |
          set -euo pipefail
          PROXY_PORT=$((24000 + GITHUB_RUN_ID % 12000))
          PROXY="$RUNNER_TEMP/vos-a2-auth-proxy-${GITHUB_RUN_ID}.py"
          cat > "$PROXY" <<'PY'
          #!/usr/bin/env python3
          import os, select, socket, socketserver
          bind=("192.168.64.1",int(os.environ["VOS_PROXY_PORT"])); allowed="192.168.64.3"
          class H(socketserver.StreamRequestHandler):
              def handle(self):
                  if self.client_address[0] != allowed: return
                  self.connection.settimeout(30)
                  p=self.rfile.readline(8192).decode("ascii","replace").strip().split()
                  if len(p)!=3 or p[0].upper()!="CONNECT" or ":" not in p[1]: return
                  host,ps=p[1].rsplit(":",1)
                  try: port=int(ps)
                  except ValueError: return
                  if port!=443: return
                  while True:
                      h=self.rfile.readline(8192)
                      if h in (b"\r\n",b"\n",b""): break
                  try: up=socket.create_connection((host,port),timeout=20)
                  except OSError: return
                  with up:
                      up.setblocking(False); self.connection.setblocking(False)
                      self.wfile.write(b"HTTP/1.1 200 Connection Established\r\n\r\n")
                      socks=[self.connection,up]
                      while True:
                          r,_,x=select.select(socks,[],socks,120)
                          if x or not r: return
                          for src in r:
                              dst=up if src is self.connection else self.connection
                              try: data=src.recv(65536)
                              except OSError: return
                              if not data: return
                              try: dst.sendall(data)
                              except OSError: return
          class S(socketserver.ThreadingTCPServer): allow_reuse_address=True; daemon_threads=True
          with S(bind,H) as s:
              print(f"READY={bind[0]}:{bind[1]}",flush=True); s.serve_forever()
          PY
          chmod 700 "$PROXY"
          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$PROXY" imac:/tmp/vos-a2-auth-proxy.py

          HOST="$RUNNER_TEMP/vos-a2-auth-host-${GITHUB_RUN_ID}.sh"
          cat > "$HOST" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          export LC_ALL=C LANG=C
          : "${VOS_PROXY_PORT:?}" "${AGY_VERSION:?}"
          fail(){ printf 'A2_AUTH_PROBE_BLOCKED=%s\n' "$*"; exit 2; }
          MP=""
          for c in "$(command -v multipass 2>/dev/null||true)" /usr/local/bin/multipass /opt/homebrew/bin/multipass "/Library/Application Support/com.canonical.multipass/bin/multipass"; do
            [ -z "$c" ] || [ ! -x "$c" ] || { MP="$c"; break; }
          done
          [ -n "$MP" ] || fail MULTIPASS_MISSING
          "$MP" info vos-worker >/dev/null 2>&1 || fail VOS_WORKER_MISSING
          owner="$($MP exec vos-worker -- sh -c 'cat /var/lib/vos-fabric/worker-owner 2>/dev/null||true')"
          [ "$owner" = VOS_FABRIC_G2 ] || fail "OWNER_$owner"
          "$MP" info vos-worker|grep -q 'State:[[:space:]]*Running' || "$MP" start vos-worker
          [ "$($MP exec vos-worker -- uname -m)" = x86_64 ] || fail GUEST_ARCH

          prod(){
            uid="$(id -u)"; running(){ l="$1"; for d in "gui/$uid" "user/$uid" system; do launchctl print "$d/$l" 2>/dev/null|grep -Eq 'state = running|pid = [0-9]+' && return 0; done; launchctl list 2>/dev/null|awk -v l="$l" '$3==l&&$1~/^[0-9]+$/{ok=1}END{exit ok?0:1}'; }
            running com.zeroclaw.fall-detector && running com.go2rtc && running com.mosquitto.broker || return 1
            curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null || return 1
            lsof -nP -iTCP:3002 -sTCP:LISTEN 2>/dev/null|grep -q ':3002' || return 1
            { lsof -nP -iUDP:5080 2>/dev/null|grep -q ':5080' || lsof -nP -iTCP:5080 -sTCP:LISTEN 2>/dev/null|grep -q ':5080'; } || return 1
            mount|grep -q ' on /Volumes/NAS_LOCAL '
          }
          prod || fail PRE_PRODUCTION_REGRESSION
          echo 'A2_PRE_PRODUCTION=GREEN'

          "$MP" transfer /tmp/vos-a2-antigravity-package.tar.gz vos-worker:/tmp/vos-a2-antigravity-package.tar.gz
          proxy_pid=''; cleanup(){ [ -z "$proxy_pid" ] || kill "$proxy_pid" >/dev/null 2>&1||true; rm -f /tmp/vos-a2-auth-* /tmp/vos-a2-antigravity-package.tar.gz; }; trap cleanup EXIT INT TERM
          VOS_PROXY_PORT="$VOS_PROXY_PORT" /usr/bin/python3 /tmp/vos-a2-auth-proxy.py >/tmp/vos-a2-auth-proxy.log 2>&1 & proxy_pid=$!
          for _ in 1 2 3 4 5; do grep -q "^READY=192.168.64.1:${VOS_PROXY_PORT}$" /tmp/vos-a2-auth-proxy.log 2>/dev/null && break; sleep 1; done
          grep -q "^READY=192.168.64.1:${VOS_PROXY_PORT}$" /tmp/vos-a2-auth-proxy.log || fail PROXY_NOT_READY

          cat >/tmp/vos-a2-auth-guest.sh <<'GUEST'
          #!/usr/bin/env bash
          set -euo pipefail
          export LC_ALL=C LANG=C
          : "${VOS_PROXY_PORT:?}" "${AGY_VERSION:?}"
          export HTTPS_PROXY="http://192.168.64.1:${VOS_PROXY_PORT}" HTTP_PROXY="http://192.168.64.1:${VOS_PROXY_PORT}" https_proxy="http://192.168.64.1:${VOS_PROXY_PORT}" http_proxy="http://192.168.64.1:${VOS_PROXY_PORT}"
          export PATH="$HOME/.local/bin:$PATH"
          T="$(mktemp -d -t agy-install.XXXXXX)"; trap 'rm -rf "$T"' EXIT
          tar -xzf /tmp/vos-a2-antigravity-package.tar.gz -C "$T"
          [ -x "$T/antigravity" ] || { echo A2_GUEST_BLOCKED=OFFICIAL_BINARY_MISSING; exit 2; }
          mkdir -p "$HOME/.local/bin"
          install -m0755 "$T/antigravity" "$HOME/.local/bin/agy"
          echo "ANTIGRAVITY_VERSION=$(agy --version|head -1)"
          agy --version|grep -F "$AGY_VERSION" >/dev/null || { echo A2_GUEST_BLOCKED=VERSION_MISMATCH; exit 2; }
          echo "ANTIGRAVITY_BINARY_SHA256=$(sha256sum "$HOME/.local/bin/agy"|awk '{print $1}')"

          settings="$HOME/.gemini/antigravity-cli/settings.json"; mkdir -p "$(dirname "$settings")"
          python3 - "$settings" <<'PY'
          import json,os,sys
          p=sys.argv[1]; d={}
          if os.path.exists(p):
              with open(p,encoding='utf-8') as f:d=json.load(f)
          d['useG1Credits']=False; q=p+'.tmp'
          with open(q,'w',encoding='utf-8') as f:json.dump(d,f,sort_keys=True,indent=2);f.write('\n')
          os.chmod(q,0o600);os.replace(q,p)
          PY
          echo "ANTIGRAVITY_SETTINGS_SHA256=$(sha256sum "$settings"|awk '{print $1}')"
          echo 'ANTIGRAVITY_CREDIT_FALLBACK=0'

          out="$(mktemp)"; err="$(mktemp)"; rc=0
          timeout 75s agy -p 'Reply exactly: VOS_A2_AUTH_PROBE=OK' --output-format json --sandbox --print-timeout 45s >"$out" 2>"$err" || rc=$?
          echo "A2_AUTH_PROBE_STDOUT_SHA256=$(sha256sum "$out"|awk '{print $1}')"
          echo "A2_AUTH_PROBE_STDERR_SHA256=$(sha256sum "$err"|awk '{print $1}')"
          if [ "$rc" -eq 0 ]; then echo 'ANTIGRAVITY_DIRECT_AUTH=GREEN'; exit 0; fi
          if cat "$out" "$err"|grep -Eqi 'authentication required|sign[ -]?in|required.*auth|unauthorized|login'; then echo 'A2=BLOCKED_AUTH'; exit 20; fi
          echo "A2_AUTH_PROBE_RC=$rc"
          sed -n '1,40p' "$err" >&2
          exit 2
          GUEST
          chmod 700 /tmp/vos-a2-auth-guest.sh
          "$MP" transfer /tmp/vos-a2-auth-guest.sh vos-worker:/tmp/vos-a2-auth-guest.sh
          "$MP" exec vos-worker -- chmod 700 /tmp/vos-a2-auth-guest.sh
          grc=0; "$MP" exec vos-worker -- env VOS_PROXY_PORT="$VOS_PROXY_PORT" AGY_VERSION="$AGY_VERSION" /tmp/vos-a2-auth-guest.sh || grc=$?
          prod || fail POST_PRODUCTION_REGRESSION
          echo 'A2_POST_PRODUCTION=GREEN'
          if [ "$grc" -eq 20 ]; then echo 'A2=BLOCKED_AUTH'; echo 'A2_NEXT_ACTION=ONE_TIME_DIRECT_GOOGLE_AUTH_INSIDE_VOS_WORKER'; exit 20; fi
          [ "$grc" -eq 0 ] || fail "GUEST_RC_$grc"
          echo 'A2_AUTH_BOUNDARY=GREEN'
          REMOTE
          chmod 700 "$HOST"
          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$HOST" imac:/tmp/vos-a2-auth-host.sh
          rc=0; ssh -o BatchMode=yes -o ConnectTimeout=8 imac "env VOS_PROXY_PORT='$PROXY_PORT' AGY_VERSION='$AGY_VERSION' bash /tmp/vos-a2-auth-host.sh" || rc=$?
          ssh -o BatchMode=yes -o ConnectTimeout=8 imac 'rm -f /tmp/vos-a2-auth-host.sh' || true
          exit "$rc"
