name: SOL Once Fix Python Gate

on:
  push:
    branches: [fix/sara-gate-shell-only]
    paths:
      - .github/workflows/sol-once-fix-python-gate.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sol-python-gate-pr60
  cancel-in-progress: true

env:
  BASE_FIX_SOURCE_SHA: 7e63888d5857d0ba3a92921d1781b9155c33df7d
  APPLY_INCREMENTAL_FIXES: |
    from pathlib import Path

    def replace_exact(path, old, new, label):
        p = Path(path)
        text = p.read_text()
        if text.count(old) != 1:
            raise SystemExit(f"fail-closed: {label} target mismatch")
        p.write_text(text.replace(old, new, 1))

    path = "voice-agent/tests/test_voice_agent_complete.py"
    replace_exact(
        path,
        '        """Verifica che tutti i 14 stati attivi siano definiti (E1+E4: 9 states rimossi)."""\n',
        '        """Verifica i 15 stati attivi, incluso CONFIRMING_NAME aggiunto dal NAME-GATE."""\n',
        "complete-suite state-count doc",
    )
    replace_exact(
        path,
        '            BookingState.DISAMBIGUATING_NAME,\n        ]\n\n        all_states = list(BookingState)\n',
        '            BookingState.DISAMBIGUATING_NAME,\n            BookingState.CONFIRMING_NAME,\n        ]\n\n        all_states = list(BookingState)\n',
        "complete-suite active state set",
    )
    replace_exact(
        path,
        '        assert len(all_states) == 14, f"Expected 14 states, got {len(all_states)}: {[s.value for s in all_states]}"\n',
        '        assert len(all_states) == 15, f"Expected 15 states, got {len(all_states)}: {[s.value for s in all_states]}"\n',
        "complete-suite state count",
    )

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Python gate corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          source_sha = os.environ["BASE_FIX_SOURCE_SHA"]
          path = ".github/workflows/sol-once-fix-python-gate.yml"
          text = subprocess.check_output(["git", "show", f"{source_sha}:{path}"], text=True)
          marker = "  APPLY_PYTHON_GATE_FIXES: |\n"
          if text.count(marker) != 1:
              raise SystemExit("fail-closed: base fix block marker mismatch")
          block = text.split(marker, 1)[1].split("\njobs:\n", 1)[0]
          lines = block.splitlines()
          if not lines or any(line and not line.startswith("    ") for line in lines):
              raise SystemExit("fail-closed: base fix block indentation mismatch")
          code = "\n".join(line[4:] if line else "" for line in lines) + "\n"
          exec(compile(code, f"{path}@{source_sha}", "exec"), {})
          PY
          python -c "$APPLY_INCREMENTAL_FIXES"
          expected=$'voice-agent/src/booking_state_machine.py\nvoice-agent/src/tts_engine.py\nvoice-agent/tests/test_booking_state_machine.py\nvoice-agent/tests/test_cancellation_window.py\nvoice-agent/tests/test_f02_vertical_fixes.py\nvoice-agent/tests/test_first_available.py\nvoice-agent/tests/test_humanness_b1_b2_b3.py\nvoice-agent/tests/test_kimi_flow.py\nvoice-agent/tests/test_phase_e_audit_p1.py\nvoice-agent/tests/test_session_persistence.py\nvoice-agent/tests/test_voice_agent_complete.py'
          test "$(git diff --name-only | sort)" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: voice-agent/requirements-ci.txt
      - name: Install dependencies
        working-directory: voice-agent
        run: pip install -r requirements-ci.txt
      - name: Run exact CI pytest command
        working-directory: voice-agent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          pytest tests/ -v --tb=short -x \
            --ignore=tests/test_faq_retriever.py \
            --ignore=tests/test_faq_integration.py \
            --ignore=tests/test_vad_file.py \
            --ignore=tests/test_voip.py \
            --ignore=tests/test_latency_benchmark.py \
            --ignore=tests/test_sentiment.py \
            --ignore=tests/e2e \
            --ignore=tests/integration \
            --ignore=tests/test_booking_e2e_complete.py \
            --ignore=tests/test_s158_live_full.py \
            --ignore=tests/test_s158_multivertical.py 2>&1 | tee /tmp/pytest.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo "### SOL Python gate after verified fixes — Python ${{ matrix.python-version }}"
              echo
              echo "HEAD: $GITHUB_SHA"
              echo '```text'
              tail -n 180 /tmp/pytest.log
              echo '```'
            } > /tmp/pr-comment.md
            gh pr comment 60 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-comment.md
            exit "$rc"
          fi

  commit:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reapply exact verified patch and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          source_sha = os.environ["BASE_FIX_SOURCE_SHA"]
          path = ".github/workflows/sol-once-fix-python-gate.yml"
          text = subprocess.check_output(["git", "show", f"{source_sha}:{path}"], text=True)
          marker = "  APPLY_PYTHON_GATE_FIXES: |\n"
          if text.count(marker) != 1:
              raise SystemExit("fail-closed: base fix block marker mismatch")
          block = text.split(marker, 1)[1].split("\njobs:\n", 1)[0]
          lines = block.splitlines()
          if not lines or any(line and not line.startswith("    ") for line in lines):
              raise SystemExit("fail-closed: base fix block indentation mismatch")
          code = "\n".join(line[4:] if line else "" for line in lines) + "\n"
          exec(compile(code, f"{path}@{source_sha}", "exec"), {})
          PY
          python -c "$APPLY_INCREMENTAL_FIXES"
          expected=$'voice-agent/src/booking_state_machine.py\nvoice-agent/src/tts_engine.py\nvoice-agent/tests/test_booking_state_machine.py\nvoice-agent/tests/test_cancellation_window.py\nvoice-agent/tests/test_f02_vertical_fixes.py\nvoice-agent/tests/test_first_available.py\nvoice-agent/tests/test_humanness_b1_b2_b3.py\nvoice-agent/tests/test_kimi_flow.py\nvoice-agent/tests/test_phase_e_audit_p1.py\nvoice-agent/tests/test_session_persistence.py\nvoice-agent/tests/test_voice_agent_complete.py'
          test "$(git diff --name-only | sort)" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add voice-agent/src/booking_state_machine.py voice-agent/src/tts_engine.py voice-agent/tests/test_booking_state_machine.py voice-agent/tests/test_cancellation_window.py voice-agent/tests/test_f02_vertical_fixes.py voice-agent/tests/test_first_available.py voice-agent/tests/test_humanness_b1_b2_b3.py voice-agent/tests/test_kimi_flow.py voice-agent/tests/test_phase_e_audit_p1.py voice-agent/tests/test_session_persistence.py voice-agent/tests/test_voice_agent_complete.py
          git commit -m 'fix(voice): repair Python CI regressions'
          git push origin HEAD:fix/sara-gate-shell-only
