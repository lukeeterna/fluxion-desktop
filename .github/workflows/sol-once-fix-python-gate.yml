name: SOL Once Fix Python Gate

on:
  push:
    branches: [fix/sara-gate-shell-only]
    paths:
      - .github/workflows/sol-once-fix-python-gate.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Python gate corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('voice-agent/tests/test_booking_state_machine.py')
          test_text = test_path.read_text()
          test_old = '''        sm = create_state_machine()\n        sm.start_booking_flow()\n        sm.process_message("taglio")   # → WAITING_DATE\n        result = sm.process_message("annulla tutto")\n'''
          test_new = '''        sm = create_state_machine()\n        # This regression is specifically mid-booking: model an already\n        # identified client before selecting the service. Anonymous callers\n        # correctly enter WAITING_NAME after service selection.\n        sm.context.client_id = "test-client"\n        sm.context.client_name = "Test"\n        sm.context.state = BookingState.WAITING_SERVICE\n        sm.process_message("taglio")   # → WAITING_DATE\n        assert sm.context.state == BookingState.WAITING_DATE\n        result = sm.process_message("annulla tutto")\n'''
          if test_text.count(test_old) != 1:
              raise SystemExit('fail-closed: booking regression target mismatch')
          test_path.write_text(test_text.replace(test_old, test_new, 1))

          fsm_path = Path('voice-agent/src/booking_state_machine.py')
          fsm_text = fsm_path.read_text()
          fsm_old = '''        if extracted.date and (force_update or not self.context.date):\n'''
          fsm_new = '''        # A date uttered while resolving identity is a birth date, not a\n        # booking date. Let the DISAMBIGUATING_NAME handler validate it.\n        if (\n            extracted.date\n            and self.context.state != BookingState.DISAMBIGUATING_NAME\n            and (force_update or not self.context.date)\n        ):\n'''
          if fsm_text.count(fsm_old) != 1:
              raise SystemExit('fail-closed: date extraction target mismatch')
          fsm_path.write_text(fsm_text.replace(fsm_old, fsm_new, 1))

          tts_path = Path('voice-agent/src/tts_engine.py')
          tts_text = tts_path.read_text()
          tts_old = '''except ImportError:\n    _EDGE_TTS_AVAILABLE = False\n'''
          tts_new = '''except ImportError:\n    edge_tts = None  # type: ignore\n    _EDGE_TTS_AVAILABLE = False\n'''
          if tts_text.count(tts_old) != 1:
              raise SystemExit('fail-closed: Edge TTS import target mismatch')
          tts_path.write_text(tts_text.replace(tts_old, tts_new, 1))
          PY
          expected=$'voice-agent/src/booking_state_machine.py\nvoice-agent/src/tts_engine.py\nvoice-agent/tests/test_booking_state_machine.py'
          test "$(git diff --name-only | sort)" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: voice-agent/requirements-ci.txt
      - name: Install dependencies
        working-directory: voice-agent
        run: pip install -r requirements-ci.txt
      - name: Run exact CI pytest command
        working-directory: voice-agent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          pytest tests/ -v --tb=short -x \
            --ignore=tests/test_faq_retriever.py \
            --ignore=tests/test_faq_integration.py \
            --ignore=tests/test_vad_file.py \
            --ignore=tests/test_voip.py \
            --ignore=tests/test_latency_benchmark.py \
            --ignore=tests/test_sentiment.py \
            --ignore=tests/e2e \
            --ignore=tests/integration \
            --ignore=tests/test_booking_e2e_complete.py \
            --ignore=tests/test_s158_live_full.py \
            --ignore=tests/test_s158_multivertical.py 2>&1 | tee /tmp/pytest.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo "### SOL Python gate after verified fixes — Python ${{ matrix.python-version }}"
              echo
              echo "HEAD: $GITHUB_SHA"
              echo '```text'
              tail -n 180 /tmp/pytest.log
              echo '```'
            } > /tmp/pr-comment.md
            gh pr comment 60 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-comment.md
            exit "$rc"
          fi

  commit:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sara-gate-shell-only
      - name: Reapply exact verified patch and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path('voice-agent/tests/test_booking_state_machine.py')
          test_text = test_path.read_text()
          test_old = '''        sm = create_state_machine()\n        sm.start_booking_flow()\n        sm.process_message("taglio")   # → WAITING_DATE\n        result = sm.process_message("annulla tutto")\n'''
          test_new = '''        sm = create_state_machine()\n        # This regression is specifically mid-booking: model an already\n        # identified client before selecting the service. Anonymous callers\n        # correctly enter WAITING_NAME after service selection.\n        sm.context.client_id = "test-client"\n        sm.context.client_name = "Test"\n        sm.context.state = BookingState.WAITING_SERVICE\n        sm.process_message("taglio")   # → WAITING_DATE\n        assert sm.context.state == BookingState.WAITING_DATE\n        result = sm.process_message("annulla tutto")\n'''
          if test_text.count(test_old) != 1:
              raise SystemExit('fail-closed: booking regression target mismatch')
          test_path.write_text(test_text.replace(test_old, test_new, 1))

          fsm_path = Path('voice-agent/src/booking_state_machine.py')
          fsm_text = fsm_path.read_text()
          fsm_old = '''        if extracted.date and (force_update or not self.context.date):\n'''
          fsm_new = '''        # A date uttered while resolving identity is a birth date, not a\n        # booking date. Let the DISAMBIGUATING_NAME handler validate it.\n        if (\n            extracted.date\n            and self.context.state != BookingState.DISAMBIGUATING_NAME\n            and (force_update or not self.context.date)\n        ):\n'''
          if fsm_text.count(fsm_old) != 1:
              raise SystemExit('fail-closed: date extraction target mismatch')
          fsm_path.write_text(fsm_text.replace(fsm_old, fsm_new, 1))

          tts_path = Path('voice-agent/src/tts_engine.py')
          tts_text = tts_path.read_text()
          tts_old = '''except ImportError:\n    _EDGE_TTS_AVAILABLE = False\n'''
          tts_new = '''except ImportError:\n    edge_tts = None  # type: ignore\n    _EDGE_TTS_AVAILABLE = False\n'''
          if tts_text.count(tts_old) != 1:
              raise SystemExit('fail-closed: Edge TTS import target mismatch')
          tts_path.write_text(tts_text.replace(tts_old, tts_new, 1))
          PY
          expected=$'voice-agent/src/booking_state_machine.py\nvoice-agent/src/tts_engine.py\nvoice-agent/tests/test_booking_state_machine.py'
          test "$(git diff --name-only | sort)" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add voice-agent/src/booking_state_machine.py voice-agent/src/tts_engine.py voice-agent/tests/test_booking_state_machine.py
          git commit -m 'fix(voice): repair Python CI regressions'
          git push origin HEAD:fix/sara-gate-shell-only
