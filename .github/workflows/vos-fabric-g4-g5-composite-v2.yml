name: VOS Fabric G4 G5 Composite v2

on:
  push:
    branches:
      - "sol/vos-fabric-g4-g5-runtime-*"
    paths:
      - ".github/workflows/vos-fabric-g4-g5-composite-v2.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PARENT_RUN: "35018174698"
      PARENT_JOB: "104546805741"
      PARENT_HEAD: "21adb27cb48ee4c2916d341d7f831bd5b2144df2"
      FABRIC_SHA: "aadd263f62fd7bd8d349d54d4e9ed5f82107b7c9"
      EXPECTED_EVIDENCE_SHA256: "42979074b71dab0d059ac7bab7188eeb69fadc5fad7517e298bab78bb884d0a7"
      EXPECTED_CHECKPOINT_SHA256: "2eca151998c9eccad6ac48538377ba630efbcb837b584c75c38cd7aa9d910b33"
    steps:
      - name: Fetch exact parent runtime metadata and logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vos-g4-g5-composite-v2"
          rm -rf "$root"; mkdir -p "$root"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl -fsSL "${auth[@]}" "$api/actions/runs/${PARENT_RUN}" -o "$root/run.json"
          curl -fsSL "${auth[@]}" "$api/actions/runs/${PARENT_RUN}/jobs?per_page=100" -o "$root/jobs.json"
          curl -fsSL -L "${auth[@]}" "$api/actions/jobs/${PARENT_JOB}/logs" -o "$root/parent.log"
          test -s "$root/parent.log"
          echo "PARENT_LOG_SHA256=$(sha256sum "$root/parent.log" | awk '{print $1}')"

      - name: Verify exact runtime identity and bounded finalization failure class
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vos-g4-g5-composite-v2"
          python3 - "$root/run.json" "$root/jobs.json" "$PARENT_RUN" "$PARENT_JOB" "$PARENT_HEAD" <<'PY'
          import json,sys
          run_path,jobs_path,run_id,job_id,head=sys.argv[1:]
          run=json.load(open(run_path,encoding='utf-8'))
          jobs=json.load(open(jobs_path,encoding='utf-8')).get('jobs',[])
          assert str(run.get('id')) == run_id, 'parent run id drift'
          assert run.get('head_sha') == head, 'parent head drift'
          matches=[j for j in jobs if str(j.get('id'))==job_id]
          assert len(matches)==1, 'parent job not unique'
          job=matches[0]
          assert job.get('head_sha') == head, 'parent job head drift'
          assert job.get('conclusion') == 'failure', 'unexpected parent whole-job conclusion'
          steps=job.get('steps') or []
          substantive=[s for s in steps if s.get('name')=='Certify routed PUBLIC G4 G5 chain on A2 direct-official worker']
          assert len(substantive)==1 and substantive[0].get('conclusion')=='success', 'substantive parent certification was not success'
          setup=[s for s in steps if s.get('name')=='Set up job']
          assert len(setup)==1 and setup[0].get('conclusion')=='success', 'parent setup was not success'
          print('G4_G5_PARENT_RUNTIME_IDENTITY=GREEN')
          print('G4_G5_PARENT_SUBSTANTIVE_STEP=GREEN')
          print('G4_G5_PARENT_WHOLE_JOB=ADMIN_FINALIZATION_FAILURE')
          PY

      - name: Revalidate exact substantive evidence from normalized parent log
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vos-g4-g5-composite-v2"
          python3 - "$root/parent.log" "$EXPECTED_EVIDENCE_SHA256" "$EXPECTED_CHECKPOINT_SHA256" "$FABRIC_SHA" <<'PY'
          import re,sys
          path,evidence_sha,checkpoint_sha,fabric_sha=sys.argv[1:]
          ansi=re.compile(r'\x1b\[[0-9;]*m')
          timestamp=re.compile(r'^\ufeff?\d{4}-\d{2}-\d{2}T\S+Z\s+')
          normalized=[]
          with open(path,encoding='utf-8-sig',errors='replace') as fh:
              for raw in fh:
                  line=ansi.sub('',raw.rstrip('\r\n'))
                  line=timestamp.sub('',line)
                  normalized.append(line)
          lines=set(normalized)
          required=[
              'G4_ROUTER_PATH=A2_DIRECT_OFFICIAL',
              'G4_CODEX_BREAKER=OPEN',
              'G4_DATA_CLASS=PUBLIC',
              'G4_DATA_POLICY=PUBLIC_ONLY',
              'G4_NORMALIZED_RESULT=GREEN',
              'G4_DETERMINISTIC_VERIFICATION=GREEN',
              'G4_DURABLE_CHECKPOINT=GREEN',
              'G5_DISTINCT_PROCESS_BOUNDARY=GREEN',
              'G5_NEW_CONTINUATION=GREEN',
              'G5_POST_ROLLOVER_EXACT_RESUME=GREEN',
              'G5_EFFECT_CLAIMED_ONCE=GREEN',
              'G5_SAME_PAYLOAD_REPLAY_CLAIMED=0',
              'G5_CONFLICTING_REPLAY_REJECTED=GREEN',
              'G5_DUPLICATED_EFFECTS=0',
              'FOUNDER_PROMPT_SHUTTLING=0',
              'G4_G5_API_KEY_FALLBACK=0',
              'G4_G5_CREDIT_FALLBACK=0',
              'G4_G5_PAID_API_FALLBACK=0',
              'PRODUCTION_MUTATIONS=0',
              'G4=GREEN',
              'G5=GREEN',
              'G4_G5_FINAL_EVIDENCE_SHA256='+evidence_sha,
              'G5_FINAL_CHECKPOINT_SHA256='+checkpoint_sha,
              'FABRIC_SHA='+fabric_sha,
          ]
          missing=[x for x in required if x not in lines]
          if missing:
              raise SystemExit('missing normalized parent markers: '+','.join(missing))
          # Guard against passing only because the workflow script text contains an
          # echo command: exact normalized lines above must exist with no shell syntax.
          assert all(not x.startswith('echo ') for x in required)
          print('G4_G5_PARENT_LOG_EVIDENCE=GREEN')
          PY

      - name: Emit exact composite certification
        shell: bash
        run: |
          set -euo pipefail
          echo "G4=GREEN"
          echo "G5=GREEN"
          echo "G4_G5_RUNTIME_PARENT_RUN=$PARENT_RUN"
          echo "G4_G5_RUNTIME_PARENT_JOB=$PARENT_JOB"
          echo "G4_G5_RUNTIME_PARENT_HEAD=$PARENT_HEAD"
          echo "FABRIC_SHA=$FABRIC_SHA"
          echo "G4_G5_FINAL_EVIDENCE_SHA256=$EXPECTED_EVIDENCE_SHA256"
          echo "G5_FINAL_CHECKPOINT_SHA256=$EXPECTED_CHECKPOINT_SHA256"
          echo "FOUNDER_PROMPT_SHUTTLING=0"
          echo "PAID_API_FALLBACK=0"
          echo "PRODUCTION_MUTATIONS=0"
          echo "G4_G5_COMPOSITE=GREEN"
