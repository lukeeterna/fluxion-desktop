name: FLUXION Soleur One-Shot Repair

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fluxion-one-shot-repair.yml'

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[soleur-shallow-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Apply exact shallow-mirror fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/fluxion-soleur.yml')
          text = p.read_text(encoding='utf-8')
          old = '''          git init --bare "$LOCAL_ORIGIN"\n          git push "$LOCAL_ORIGIN" "$BASE_COMMIT:refs/heads/main"\n'''
          new = '''          git init --bare "$LOCAL_ORIGIN"\n          git --git-dir="$LOCAL_ORIGIN" config receive.shallowUpdate true\n          git push "$LOCAL_ORIGIN" "$BASE_COMMIT:refs/heads/main"\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one mirror snippet, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check -- .github/workflows/fluxion-soleur.yml
          git diff -- .github/workflows/fluxion-soleur.yml
          git config user.name 'FLUXION deterministic repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -- .github/workflows/fluxion-soleur.yml
          test "$(git diff --cached --name-only)" = '.github/workflows/fluxion-soleur.yml'
          git commit -m 'fix(control): allow shallow local Soleur mirror'
          git push origin HEAD:master
