name: Isolated live-transfer finalization (Mac)

on:
  push:
    branches: [tmp/live-transfer-finalize-mac-20260819]
    paths:
      - '.github/workflows/_tmp-live-transfer-finalize-mac.yml'
      - '.github/tmp/finalize_live_transfer_mac.py'

permissions:
  contents: write

concurrency:
  group: isolated-live-transfer-finalizer-mac
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 60
    env:
      BASE_SHA: 9177ab1048ef1dd2f8ab69b12b7465d8e1519be3
      TARGET_BRANCH: agent/sara-live-transfer-p0-v2
      TEMP_BRANCH: tmp/live-transfer-finalize-mac-20260819
      EXPECTED_TARGET_HEAD: 7a9301329792b5bacecfb48e5dffab39e8f97faa
    steps:
      - name: Checkout isolated temp branch
        uses: actions/checkout@v4
        with:
          ref: tmp/live-transfer-finalize-mac-20260819
          fetch-depth: 5
          clean: true

      - name: Toolchain preflight
        shell: bash
        run: |
          set -euo pipefail
          {
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            git cat-file -e "$BASE_SHA^{commit}"
            python3 --version
            go version
            cargo --version
            node --version
            npm --version
          } 2>&1 | tee "$RUNNER_TEMP/finalizer-preflight.log"
          echo PASS > "$RUNNER_TEMP/finalizer-preflight.status"

      - name: Publish start heartbeat
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p vos-out
          cat > vos-out/live-transfer-finalizer-mac-status.txt <<EOF
          STATUS=STARTED
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          BASE_SHA=$BASE_SHA
          TARGET_EXPECTED_HEAD=$EXPECTED_TARGET_HEAD
          EOF
          git add vos-out/live-transfer-finalizer-mac-status.txt
          git commit -m "chore(ci): mark live-transfer finalizer started"
          git push origin "HEAD:refs/heads/$TEMP_BRANCH"

      - name: Apply exact product patch
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 .github/tmp/finalize_live_transfer_mac.py
            python3 -m py_compile \
              voice-agent/src/orchestrator.py \
              voice-agent/src/voip_goengine.py \
              voice-agent/src/voip_pjsua2.py
            cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
            git diff --check
            grep -Fq 'audioop-lts>=0.2.2; python_version >= "3.13"' voice-agent/requirements.txt
            grep -Fq 'audioop-lts>=0.2.2; python_version >= "3.13"' voice-agent/requirements-ci.txt
            grep -Fq 'audioop-lts>=0.2.2; python_version >= "3.13"' voice-agent/requirements-windows.txt
            ! grep -Fq 'Owner fallback precedes the general transfer number' src-tauri/src/http_bridge.rs
            grep -Fq 'notification_phone' src-tauri/src/http_bridge.rs
            grep -Fq 'Return only the public caller-safe fallback' voice-agent/src/orchestrator.py
          } 2>&1 | tee "$RUNNER_TEMP/finalizer-apply.log"
          echo PASS > "$RUNNER_TEMP/finalizer-apply.status"

      - name: Python targeted gate
        shell: bash
        run: |
          set -euo pipefail
          {
            rm -rf .venv-live-transfer
            python3 -m venv .venv-live-transfer
            . .venv-live-transfer/bin/activate
            python -m pip install -q --upgrade pip
            python -m pip install -q -r voice-agent/requirements-ci.txt
            PYTHONPATH=voice-agent python -m pytest \
              voice-agent/tests/test_live_transfer_goengine.py \
              voice-agent/tests/test_live_transfer_pjsua2.py \
              voice-agent/tests/test_live_transfer_orchestrator.py \
              voice-agent/tests/test_nlu_fsm_bypass.py -q
          } 2>&1 | tee "$RUNNER_TEMP/finalizer-python.log"
          echo PASS > "$RUNNER_TEMP/finalizer-python.status"

      - name: Go gate
        shell: bash
        run: |
          set -euo pipefail
          {
            cd voice-agent/engine
            go test ./...
          } 2>&1 | tee "$RUNNER_TEMP/finalizer-go.log"
          echo PASS > "$RUNNER_TEMP/finalizer-go.status"

      - name: Rust gate
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo check --manifest-path src-tauri/Cargo.toml
            cargo test --manifest-path src-tauri/Cargo.toml --test integration_operatori test_voice_transfer_policy_roundtrip -- --nocapture
          } 2>&1 | tee "$RUNNER_TEMP/finalizer-rust.log"
          echo PASS > "$RUNNER_TEMP/finalizer-rust.status"

      - name: TypeScript gate
        shell: bash
        run: |
          set -euo pipefail
          {
            npm ci --ignore-scripts --no-audit --no-fund
            npx tsc --noEmit
          } 2>&1 | tee "$RUNNER_TEMP/finalizer-ts.log"
          echo PASS > "$RUNNER_TEMP/finalizer-ts.status"

      - name: Publish clean exact-parent commit to PR 59
        shell: bash
        run: |
          set -euo pipefail
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Strip all transport commits while preserving only verified working-tree bytes.
            git reset --mixed "$BASE_SHA"
            rm -rf .venv-live-transfer node_modules
            rm -f \
              .github/workflows/_tmp-live-transfer-finalize-mac.yml \
              .github/tmp/finalize_live_transfer_mac.py \
              vos-out/live-transfer-finalizer-mac-status.txt

            git add \
              voice-agent/requirements.txt \
              voice-agent/requirements-ci.txt \
              voice-agent/requirements-windows.txt \
              voice-agent/src/orchestrator.py \
              voice-agent/tests/test_live_transfer_orchestrator.py \
              src-tauri/src/http_bridge.rs \
              src-tauri/tests/integration_operatori.rs

            git diff --cached --check
            test -n "$(git diff --cached --name-only)"
            test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "7"
            test -z "$(git diff --cached --name-only | grep '^\.github/' || true)"

            git commit -m "fix(voice): close live-transfer production gates"
            NEW_SHA="$(git rev-parse HEAD)"
            test "$(git rev-parse HEAD^)" = "$BASE_SHA"
            printf '%s\n' "$NEW_SHA" > "$RUNNER_TEMP/finalizer-clean-head"
            echo "CLEAN_HEAD=$NEW_SHA"

            git push \
              --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_TARGET_HEAD" \
              origin "HEAD:refs/heads/$TARGET_BRANCH"
          } 2>&1 | tee "$RUNNER_TEMP/finalizer-publish.log"
          echo PASS > "$RUNNER_TEMP/finalizer-publish.status"

      - name: Publish success diagnostic
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_HEAD="$(cat "$RUNNER_TEMP/finalizer-clean-head")"
          git fetch origin "$TEMP_BRANCH" --quiet
          git checkout -B finalizer-status "origin/$TEMP_BRANCH"
          mkdir -p vos-out
          cat > vos-out/live-transfer-finalizer-mac-status.txt <<EOF
          STATUS=PASS
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          BASE_SHA=$BASE_SHA
          CLEAN_HEAD=$CLEAN_HEAD
          TARGET_BRANCH=$TARGET_BRANCH
          EOF
          git add vos-out/live-transfer-finalizer-mac-status.txt
          git commit -m "chore(ci): record live-transfer finalizer pass"
          git push origin "HEAD:refs/heads/$TEMP_BRANCH"

      - name: Publish failure diagnostic
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TEMP_BRANCH" --quiet
          git checkout -B finalizer-status "origin/$TEMP_BRANCH"
          mkdir -p vos-out
          {
            echo "STATUS=FAIL"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "BASE_SHA=$BASE_SHA"
            for gate in preflight apply python go rust ts publish; do
              if [ -f "$RUNNER_TEMP/finalizer-$gate.status" ]; then
                echo "GATE_${gate^^}=PASS"
              else
                echo "GATE_${gate^^}=FAIL_OR_NOT_REACHED"
              fi
            done
            for gate in preflight apply python go rust ts publish; do
              echo
              echo "===== $gate LOG (tail 120) ====="
              tail -n 120 "$RUNNER_TEMP/finalizer-$gate.log" 2>/dev/null || true
            done
          } > vos-out/live-transfer-finalizer-mac-status.txt
          git add vos-out/live-transfer-finalizer-mac-status.txt
          git commit -m "chore(ci): record live-transfer finalizer failure"
          git push origin "HEAD:refs/heads/$TEMP_BRANCH"
