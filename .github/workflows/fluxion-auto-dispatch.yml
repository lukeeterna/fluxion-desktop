name: FLUXION Auto Dispatch Bridge

on:
  issues:
    types: [labeled]

concurrency:
  group: fluxion-auto-dispatch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.label.name == 'bug/ci-detected' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TASK_JSON: ${{ github.event.issue.body }}
    steps:
      - name: Validate TASK and hand it to Soleur
        run: |
          set -euo pipefail
          printf '%s' "$TASK_JSON" | jq -e 'type == "object" and .kind == "TASK" and .channel == "FXD-824F35830C8A"' >/dev/null
          gh label create 'fluxion:auto' \
            --repo "$GITHUB_REPOSITORY" \
            --color '1f883d' \
            --description 'Canonical FLUXION TASK ready for hosted Soleur' \
            --force
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label 'fluxion:auto'
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body 'FLUXION_AUTO_DISPATCH=PASS — TASK consegnato al workflow Soleur hosted tramite label interna fluxion:auto.'
