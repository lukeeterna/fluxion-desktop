name: FLUXION Auto Dispatch Bridge

on:
  issues:
    types: [labeled]

concurrency:
  group: fluxion-auto-dispatch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.label.name == 'bug/ci-detected' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TASK_JSON: ${{ github.event.issue.body }}
    steps:
      - name: Validate issue body is JSON and dispatch Soleur
        run: |
          set -euo pipefail
          printf '%s' "$TASK_JSON" | jq -e 'type == "object" and .kind == "TASK" and .channel == "FXD-824F35830C8A"' >/dev/null
          payload="$(jq -n --arg task "$TASK_JSON" '{ref:"master",inputs:{task_json:$task}}')"
          printf '%s' "$payload" | gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/fluxion-soleur.yml/dispatches" \
            --input -
          gh issue comment "${{ github.event.issue.number }}" --body "FLUXION_AUTO_DISPATCH=PASS — TASK inoltrato al workflow Soleur hosted su master."
