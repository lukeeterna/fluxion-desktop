name: VOS Fabric G2 Local Device Auth

on:
  push:
    branches:
      - "sol/vos-fabric-g2-worker-*"
    paths:
      - ".github/workflows/vos-fabric-g2-device-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vos-fabric-g2-device-auth
  cancel-in-progress: false

jobs:
  auth:
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 15
    steps:
      - name: Run ChatGPT device auth with local-only prompt
        shell: bash
        run: |
          set -euo pipefail

          PROXY="$RUNNER_TEMP/vos-g2-auth-proxy-${GITHUB_RUN_ID}.py"
          cat > "$PROXY" <<'PY'
          #!/usr/bin/env python3
          import select
          import socket
          import socketserver

          BIND = ("192.168.64.1", 18080)
          ALLOWED_SOURCE = "192.168.64.3"

          class Handler(socketserver.StreamRequestHandler):
              def handle(self):
                  if self.client_address[0] != ALLOWED_SOURCE:
                      return
                  self.connection.settimeout(20)
                  line = self.rfile.readline(8192).decode("ascii", "replace").strip()
                  parts = line.split()
                  if len(parts) != 3 or parts[0].upper() != "CONNECT":
                      self.wfile.write(b"HTTP/1.1 405 Method Not Allowed\r\n\r\n")
                      return
                  target = parts[1]
                  if ":" not in target:
                      self.wfile.write(b"HTTP/1.1 400 Bad Request\r\n\r\n")
                      return
                  host, port_s = target.rsplit(":", 1)
                  try:
                      port = int(port_s)
                  except ValueError:
                      return
                  if port != 443:
                      self.wfile.write(b"HTTP/1.1 403 Forbidden\r\n\r\n")
                      return
                  while True:
                      header = self.rfile.readline(8192)
                      if header in (b"\r\n", b"\n", b""):
                          break
                  try:
                      upstream = socket.create_connection((host, port), timeout=15)
                  except OSError:
                      self.wfile.write(b"HTTP/1.1 502 Bad Gateway\r\n\r\n")
                      return
                  with upstream:
                      upstream.setblocking(False)
                      self.connection.setblocking(False)
                      self.wfile.write(b"HTTP/1.1 200 Connection Established\r\n\r\n")
                      sockets = [self.connection, upstream]
                      while True:
                          readable, _, exceptional = select.select(sockets, [], sockets, 60)
                          if exceptional or not readable:
                              return
                          for src in readable:
                              dst = upstream if src is self.connection else self.connection
                              try:
                                  data = src.recv(65536)
                              except OSError:
                                  return
                              if not data:
                                  return
                              try:
                                  dst.sendall(data)
                              except OSError:
                                  return

          class Server(socketserver.ThreadingTCPServer):
              allow_reuse_address = True
              daemon_threads = True

          with Server(BIND, Handler) as server:
              print("READY", flush=True)
              server.serve_forever()
          PY
          chmod 700 "$PROXY"
          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$PROXY" imac:/tmp/vos-g2-auth-proxy.py

          REMOTE="$RUNNER_TEMP/vos-g2-device-auth-${GITHUB_RUN_ID}.sh"
          cat > "$REMOTE" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          export LC_ALL=C LANG=C

          fail() { printf 'G2_DEVICE_AUTH_BLOCKED=%s\n' "$*"; exit 2; }
          pass() { printf 'PASS %-32s %s\n' "$1" "${2:-}"; }

          MP=""
          for candidate in "$(command -v multipass 2>/dev/null || true)" /usr/local/bin/multipass /opt/homebrew/bin/multipass "/Library/Application Support/com.canonical.multipass/bin/multipass"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then MP="$candidate"; break; fi
          done
          [ -n "$MP" ] || fail MULTIPASS_MISSING
          "$MP" info vos-worker >/dev/null 2>&1 || fail VOS_WORKER_MISSING
          owner="$($MP exec vos-worker -- sh -c 'cat /var/lib/vos-fabric/worker-owner 2>/dev/null || true')"
          [ "$owner" = "VOS_FABRIC_G2" ] || fail VOS_WORKER_OWNER
          [ "$($MP exec vos-worker -- uname -m)" = "x86_64" ] || fail GUEST_ARCH
          [ "$($MP exec vos-worker -- /usr/local/bin/codex --version | head -1)" = "codex-cli 0.154.0" ] || fail CODEX_VERSION
          ifconfig bridge100 | grep -q 'inet 192\.168\.64\.1 ' || fail BRIDGE100

          console_user="$(stat -f '%Su' /dev/console 2>/dev/null || true)"
          [ -n "$console_user" ] && [ "$console_user" != root ] && [ "$console_user" != loginwindow ] || fail GUI_SESSION_REQUIRED

          proxy_pid=""
          auth_pid=""
          cleanup() {
            if [ -n "$auth_pid" ]; then kill "$auth_pid" >/dev/null 2>&1 || true; fi
            if [ -n "$proxy_pid" ]; then kill "$proxy_pid" >/dev/null 2>&1 || true; fi
            rm -f /tmp/vos-g2-auth-proxy.py /tmp/vos-g2-auth-proxy.log /tmp/vos-g2-device-auth-local.txt
          }
          trap cleanup EXIT INT TERM

          /usr/bin/python3 /tmp/vos-g2-auth-proxy.py > /tmp/vos-g2-auth-proxy.log 2>&1 &
          proxy_pid=$!
          ready=0
          for _ in 1 2 3 4 5; do
            if grep -q '^READY$' /tmp/vos-g2-auth-proxy.log 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || fail PROXY_NOT_READY
          pass EPHEMERAL_PROXY "bridge-local; source=192.168.64.3; CONNECT:443 only"

          "$MP" exec vos-worker -- mkdir -p /home/ubuntu/.codex-vos-fabric

          "$MP" exec vos-worker -- env \
            VOS_CODEX_HOME=/home/ubuntu/.codex-vos-fabric \
            HTTPS_PROXY=http://192.168.64.1:18080 \
            HTTP_PROXY=http://192.168.64.1:18080 \
            https_proxy=http://192.168.64.1:18080 \
            http_proxy=http://192.168.64.1:18080 \
            /usr/local/lib/vos-fabric/codex_worker_gate.sh device-auth \
            > /tmp/vos-g2-device-auth-local.txt 2>&1 &
          auth_pid=$!

          prompt_ready=0
          for _ in $(seq 1 30); do
            if [ -s /tmp/vos-g2-device-auth-local.txt ]; then
              if grep -Eqi 'https?://|device|code' /tmp/vos-g2-device-auth-local.txt; then
                prompt_ready=1
                break
              fi
            fi
            if ! kill -0 "$auth_pid" >/dev/null 2>&1; then break; fi
            sleep 1
          done

          if ! kill -0 "$auth_pid" >/dev/null 2>&1; then
            wait "$auth_pid" || fail DEVICE_AUTH_EARLY_EXIT
          elif [ "$prompt_ready" -ne 1 ]; then
            fail DEVICE_AUTH_PROMPT_NOT_AVAILABLE
          else
            auth_text="$(tail -n 30 /tmp/vos-g2-device-auth-local.txt | sed $'s/\033\[[0-9;]*[[:alpha:]]//g')"
            auth_url="$(printf '%s\n' "$auth_text" | grep -Eo 'https://[^[:space:]]+' | head -1 || true)"
            if [ -n "$auth_url" ]; then /usr/bin/open "$auth_url" >/dev/null 2>&1 || true; fi

            /usr/bin/osascript - "$auth_text" <<'OSA' >/dev/null
          on run argv
            set authText to item 1 of argv
            display dialog authText with title "VOS Codex — Login ChatGPT" buttons {"Ho completato il login"} default button 1 with icon note giving up after 600
          end run
          OSA

            for _ in $(seq 1 120); do
              if ! kill -0 "$auth_pid" >/dev/null 2>&1; then break; fi
              sleep 5
            done
            if kill -0 "$auth_pid" >/dev/null 2>&1; then fail DEVICE_AUTH_TIMEOUT; fi
            wait "$auth_pid" || fail DEVICE_AUTH_FAILED
          fi
          auth_pid=""

          "$MP" exec vos-worker -- env VOS_CODEX_HOME=/home/ubuntu/.codex-vos-fabric /usr/local/bin/codex login status >/dev/null 2>&1 || fail AUTH_NOT_PERSISTED
          printf 'CODEX_CHATGPT_AUTH=GREEN\n'

          uid="$(id -u)"
          launch_running() {
            label="$1"
            for domain in "gui/$uid" "user/$uid" system; do
              if launchctl print "$domain/$label" 2>/dev/null | grep -Eq 'state = running|pid = [0-9]+'; then return 0; fi
            done
            launchctl list 2>/dev/null | awk -v label="$label" '$3==label && $1 ~ /^[0-9]+$/ {ok=1} END{exit ok?0:1}'
          }
          launch_running com.zeroclaw.fall-detector || fail POST_GUARDIAN
          launch_running com.go2rtc || fail POST_GO2RTC
          launch_running com.mosquitto.broker || fail POST_MQTT
          curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null || fail POST_FLUXION_HEALTH
          lsof -nP -iTCP:3002 -sTCP:LISTEN 2>/dev/null | grep -q ':3002' || fail POST_FLUXION_3002
          if ! lsof -nP -iUDP:5080 2>/dev/null | grep -q ':5080' && ! lsof -nP -iTCP:5080 -sTCP:LISTEN 2>/dev/null | grep -q ':5080'; then fail POST_FLUXION_5080; fi
          mount | grep -q ' on /Volumes/NAS_LOCAL ' || fail POST_NAS_LOCAL
          pass PRODUCTION_REGRESSION_CHECK "Guardian/FLUXION/NAS unchanged"
          printf 'G2_DEVICE_AUTH=GREEN\n'
          REMOTE
          chmod 700 "$REMOTE"
          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$REMOTE" imac:/tmp/vos-g2-device-auth.sh
          ssh -o BatchMode=yes -o ConnectTimeout=8 imac 'bash /tmp/vos-g2-device-auth.sh; rc=$?; rm -f /tmp/vos-g2-device-auth.sh; exit $rc'
