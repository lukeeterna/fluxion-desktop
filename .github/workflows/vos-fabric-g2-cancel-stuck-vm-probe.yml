name: VOS Fabric Cancel Stuck VM Probe

on:
  push:
    branches:
      - "sol/vos-fabric-g2-worker-*"
    paths:
      - ".github/workflows/vos-fabric-g2-cancel-stuck-vm-probe.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Force-cancel only exact stuck VM state probe
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: "34864244271"
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}"
          state="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
          status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$state")"
          echo "TARGET_STATUS_BEFORE=$status"
          if [ "$status" = "completed" ]; then
            echo 'EXACT_VM_PROBE_ALREADY_COMPLETED=1'
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/force-cancel" >/dev/null
          echo 'EXACT_VM_PROBE_FORCE_CANCEL_REQUESTED=1'
