name: FLUXION Sonnet Review Gate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fluxion-sonnet-review.yml
      - tools/fluxion_sonnet_reviewer.py
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fluxion-sonnet-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  control-selftest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
      - name: Validate reviewer
        run: |
          set -euo pipefail
          python3 -m py_compile tools/fluxion_sonnet_reviewer.py
          test -s .github/workflows/fluxion-sonnet-review.yml
          echo "CONTROL_SELFTEST PASS"

  independent-review:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve sealed PR metadata
        id: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          event_name = os.environ["GITHUB_EVENT_NAME"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if event_name == "pull_request":
              pr = event["pull_request"]
          else:
              number = os.environ.get("DISPATCH_PR_NUMBER", "").strip()
              if not number.isdigit():
                  raise SystemExit("workflow_dispatch requires numeric pr_number")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{number}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "fluxion-sonnet-headless-reviewer",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  pr = json.load(response)

          meta = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(pr["number"]),
              "title": pr.get("title", ""),
              "body": pr.get("body") or "",
              "author": (pr.get("user") or {}).get("login", ""),
              "base_ref": pr["base"]["ref"],
              "head_ref": pr["head"]["ref"],
              "base_sha": pr["base"]["sha"],
              "head_sha": pr["head"]["sha"],
          }
          Path("artifacts/PR_META.json").write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"pr_number={meta['pr_number']}\n")
              handle.write(f"base_tip_sha={meta['base_sha']}\n")
              handle.write(f"head_sha={meta['head_sha']}\n")
          PY

      - name: Clone immutable base control plane
        env:
          BASE_TIP_SHA: ${{ steps.target.outputs.base_tip_sha }}
        run: |
          set -euo pipefail
          git clone --no-recurse-submodules https://github.com/${GITHUB_REPOSITORY}.git control
          git -C control checkout --detach "$BASE_TIP_SHA"
          test "$(git -C control rev-parse HEAD)" = "$BASE_TIP_SHA"

      - name: Clone sealed PR head and normalize merge-base
        env:
          BASE_TIP_SHA: ${{ steps.target.outputs.base_tip_sha }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          git clone --no-recurse-submodules https://github.com/${GITHUB_REPOSITORY}.git target
          git -C target checkout --detach "$HEAD_SHA"
          test "$(git -C target rev-parse HEAD)" = "$HEAD_SHA"
          MERGE_BASE_SHA="$(git -C target merge-base "$BASE_TIP_SHA" "$HEAD_SHA")"
          test -n "$MERGE_BASE_SHA"
          python3 - "$MERGE_BASE_SHA" "$BASE_TIP_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("artifacts/PR_META.json")
          meta = json.loads(path.read_text(encoding="utf-8"))
          meta["base_tip_sha"] = sys.argv[2]
          meta["base_sha"] = sys.argv[1]
          path.write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"MERGE_BASE={sys.argv[1]} BASE_TIP={sys.argv[2]}")
          PY

      - name: Prepare sealed deterministic dossier
        id: prepare
        run: |
          set -o pipefail
          python3 control/tools/fluxion_sonnet_reviewer.py \
            prepare target artifacts artifacts/PR_META.json \
            2>&1 | tee artifacts/PREPARE.log

      - name: Run fresh no-tools Sonnet review
        id: sonnet
        if: steps.prepare.outputs.invoke_model == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action/base-action@v1
        with:
          prompt_file: ${{ steps.prepare.outputs.prompt_path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model sonnet
            --max-turns 3
            --disallowedTools "Bash,Edit,Write,Read,Grep,Glob,WebFetch,WebSearch,NotebookEdit,Task,TaskOutput,KillTask"
            --json-schema
            '{"type":"object","additionalProperties":false,"properties":{"verdict":{"type":"string","enum":["GREEN","RED","BLOCKED"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"string"}},"required_changes":{"type":"array","items":{"type":"string"}},"safe_to_merge":{"type":"string","enum":["yes","no"]},"next_action":{"type":"string"}},"required":["verdict","summary","findings","required_changes","safe_to_merge","next_action"]}'

      - name: Validate and publish content-addressed verdict
        if: always() && steps.prepare.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_STEP_OUTCOME: ${{ steps.sonnet.outcome }}
          STRUCTURED_OUTPUT: ${{ steps.sonnet.outputs.structured_output }}
        run: |
          set -o pipefail
          python3 control/tools/fluxion_sonnet_reviewer.py \
            finalize target artifacts artifacts/PR_META.json \
            2>&1 | tee artifacts/FINALIZE.log

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxion-sonnet-pr-${{ steps.target.outputs.pr_number }}-${{ steps.target.outputs.head_sha }}
          path: |
            artifacts/PR_META.json
            artifacts/AUDIT.json
            artifacts/AUDIT.sha256
            artifacts/PROMPT.sha256
            artifacts/RESULT.json
            artifacts/RESULT.sha256
            artifacts/PREPARE.log
            artifacts/FINALIZE.log
          if-no-files-found: warn
          retention-days: 30
