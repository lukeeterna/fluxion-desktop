name: FLUXION Sonnet Review Gate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fluxion-sonnet-review.yml
      - tools/fluxion_sonnet_reviewer.py
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fluxion-sonnet-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  control-static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: v1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      GENERIC_SHA256: b3bd8640ee4a30fc26a9eb4ea3c1ab5914f4d492206ff7da70ec44f53961bec3
      ROUTER_SHA256: 967da5bec0e13413d0706ce03bd09bdb1f77e5b323159f5b2b9a3d994bf40d33
    steps:
      - name: Fetch exact PR-head control files
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY" || {
            echo "BLOCKED: control-plane review requires same-repository head" >&2
            exit 2
          }
          mkdir -p .github/workflows .github/bootstrap
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${HEAD_SHA}"
          for path in \
            .github/workflows/fluxion-generic-write-bootstrap.yml \
            .github/workflows/fluxion-sonnet-review.yml \
            .github/bootstrap/install-generic-write-lane.zsh \
            .github/bootstrap/fluxion-generic-write-executor \
            .github/bootstrap/fluxion-draft-bus-executor
          do
            curl --fail --silent --show-error --location --retry 3 \
              "$base/$path" --output "$path"
            test -s "$path"
          done

      - name: Install content-addressed actionlint
        run: |
          set -euo pipefail
          archive="/tmp/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "$url" --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp actionlint
          test -x /tmp/actionlint
          /tmp/actionlint -version

      - name: Validate workflow and bootstrap syntax
        run: |
          set -euo pipefail
          git init -q
          cat > .github/actionlint.yaml <<'EOF'
          self-hosted-runner:
            labels:
              - macbook
              - fluxion
          EOF
          /tmp/actionlint \
            .github/workflows/fluxion-generic-write-bootstrap.yml \
            .github/workflows/fluxion-sonnet-review.yml
          echo "ACTIONLINT=PASS"

          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zsh
          fi
          zsh --version
          zsh -n .github/bootstrap/install-generic-write-lane.zsh
          zsh -n .github/bootstrap/fluxion-generic-write-executor
          echo "ZSH_SYNTAX=PASS"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/bootstrap/fluxion-draft-bus-executor')
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          PY
          echo "PYTHON_WRAPPER_COMPILE=PASS"

          test "$(sha256sum .github/bootstrap/fluxion-generic-write-executor | awk '{print $1}')" = "$GENERIC_SHA256"
          test "$(sha256sum .github/bootstrap/fluxion-draft-bus-executor | awk '{print $1}')" = "$ROUTER_SHA256"
          grep -F -- '--tools Read,Edit,Write' .github/bootstrap/fluxion-generic-write-executor
          grep -F -- '--allowedTools Read Edit Write' .github/bootstrap/fluxion-generic-write-executor
          grep -F -- '--strict-mcp-config' .github/bootstrap/fluxion-generic-write-executor
          grep -F -- '--mcp-config' .github/bootstrap/fluxion-generic-write-executor
          grep -F -- 'bash_tool=absent' .github/bootstrap/fluxion-generic-write-executor
          if grep -E -- '--tools[^\n]*Bash|--allowedTools[^\n]*Bash' .github/bootstrap/fluxion-generic-write-executor; then
            echo "BLOCKED: Bash is available to writer" >&2
            exit 2
          fi
          echo "WRITER_CAPABILITY_BOUNDARY=PASS"
          echo "EXECUTOR_HASHES=PASS"

      - name: Prove poison quarantine does not starve healthy write
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          root="$tmp/.local/share/fluxion-draft-bus"
          bin="$tmp/.local/bin"
          mkdir -p "$root/queue" "$bin"

          cp .github/bootstrap/fluxion-draft-bus-executor "$tmp/router.py"
          cat > "$bin/fluxion-generic-write-executor" <<'EOF'
          #!/bin/zsh
          printf '%s\n' "$1" > "$HOME/generic-called.txt"
          EOF
          chmod 700 "$bin/fluxion-generic-write-executor"
          cat > "$bin/fluxion-draft-bus-executor-ro-core" <<'EOF'
          from pathlib import Path
          Path.home().joinpath('ro-called.txt').write_text('called\n')
          EOF
          chmod 700 "$bin/fluxion-draft-bus-executor-ro-core"

          printf '{not-json\n' > "$root/queue/000-malformed.json"
          printf '{"schema_version":1,"action_profile":"FIX_SCOPED_BUG"}\n' > "$root/queue/001-missing-created.json"
          cat > "$root/queue/002-healthy.json" <<'EOF'
          {"schema_version":1,"created_at":"2026-08-10T20:00:00Z","action_profile":"FIX_SCOPED_BUG"}
          EOF

          HOME="$tmp" python3 "$tmp/router.py"
          test -s "$tmp/generic-called.txt"
          grep -F "$root/queue/002-healthy.json" "$tmp/generic-called.txt"
          test ! -e "$tmp/ro-called.txt"
          test ! -e "$root/queue/000-malformed.json"
          test ! -e "$root/queue/001-missing-created.json"
          test -e "$root/queue/002-healthy.json"
          test "$(find "$root/router-quarantine" -type f -name '*.bad' | wc -l | tr -d ' ')" = 2
          test "$(find "$root/router-quarantine" -type f -name '*.json' | wc -l | tr -d ' ')" = 2
          python3 - "$root/router-quarantine" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          q=Path(sys.argv[1])
          metas=sorted(q.glob('*.json'))
          assert len(metas)==2
          for meta in metas:
              d=json.loads(meta.read_text(encoding='utf-8'))
              assert d['schema_version']==1
              assert d['reason']
              payload=q/(meta.name[:-5]+'.bad')
              assert payload.is_file()
              assert hashlib.sha256(payload.read_bytes()).hexdigest()==d['sha256']
          PY
          echo "POISON_QUARANTINE=PASS"
          echo "CONTROL_STATIC=PASS"

  control-selftest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
      - name: Validate reviewer
        run: |
          set -euo pipefail
          python3 -m py_compile tools/fluxion_sonnet_reviewer.py
          test -s .github/workflows/fluxion-sonnet-review.yml
          echo "CONTROL_SELFTEST PASS"

  independent-review:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve sealed PR metadata
        id: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          event_name=os.environ['GITHUB_EVENT_NAME']
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if event_name=='pull_request':
              pr=event['pull_request']
          else:
              number=os.environ.get('DISPATCH_PR_NUMBER','').strip()
              if not number.isdigit(): raise SystemExit('workflow_dispatch requires numeric pr_number')
              request=urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{number}",
                  headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'fluxion-sonnet-headless-reviewer'})
              with urllib.request.urlopen(request,timeout=30) as response: pr=json.load(response)
          meta={'repository':os.environ['GITHUB_REPOSITORY'],'pr_number':int(pr['number']),'title':pr.get('title',''),'body':pr.get('body') or '','author':(pr.get('user') or {}).get('login',''),'base_ref':pr['base']['ref'],'head_ref':pr['head']['ref'],'base_sha':pr['base']['sha'],'head_sha':pr['head']['sha']}
          Path('artifacts/PR_META.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f"pr_number={meta['pr_number']}\nbase_tip_sha={meta['base_sha']}\nhead_sha={meta['head_sha']}\n")
          PY

      - name: Clone immutable base control plane
        env:
          BASE_TIP_SHA: ${{ steps.target.outputs.base_tip_sha }}
        run: |
          set -euo pipefail
          git clone --no-recurse-submodules "https://github.com/${GITHUB_REPOSITORY}.git" control
          git -C control checkout --detach "$BASE_TIP_SHA"
          test "$(git -C control rev-parse HEAD)" = "$BASE_TIP_SHA"

      - name: Clone sealed PR head and normalize merge-base
        env:
          BASE_TIP_SHA: ${{ steps.target.outputs.base_tip_sha }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          git clone --no-recurse-submodules "https://github.com/${GITHUB_REPOSITORY}.git" target
          git -C target checkout --detach "$HEAD_SHA"
          test "$(git -C target rev-parse HEAD)" = "$HEAD_SHA"
          MERGE_BASE_SHA="$(git -C target merge-base "$BASE_TIP_SHA" "$HEAD_SHA")"
          test -n "$MERGE_BASE_SHA"
          python3 - "$MERGE_BASE_SHA" "$BASE_TIP_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path('artifacts/PR_META.json')
          meta=json.loads(path.read_text(encoding='utf-8'))
          meta['base_tip_sha']=sys.argv[2]
          meta['base_sha']=sys.argv[1]
          path.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f"MERGE_BASE={sys.argv[1]} BASE_TIP={sys.argv[2]}")
          PY

      - name: Prepare sealed deterministic dossier
        id: prepare
        run: |
          set -o pipefail
          python3 control/tools/fluxion_sonnet_reviewer.py prepare target artifacts artifacts/PR_META.json 2>&1 | tee artifacts/PREPARE.log

      - name: Run fresh no-tools Sonnet review
        id: sonnet
        if: steps.prepare.outputs.invoke_model == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action/base-action@v1
        with:
          prompt_file: ${{ steps.prepare.outputs.prompt_path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model sonnet
            --max-turns 10
            --disallowedTools "Bash,Edit,Write,Read,Grep,Glob,WebFetch,WebSearch,NotebookEdit,Task,TaskOutput,KillTask"
            --json-schema
            '{"type":"object","additionalProperties":false,"properties":{"verdict":{"type":"string","enum":["GREEN","RED","BLOCKED"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"string"}},"required_changes":{"type":"array","items":{"type":"string"}},"safe_to_merge":{"type":"string","enum":["yes","no"]},"next_action":{"type":"string"}},"required":["verdict","summary","findings","required_changes","safe_to_merge","next_action"]}'

      - name: Validate and publish content-addressed verdict
        if: always() && steps.prepare.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_STEP_OUTCOME: ${{ steps.sonnet.outcome }}
          STRUCTURED_OUTPUT: ${{ steps.sonnet.outputs.structured_output }}
        run: |
          set -o pipefail
          python3 control/tools/fluxion_sonnet_reviewer.py finalize target artifacts artifacts/PR_META.json 2>&1 | tee artifacts/FINALIZE.log

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fluxion-sonnet-pr-${{ steps.target.outputs.pr_number }}-${{ steps.target.outputs.head_sha }}
          path: |
            artifacts/PR_META.json
            artifacts/AUDIT.json
            artifacts/AUDIT.sha256
            artifacts/PROMPT.sha256
            artifacts/RESULT.json
            artifacts/RESULT.sha256
            artifacts/PREPARE.log
            artifacts/FINALIZE.log
          if-no-files-found: warn
          retention-days: 30
