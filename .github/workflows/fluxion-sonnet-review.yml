name: FLUXION Control Plane Static Gate

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
    paths:
      - .github/bootstrap/fluxion-draft-bus-executor
      - .github/bootstrap/fluxion-generic-write-executor
      - .github/bootstrap/fluxion-trusted-publish-gate.py
      - .github/bootstrap/install-generic-write-lane.zsh
      - .github/workflows/fluxion-generic-write-bootstrap.yml
      - .github/workflows/fluxion-sonnet-review.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluxion-control-static-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  control-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact control-plane files without checkout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .github/bootstrap .github/workflows
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${HEAD_SHA}"
          for path in \
            .github/bootstrap/fluxion-draft-bus-executor \
            .github/bootstrap/fluxion-generic-write-executor \
            .github/bootstrap/fluxion-trusted-publish-gate.py \
            .github/bootstrap/install-generic-write-lane.zsh \
            .github/workflows/fluxion-generic-write-bootstrap.yml \
            .github/workflows/fluxion-sonnet-review.yml
          do
            curl --fail --silent --show-error --location --retry 3 "$base/$path" --output "$path"
            test -s "$path"
          done
          printf '%s\n' "$HEAD_SHA" > HEAD_SHA.txt
          echo "EXACT_CONTROL_FETCH=PASS"

      - name: Verify PR workflow has no privileged model boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/fluxion-sonnet-review.yml').read_text(encoding='utf-8')
          forbidden=['CLAUDE_CODE_'+'OAUTH_TOKEN','anthropics/'+'claude-code-action','secrets'+'.','self'+'-hosted']
          found=[x for x in forbidden if x in text]
          if found: raise SystemExit('forbidden PR workflow authority: '+','.join(found))
          print('PR_WORKFLOW_CLAUDE_SECRET=ABSENT')
          print('PR_WORKFLOW_PRIVILEGED_SECRET=ABSENT')
          print('PR_EVENT_TO_PRIVILEGED_MAC=BLOCKED')
          PY

      - name: Install syntax checker dependency
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh

      - name: Syntax, integrity and deterministic trust boundary
        run: |
          set -euo pipefail
          /bin/zsh -n .github/bootstrap/fluxion-generic-write-executor
          /bin/zsh -n .github/bootstrap/install-generic-write-lane.zsh
          python3 -m py_compile .github/bootstrap/fluxion-draft-bus-executor .github/bootstrap/fluxion-trusted-publish-gate.py
          echo "SYNTAX_COMPILE=PASS"

          generic_blob="$(git hash-object --no-filters .github/bootstrap/fluxion-generic-write-executor)"
          router_blob="$(git hash-object --no-filters .github/bootstrap/fluxion-draft-bus-executor)"
          gate_blob="$(git hash-object --no-filters .github/bootstrap/fluxion-trusted-publish-gate.py)"
          expected_generic="$(sed -n 's/^EXPECTED_GENERIC_SRC_BLOB="\([0-9a-f]*\)"$/\1/p' .github/bootstrap/install-generic-write-lane.zsh)"
          expected_router="$(sed -n 's/^EXPECTED_ROUTER_SRC_BLOB="\([0-9a-f]*\)"$/\1/p' .github/bootstrap/install-generic-write-lane.zsh)"
          expected_gate="$(sed -n 's/^EXPECTED_PUBLISH_GATE_BLOB="\([0-9a-f]*\)"$/\1/p' .github/bootstrap/install-generic-write-lane.zsh)"
          test "$generic_blob" = "$expected_generic"
          test "$router_blob" = "$expected_router"
          test "$gate_blob" = "$expected_gate"
          echo "EXECUTOR_INTEGRITY=PASS"

          grep -F -- 'EXPECTED_CLAUDE_VERSION="2.1.110"' .github/bootstrap/fluxion-generic-write-executor
          grep -F -- '--tools Read,Edit,Write' .github/bootstrap/fluxion-generic-write-executor
          grep -F -- '--tools ""' .github/bootstrap/fluxion-generic-write-executor
          grep -F -- 'fresh_review_root_of_trust=no' .github/bootstrap/fluxion-generic-write-executor
          grep -F -- 'FRESH_REVIEW_RED' .github/bootstrap/fluxion-trusted-publish-gate.py
          grep -F -- 'DETERMINISTIC_REQUIRED' .github/bootstrap/fluxion-trusted-publish-gate.py
          grep -F -- "review.get('tools_used')" .github/bootstrap/fluxion-trusted-publish-gate.py
          echo "WRITER_CAPABILITY_BOUNDARY=PASS"
          echo "WRITER_CAN_LAUNCH_REVIEW=NO"
          echo "FRESH_REVIEW_ROOT_OF_TRUST=NO"

      - name: Prove trusted Mac behavioral canary wiring and E1 pin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          installer=Path('.github/bootstrap/install-generic-write-lane.zsh').read_text(encoding='utf-8')
          generic=Path('.github/bootstrap/fluxion-generic-write-executor').read_text(encoding='utf-8')
          forbidden=['install'+'.'+'sh','npm'+' install','brew'+' install','curl'+'|'+'bash']
          found=[x for x in forbidden if x in installer]
          if found: raise SystemExit('install/update path present in behavioral canary: '+','.join(found))
          required=[
              'EXPECTED_CLAUDE_VERSION="2.1.110"',
              'verify_pin_file "$CLAUDE_PIN" "$CLAUDE_REAL" "$CLAUDE_SHA"',
              'CLAUDE_RUNTIME_INTEGRITY=PASS',
              'WRITER_CAPABILITY_BEHAVIOR=PASS',
              'OUTSIDE_WRITE_BLOCKED=PASS',
              'BASH_CAPABILITY_ABSENT=PASS',
              'REVIEW_NO_TOOLS_BEHAVIOR=PASS',
              '--tools Read,Edit,Write',
              '--tools ""',
          ]
          missing=[x for x in required if x not in installer]
          if missing: raise SystemExit('behavioral canary wiring missing: '+','.join(missing))
          required_generic=["d.get('sha256')",'os.path.realpath(path)==path','v.returncode==0']
          missing_generic=[x for x in required_generic if x not in generic]
          if missing_generic:
              raise SystemExit('steady-state Claude pin enforcement incomplete:'+','.join(missing_generic))
          if '/usr/bin/codesign' in installer or '/usr/bin/codesign' in generic:
              raise SystemExit('incompatible Claude codesign gate still present')
          call='behavioral_canary || { echo "STOP: trusted Mac behavioral canary failed"; exit 2; }'
          activation='date -u +%Y-%m-%dT%H:%M:%SZ > "$ACTIVATED"'
          call_pos=installer.rfind(call)
          activation_pos=installer.find(activation)
          if call_pos < 0 or activation_pos < 0 or call_pos >= activation_pos:
              raise SystemExit('activation is not strictly after behavioral canary')
          if installer.count(call) < 2:
              raise SystemExit('behavioral canary not enforced on install and exact reinstall')
          print('NO_INSTALL_PATH_IN_CANARY=PASS')
          print('CLAUDE_RUNTIME_PIN=PASS')
          print('BEHAVIORAL_CANARY_WIRED_TO_TRUSTED_MAC=PASS')
          print('ACTIVATION_AFTER_BEHAVIORAL_CANARY=PASS')
          PY

      - name: Prove trusted CAS gate and E2 semantics
        run: |
          set -euo pipefail
          python3 .github/bootstrap/fluxion-trusted-publish-gate.py --self-test | tee /tmp/publish-selftest.log
          for marker in \
            TRUSTED_PUBLISHER_PRESENT EXPECTED_BASE_ENFORCED NON_FORCE_PUBLISH \
            UNEXPECTED_ORIGIN_MOVE_BLOCKS CANDIDATE_EXACT_PARENT ALLOWED_PATHS_ENFORCED \
            NON_FAST_FORWARD_BLOCKS UNATTESTED_MASTER_BLOCKS REVIEW_DOSSIER_PIN_ENFORCED \
            FRESH_REVIEW_RED_BLOCKS FRESH_REVIEW_NON_RED_NOT_ROOT_OF_TRUST TRUSTED_PUBLISH_SELFTEST
          do
            grep -qx "$marker=PASS" /tmp/publish-selftest.log
          done
          echo "TRUSTED_PUBLISH_GATE_CANARIES=PASS"
          echo "DETERMINISTIC_PROOFS_AUTHORITATIVE=PASS"

      - name: Prove router full-duration lock
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          root="$tmp/.local/share/fluxion-draft-bus"; bin="$tmp/.local/bin"
          mkdir -p "$root/queue" "$bin"
          cp .github/bootstrap/fluxion-draft-bus-executor "$tmp/router.py"
          cat > "$bin/fluxion-generic-write-executor" <<'EOF'
          #!/bin/zsh
          print -r -- "$1" >> "$HOME/calls.txt"
          sleep 2
          EOF
          chmod 700 "$bin/fluxion-generic-write-executor"
          printf 'raise SystemExit(0)\n' > "$bin/fluxion-draft-bus-executor-ro-core"
          chmod 700 "$bin/fluxion-draft-bus-executor-ro-core"
          cat > "$root/queue/healthy.json" <<'EOF'
          {"schema_version":1,"created_at":"2026-08-11T18:00:00Z","action_profile":"FIX_SCOPED_BUG"}
          EOF
          HOME="$tmp" python3 "$tmp/router.py" & first=$!
          for _ in $(seq 1 40); do [ -s "$tmp/calls.txt" ] && break; sleep 0.05; done
          test -s "$tmp/calls.txt"
          HOME="$tmp" python3 "$tmp/router.py"
          wait "$first"
          test "$(wc -l < "$tmp/calls.txt" | tr -d ' ')" = 1
          echo "SINGLE_CONSUMER_FULL_DURATION=PASS"

      - name: Prove poison quarantine and UTC ordering
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          root="$tmp/.local/share/fluxion-draft-bus"; bin="$tmp/.local/bin"
          mkdir -p "$root/queue" "$bin"
          cp .github/bootstrap/fluxion-draft-bus-executor "$tmp/router.py"
          cat > "$bin/fluxion-generic-write-executor" <<'EOF'
          #!/bin/zsh
          print -r -- "$1" > "$HOME/generic-called.txt"
          EOF
          chmod 700 "$bin/fluxion-generic-write-executor"
          printf 'raise SystemExit(0)\n' > "$bin/fluxion-draft-bus-executor-ro-core"
          chmod 700 "$bin/fluxion-draft-bus-executor-ro-core"
          printf '{bad-json\n' > "$root/queue/000-bad.json"
          printf '{"schema_version":1,"action_profile":"FIX_SCOPED_BUG"}\n' > "$root/queue/001-missing-time.json"
          cat > "$root/queue/002-later.json" <<'EOF'
          {"schema_version":1,"created_at":"2026-08-11T20:00:00Z","action_profile":"FIX_SCOPED_BUG"}
          EOF
          cat > "$root/queue/003-earlier-offset.json" <<'EOF'
          {"schema_version":1,"created_at":"2026-08-11T21:00:00+02:00","action_profile":"FIX_SCOPED_BUG"}
          EOF
          HOME="$tmp" python3 "$tmp/router.py"
          grep -F "$root/queue/003-earlier-offset.json" "$tmp/generic-called.txt"
          test "$(find "$root/router-quarantine" -type f -name '*.bad' | wc -l | tr -d ' ')" = 2
          echo "POISON_QUARANTINE=PASS"
          echo "UTC_TIMESTAMP_ORDER=PASS"

      - name: Emit content-addressable static evidence
        run: |
          set -euo pipefail
          head="$(cat HEAD_SHA.txt)"
          python3 - "$head" > CONTROL_STATIC.json <<'PY'
          import json,sys
          markers=[
            'EXACT_CONTROL_FETCH=PASS','PR_WORKFLOW_CLAUDE_SECRET=ABSENT','PR_WORKFLOW_PRIVILEGED_SECRET=ABSENT','PR_EVENT_TO_PRIVILEGED_MAC=BLOCKED',
            'SYNTAX_COMPILE=PASS','EXECUTOR_INTEGRITY=PASS','WRITER_CAPABILITY_BOUNDARY=PASS','WRITER_CAN_LAUNCH_REVIEW=NO',
            'FRESH_REVIEW_ROOT_OF_TRUST=NO','NO_INSTALL_PATH_IN_CANARY=PASS','CLAUDE_RUNTIME_PIN=PASS',
            'BEHAVIORAL_CANARY_WIRED_TO_TRUSTED_MAC=PASS','ACTIVATION_AFTER_BEHAVIORAL_CANARY=PASS',
            'TRUSTED_PUBLISH_GATE_CANARIES=PASS','DETERMINISTIC_PROOFS_AUTHORITATIVE=PASS','SINGLE_CONSUMER_FULL_DURATION=PASS',
            'POISON_QUARANTINE=PASS','UTC_TIMESTAMP_ORDER=PASS','CONTROL_STATIC=PASS'
          ]
          print(json.dumps({'schema_version':1,'kind':'CONTROL_STATIC_EVIDENCE','head_sha':sys.argv[1],'status':'PASS','markers':markers},sort_keys=True,separators=(',',':')))
          PY
          sha256sum CONTROL_STATIC.json | awk '{print $1}' > CONTROL_STATIC.sha256
          echo "CONTROL_STATIC=PASS"

      - name: Upload static evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fluxion-control-static-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            CONTROL_STATIC.json
            CONTROL_STATIC.sha256
          if-no-files-found: error
          retention-days: 30
