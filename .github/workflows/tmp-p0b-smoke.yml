name: TEMP P0-B Patch v4
on:
  push:
    branches: [fix/p0b-stt-response-normalization-20260812]
    paths: [.github/workflows/tmp-p0b-smoke.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0b-stt-response-normalization-20260812
          fetch-depth: 1
          sparse-checkout: |
            .github/tmp-p0b-stt-patch.py
            .github/workflows/tmp-p0b-smoke.yml
            voice-agent/src/groq_client.py
            voice-agent/tests
          sparse-checkout-cone-mode: false
      - name: Apply patch
        run: python3 .github/tmp-p0b-stt-patch.py
      - name: Targeted tests
        run: |
          set -euo pipefail
          python3 -m py_compile voice-agent/src/groq_client.py voice-agent/tests/test_groq_stt_response_contract.py
          python3 voice-agent/tests/test_groq_stt_response_contract.py
          git diff --check
      - name: Commit product patch
        run: |
          set -euo pipefail
          rm .github/tmp-p0b-stt-patch.py .github/workflows/tmp-p0b-smoke.yml
          git add -A -- .github/tmp-p0b-stt-patch.py .github/workflows/tmp-p0b-smoke.yml voice-agent/src/groq_client.py voice-agent/tests/test_groq_stt_response_contract.py
          staged="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$staged"
          printf '%s\n' "$staged" | grep -qx 'voice-agent/src/groq_client.py'
          printf '%s\n' "$staged" | grep -qx 'voice-agent/tests/test_groq_stt_response_contract.py'
          bad="$(printf '%s\n' "$staged" | grep -Ev '^(\.github/tmp-p0b-stt-patch\.py|\.github/workflows/tmp-p0b-smoke\.yml|voice-agent/src/groq_client\.py|voice-agent/tests/test_groq_stt_response_contract\.py)$' || true)"
          test -z "$bad"
          test ! -e .github/tmp-p0b-stt-patch.py
          test ! -e .github/workflows/tmp-p0b-smoke.yml
          git -c core.hooksPath=/dev/null -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(stt): normalize Groq transcription responses'
          git push origin HEAD:fix/p0b-stt-response-normalization-20260812
