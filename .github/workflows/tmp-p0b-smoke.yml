name: TEMP P0-B Patch v2
on:
  push:
    branches: [fix/p0b-stt-response-normalization-20260812]
    paths: [.github/workflows/tmp-p0b-smoke.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0b-stt-response-normalization-20260812
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/tmp-p0b-stt-patch.py
      - name: Targeted tests
        run: |
          set -euo pipefail
          python3 -m py_compile voice-agent/src/groq_client.py voice-agent/tests/test_groq_stt_response_contract.py
          python3 voice-agent/tests/test_groq_stt_response_contract.py
          git diff --check
      - name: Commit product patch
        run: |
          set -euo pipefail
          rm .github/tmp-p0b-stt-patch.py .github/workflows/tmp-p0b-smoke.yml
          git add -A
          test "$(git diff --cached --name-only | sort)" = $'.github/tmp-p0b-stt-patch.py\n.github/workflows/tmp-p0b-smoke.yml\nvoice-agent/src/groq_client.py\nvoice-agent/tests/test_groq_stt_response_contract.py'
          git -c core.hooksPath=/dev/null -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(stt): normalize Groq transcription responses'
          git push origin HEAD:fix/p0b-stt-response-normalization-20260812
