name: VOS Fabric A2 Antigravity Runtime

on:
  push:
    branches:
      - "sol/vos-fabric-a2-antigravity-*"
    paths:
      - ".github/workflows/vos-fabric-a2-antigravity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vos-fabric-a2-antigravity
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 35
    env:
      FABRIC_A2_SHA: 9e7b2ecaea8541a10b1d1bd818aee262b17ba376
      AGY_VERSION: 1.2.3
      AGY_PACKAGE_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.2.3-5101874907578368/linux-x64/cli_linux_x64.tar.gz
    steps:
      - name: Download pinned official package on MacBook runner
        shell: bash
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/cli_linux_x64-${AGY_VERSION}.tar.gz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 "$AGY_PACKAGE_URL" -o "$PKG"
          tar -tzf "$PKG" >/dev/null
          echo "ANTIGRAVITY_PACKAGE_SHA256=$(shasum -a 256 "$PKG" | awk '{print $1}')"
          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$PKG" imac:/tmp/vos-a2-antigravity-package.tar.gz

      - name: Qualify direct official Antigravity worker in isolated vos-worker
        shell: bash
        run: |
          set -euo pipefail
          PROXY_PORT=$((24000 + GITHUB_RUN_ID % 12000))
          GATE="$RUNNER_TEMP/antigravity-worker-gate-${FABRIC_A2_SHA}.sh"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/lukeeterna/venture-os/${FABRIC_A2_SHA}/tools/fabric/antigravity_worker_gate.sh" -o "$GATE"
          bash -n "$GATE"
          GATE_SHA="$(shasum -a 256 "$GATE" | awk '{print $1}')"
          chmod 755 "$GATE"
          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$GATE" imac:/tmp/vos-a2-antigravity-gate.sh

          PROXY="$RUNNER_TEMP/vos-a2-proxy-${GITHUB_RUN_ID}.py"
          cat > "$PROXY" <<'PY'
          #!/usr/bin/env python3
          import os, select, socket, socketserver
          BIND=("192.168.64.1",int(os.environ["VOS_PROXY_PORT"])); ALLOWED="192.168.64.3"
          class H(socketserver.StreamRequestHandler):
              def handle(self):
                  if self.client_address[0] != ALLOWED: return
                  self.connection.settimeout(30)
                  p=self.rfile.readline(8192).decode("ascii","replace").strip().split()
                  if len(p)!=3 or p[0].upper()!="CONNECT": return
                  if ":" not in p[1]: return
                  host,ps=p[1].rsplit(":",1)
                  try: port=int(ps)
                  except ValueError: return
                  if port!=443: return
                  while True:
                      h=self.rfile.readline(8192)
                      if h in (b"\r\n",b"\n",b""): break
                  try: up=socket.create_connection((host,port),timeout=20)
                  except OSError: return
                  with up:
                      up.setblocking(False); self.connection.setblocking(False)
                      self.wfile.write(b"HTTP/1.1 200 Connection Established\r\n\r\n")
                      socks=[self.connection,up]
                      while True:
                          r,_,x=select.select(socks,[],socks,120)
                          if x or not r: return
                          for src in r:
                              dst=up if src is self.connection else self.connection
                              try: data=src.recv(65536)
                              except OSError: return
                              if not data: return
                              try: dst.sendall(data)
                              except OSError: return
          class S(socketserver.ThreadingTCPServer): allow_reuse_address=True; daemon_threads=True
          with S(BIND,H) as s:
              print(f"READY={BIND[0]}:{BIND[1]}",flush=True); s.serve_forever()
          PY
          chmod 700 "$PROXY"
          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$PROXY" imac:/tmp/vos-a2-proxy.py

          HOST="$RUNNER_TEMP/vos-a2-host-${GITHUB_RUN_ID}.sh"
          cat > "$HOST" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          export LC_ALL=C LANG=C
          : "${VOS_PROXY_PORT:?}" "${FABRIC_A2_SHA:?}" "${GATE_SHA:?}" "${AGY_VERSION:?}"
          fail(){ printf 'A2_RUNTIME_BLOCKED=%s\n' "$*"; exit 2; }
          pass(){ printf 'PASS %-30s %s\n' "$1" "${2:-}"; }
          MP=""
          for c in "$(command -v multipass 2>/dev/null||true)" /usr/local/bin/multipass /opt/homebrew/bin/multipass "/Library/Application Support/com.canonical.multipass/bin/multipass"; do
            [ -z "$c" ] || [ ! -x "$c" ] || { MP="$c"; break; }
          done
          [ -n "$MP" ] || fail MULTIPASS_MISSING
          "$MP" info vos-worker >/dev/null 2>&1 || fail VOS_WORKER_MISSING
          owner="$($MP exec vos-worker -- sh -c 'cat /var/lib/vos-fabric/worker-owner 2>/dev/null||true')"
          [ "$owner" = VOS_FABRIC_G2 ] || fail "OWNER=$owner"
          "$MP" info vos-worker|grep -q 'State:[[:space:]]*Running' || "$MP" start vos-worker
          [ "$($MP exec vos-worker -- uname -m)" = x86_64 ] || fail GUEST_ARCH
          ifconfig bridge100|grep -q 'inet 192\.168\.64\.1 ' || fail BRIDGE100

          prod(){
            uid="$(id -u)"; run(){ l="$1"; for d in "gui/$uid" "user/$uid" system; do launchctl print "$d/$l" 2>/dev/null|grep -Eq 'state = running|pid = [0-9]+' && return 0; done; launchctl list 2>/dev/null|awk -v l="$l" '$3==l&&$1~/^[0-9]+$/{ok=1}END{exit ok?0:1}'; }
            run com.zeroclaw.fall-detector && run com.go2rtc && run com.mosquitto.broker || return 1
            curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null || return 1
            lsof -nP -iTCP:3002 -sTCP:LISTEN 2>/dev/null|grep -q ':3002' || return 1
            { lsof -nP -iUDP:5080 2>/dev/null|grep -q ':5080' || lsof -nP -iTCP:5080 -sTCP:LISTEN 2>/dev/null|grep -q ':5080'; } || return 1
            mount|grep -q ' on /Volumes/NAS_LOCAL '
          }
          prod || fail PRE_PRODUCTION_REGRESSION; pass PRE_PRODUCTION 'Guardian/FLUXION/NAS green'
          [ -s /tmp/vos-a2-antigravity-package.tar.gz ] || fail PACKAGE_MISSING
          "$MP" transfer /tmp/vos-a2-antigravity-package.tar.gz vos-worker:/tmp/vos-a2-antigravity-package.tar.gz
          "$MP" transfer /tmp/vos-a2-antigravity-gate.sh vos-worker:/tmp/vos-a2-antigravity-gate.sh
          [ "$($MP exec vos-worker -- sha256sum /tmp/vos-a2-antigravity-gate.sh|awk '{print $1}')" = "$GATE_SHA" ] || fail GATE_SHA

          pid=''; cleanup(){ [ -z "$pid" ] || kill "$pid" >/dev/null 2>&1||true; rm -f /tmp/vos-a2-*; }; trap cleanup EXIT INT TERM
          VOS_PROXY_PORT="$VOS_PROXY_PORT" /usr/bin/python3 /tmp/vos-a2-proxy.py >/tmp/vos-a2-proxy.log 2>&1 & pid=$!
          for _ in 1 2 3 4 5; do grep -q "^READY=192.168.64.1:${VOS_PROXY_PORT}$" /tmp/vos-a2-proxy.log 2>/dev/null && break; sleep 1; done
          grep -q "^READY=192.168.64.1:${VOS_PROXY_PORT}$" /tmp/vos-a2-proxy.log || fail PROXY_NOT_READY
          pass EPHEMERAL_PROXY 'guest-only CONNECT:443'

          cat >/tmp/vos-a2-guest.sh <<'GUEST'
          #!/usr/bin/env bash
          set -euo pipefail
          export LC_ALL=C LANG=C
          : "${VOS_PROXY_PORT:?}" "${AGY_VERSION:?}"
          export HTTPS_PROXY="http://192.168.64.1:${VOS_PROXY_PORT}" HTTP_PROXY="http://192.168.64.1:${VOS_PROXY_PORT}" https_proxy="http://192.168.64.1:${VOS_PROXY_PORT}" http_proxy="http://192.168.64.1:${VOS_PROXY_PORT}"
          export PATH="$HOME/.local/bin:$PATH"
          pkg=/tmp/vos-a2-antigravity-package.tar.gz
          echo "ANTIGRAVITY_PACKAGE_SHA256=$(sha256sum "$pkg"|awk '{print $1}')"
          t="$(mktemp -d -t agy.XXXXXX)"; trap 'rm -rf "$t"' EXIT
          tar -xzf "$pkg" -C "$t"
          b="$(find "$t" -type f -name agy | head -1)"; [ -n "$b" ] || { echo A2_GUEST_BLOCKED=AGY_BINARY_NOT_FOUND; exit 2; }
          mkdir -p "$HOME/.local/bin"; install -m0755 "$b" "$HOME/.local/bin/agy"
          agy --version|grep -F "$AGY_VERSION" >/dev/null || { agy --version; echo A2_GUEST_BLOCKED=VERSION; exit 2; }
          echo "ANTIGRAVITY_VERSION=$(agy --version|head -1)"
          echo "ANTIGRAVITY_BINARY_SHA256=$(sha256sum "$HOME/.local/bin/agy"|awk '{print $1}')"
          settings="$HOME/.gemini/antigravity-cli/settings.json"; mkdir -p "$(dirname "$settings")"
          python3 - "$settings" <<'PY'
          import json,os,sys
          p=sys.argv[1]; d={}
          if os.path.exists(p):
              with open(p,encoding='utf-8') as f:d=json.load(f)
          d['useG1Credits']=False; q=p+'.tmp'
          with open(q,'w',encoding='utf-8') as f:json.dump(d,f,sort_keys=True,indent=2);f.write('\n')
          os.chmod(q,0o600);os.replace(q,p)
          PY
          echo "ANTIGRAVITY_SETTINGS_SHA256=$(sha256sum "$settings"|awk '{print $1}')"; echo ANTIGRAVITY_CREDIT_FALLBACK=0
          o="$(mktemp)"; e="$(mktemp)"; rc=0
          timeout 90s agy -p 'Reply exactly: VOS_A2_AUTH_PROBE=OK' --output-format json --sandbox --print-timeout 60s >"$o" 2>"$e" || rc=$?
          if [ "$rc" -ne 0 ]; then
            if cat "$o" "$e"|grep -Eqi 'authentication required|sign[ -]?in|required.*auth|unauthorized'; then echo A2=BLOCKED_AUTH; echo "A2_AUTH_STDOUT_SHA256=$(sha256sum "$o"|awk '{print $1}')"; echo "A2_AUTH_STDERR_SHA256=$(sha256sum "$e"|awk '{print $1}')"; exit 20; fi
            echo "A2_AUTH_PROBE_RC=$rc"; cat "$e" >&2; exit 2
          fi
          echo ANTIGRAVITY_DIRECT_AUTH=GREEN
          models="$(agy models 2>/dev/null)"; [ -n "$models" ] || { echo A2_GUEST_BLOCKED=MODEL_LIST; exit 2; }
          model="$(printf '%s\n' "$models"|awk 'NF&&$1!~/^MODEL|^NAME|^-+$/{print $1;exit}')"; [ -n "$model" ] || exit 2
          echo "ANTIGRAVITY_MODEL_SELECTED=$model"
          VOS_AGY_MODEL="$model" VOS_AGY_ZERO_COST_EVIDENCE_REF=firstparty:antigravity-individual-zero-dollar:2026-09-15 /tmp/vos-a2-antigravity-gate.sh qualify
          echo A2_LOCAL_QUALIFICATION=GREEN
          GUEST
          chmod 700 /tmp/vos-a2-guest.sh; "$MP" transfer /tmp/vos-a2-guest.sh vos-worker:/tmp/vos-a2-guest.sh; "$MP" exec vos-worker -- chmod 700 /tmp/vos-a2-guest.sh
          grc=0; "$MP" exec vos-worker -- env VOS_PROXY_PORT="$VOS_PROXY_PORT" AGY_VERSION="$AGY_VERSION" /tmp/vos-a2-guest.sh || grc=$?
          prod || fail POST_GUEST_PRODUCTION_REGRESSION; pass POST_GUEST_PRODUCTION green
          if [ "$grc" -eq 20 ]; then echo A2=BLOCKED_AUTH; echo A2_NEXT_ACTION=ONE_TIME_DIRECT_GOOGLE_AUTH_INSIDE_VOS_WORKER; exit 20; fi
          [ "$grc" -eq 0 ] || fail "GUEST_RC_$grc"
          "$MP" stop vos-worker; prod || fail PRODUCTION_AFTER_STOP; "$MP" start vos-worker
          for _ in $(seq 1 30); do "$MP" info vos-worker 2>/dev/null|grep -q 'State:[[:space:]]*Running' && break; sleep 2; done
          "$MP" exec vos-worker -- env HTTPS_PROXY="http://192.168.64.1:${VOS_PROXY_PORT}" HTTP_PROXY="http://192.168.64.1:${VOS_PROXY_PORT}" PATH="/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin" timeout 60s agy models >/dev/null 2>&1 || fail AUTH_AFTER_RESTART
          prod || fail POST_RESTART_PRODUCTION_REGRESSION
          echo A2=GREEN; echo PRODUCTION_MUTATIONS=0; echo PAID_API_FALLBACK=0; echo ANTIGRAVITY_CREDIT_FALLBACK=0
          REMOTE
          chmod 700 "$HOST"; scp -q -o BatchMode=yes -o ConnectTimeout=8 "$HOST" imac:/tmp/vos-a2-host.sh
          rc=0; ssh -o BatchMode=yes -o ConnectTimeout=8 imac "env VOS_PROXY_PORT='$PROXY_PORT' FABRIC_A2_SHA='$FABRIC_A2_SHA' GATE_SHA='$GATE_SHA' AGY_VERSION='$AGY_VERSION' bash /tmp/vos-a2-host.sh" || rc=$?
          ssh -o BatchMode=yes -o ConnectTimeout=8 imac 'rm -f /tmp/vos-a2-host.sh' || true
          exit "$rc"
