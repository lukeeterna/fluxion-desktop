name: VOS Fabric A2 Antigravity Runtime

on:
  push:
    branches:
      - "sol/vos-fabric-a2-antigravity-runtime-*"
    paths:
      - ".github/workflows/vos-fabric-a2-antigravity.yml"
      - "tools/vos_fabric_a2_antigravity_auth_once.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vos-fabric-a2-antigravity-runtime
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: [self-hosted, fluxion-imac-physical]
    timeout-minutes: 30
    env:
      FABRIC_A2_SHA: 3cc65cc2b56a22035a45c62be44558b48c669b12
      AGY_VERSION: 1.2.3
      AGY_PACKAGE_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.2.3-5101874907578368/linux-x64/cli_linux_x64.tar.gz
    steps:
      - name: Fetch pinned A2 gate and exact official package
        shell: bash
        run: |
          set -euo pipefail
          GATE="$RUNNER_TEMP/antigravity-worker-gate-${FABRIC_A2_SHA}.sh"
          PKG="$RUNNER_TEMP/cli_linux_x64-${AGY_VERSION}.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/lukeeterna/venture-os/${FABRIC_A2_SHA}/tools/fabric/antigravity_worker_gate.sh" -o "$GATE"
          bash -n "$GATE"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 "$AGY_PACKAGE_URL" -o "$PKG"
          [ "$(tar -tzf "$PKG")" = "antigravity" ]
          echo "FABRIC_A2_GATE_SHA256=$(shasum -a 256 "$GATE"|awk '{print $1}')"
          echo "ANTIGRAVITY_PACKAGE_SHA256=$(shasum -a 256 "$PKG"|awk '{print $1}')"
          chmod 755 "$GATE"

      - name: Real A2 qualification on iMac isolated vos-worker
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C LANG=C
          PROXY_PORT=$((25000 + GITHUB_RUN_ID % 10000))
          GATE="$RUNNER_TEMP/antigravity-worker-gate-${FABRIC_A2_SHA}.sh"
          PKG="$RUNNER_TEMP/cli_linux_x64-${AGY_VERSION}.tar.gz"
          fail(){ printf 'A2_RUNTIME_BLOCKED=%s\n' "$*"; exit 2; }

          MP=""
          for c in "$(command -v multipass 2>/dev/null||true)" /usr/local/bin/multipass /opt/homebrew/bin/multipass "/Library/Application Support/com.canonical.multipass/bin/multipass"; do
            [ -z "$c" ] || [ ! -x "$c" ] || { MP="$c"; break; }
          done
          [ -n "$MP" ] || fail MULTIPASS_MISSING

          mpb(){
            local secs="$1"; shift
            /usr/bin/python3 - "$secs" "$MP" "$@" <<'PY'
          import subprocess,sys
          secs=float(sys.argv[1]); cmd=[sys.argv[2],*sys.argv[3:]]
          try:
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=secs)
          except subprocess.TimeoutExpired as exc:
              if exc.stdout:
                  sys.stdout.write(exc.stdout if isinstance(exc.stdout,str) else exc.stdout.decode('utf-8','replace'))
              if exc.stderr:
                  sys.stderr.write(exc.stderr if isinstance(exc.stderr,str) else exc.stderr.decode('utf-8','replace'))
              sys.exit(124)
          sys.stdout.write(p.stdout); sys.stderr.write(p.stderr); sys.exit(p.returncode)
          PY
          }

          mpb 15 info vos-worker >/dev/null 2>&1 || fail VOS_WORKER_MISSING
          owner="$(mpb 15 exec vos-worker -- sh -c 'cat /var/lib/vos-fabric/worker-owner 2>/dev/null||true')" || fail OWNER_READ
          [ "$owner" = VOS_FABRIC_G2 ] || fail OWNER
          if ! mpb 15 info vos-worker | grep -q 'State:[[:space:]]*Running'; then mpb 30 start vos-worker >/dev/null 2>&1 || true; fi
          for _ in $(seq 1 30); do mpb 10 info vos-worker 2>/dev/null | grep -q 'State:[[:space:]]*Running' && break; sleep 2; done
          mpb 10 info vos-worker | grep -q 'State:[[:space:]]*Running' || fail VM_NOT_RUNNING
          [ "$(mpb 15 exec vos-worker -- uname -m)" = x86_64 ] || fail GUEST_ARCH
          guest_ip="$(mpb 15 exec vos-worker -- hostname -I | awk '{print $1}')" || fail GUEST_IP_READ
          [ "$guest_ip" = 192.168.64.3 ] || fail "UNEXPECTED_GUEST_IP_$guest_ip"
          ifconfig bridge100 | grep -q 'inet 192\.168\.64\.1 ' || fail BRIDGE
          mpb 15 exec vos-worker -- sh -lc "mount | grep -Eq 'type 9p|fuse\.sshfs|/Users/|/Volumes/' && exit 1 || exit 0" || fail HOST_MOUNT_PRESENT

          prod(){
            uid="$(id -u)"
            run(){ l="$1"; for d in "gui/$uid" "user/$uid" system; do launchctl print "$d/$l" 2>/dev/null | grep -Eq 'state = running|pid = [0-9]+' && return 0; done; launchctl list 2>/dev/null | awk -v l="$l" '$3==l&&$1~/^[0-9]+$/{ok=1}END{exit ok?0:1}'; }
            run com.zeroclaw.fall-detector && run com.go2rtc && run com.mosquitto.broker || return 1
            curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null || return 1
            lsof -nP -iTCP:3002 -sTCP:LISTEN 2>/dev/null | grep -q ':3002' || return 1
            { lsof -nP -iUDP:5080 2>/dev/null | grep -q ':5080' || lsof -nP -iTCP:5080 -sTCP:LISTEN 2>/dev/null | grep -q ':5080'; } || return 1
            mount | grep -q ' on /Volumes/NAS_LOCAL '
          }

          prod || fail PRE_PRODUCTION_REGRESSION
          echo A2_PRE_PRODUCTION=GREEN
          mpb 30 transfer "$GATE" vos-worker:/tmp/vos-a2-gate.sh >/dev/null || fail GATE_TRANSFER
          mpb 30 transfer "$PKG" vos-worker:/tmp/vos-a2-package.tar.gz >/dev/null || fail PACKAGE_TRANSFER

          PROXY="$RUNNER_TEMP/vos-a2-runtime-proxy-${GITHUB_RUN_ID}.py"
          PROXY_LOG="$RUNNER_TEMP/vos-a2-runtime-proxy-${GITHUB_RUN_ID}.log"
          cat > "$PROXY" <<PY
          #!/usr/bin/env python3
          import select,socket,socketserver
          BIND=("192.168.64.1",$PROXY_PORT); ALLOWED="192.168.64.3"
          class H(socketserver.StreamRequestHandler):
              def handle(self):
                  if self.client_address[0]!=ALLOWED:return
                  self.connection.settimeout(30)
                  p=self.rfile.readline(8192).decode("ascii","replace").strip().split()
                  if len(p)!=3 or p[0].upper()!="CONNECT" or ":" not in p[1]:return
                  host,ps=p[1].rsplit(":",1)
                  try:port=int(ps)
                  except ValueError:return
                  if port!=443:return
                  while True:
                      h=self.rfile.readline(8192)
                      if h in (b"\r\n",b"\n",b""):break
                  try:up=socket.create_connection((host,port),timeout=20)
                  except OSError:return
                  with up:
                      up.setblocking(False);self.connection.setblocking(False)
                      self.wfile.write(b"HTTP/1.1 200 Connection Established\r\n\r\n")
                      socks=[self.connection,up]
                      while True:
                          r,_,x=select.select(socks,[],socks,120)
                          if x or not r:return
                          for src in r:
                              dst=up if src is self.connection else self.connection
                              try:data=src.recv(65536)
                              except OSError:return
                              if not data:return
                              try:dst.sendall(data)
                              except OSError:return
          class S(socketserver.ThreadingTCPServer):allow_reuse_address=True;daemon_threads=True
          with S(BIND,H) as s:
              print("READY",flush=True);s.serve_forever()
          PY
          chmod 700 "$PROXY"
          /usr/bin/python3 "$PROXY" >"$PROXY_LOG" 2>&1 & PROXY_PID=$!
          cleanup(){ kill "$PROXY_PID" >/dev/null 2>&1 || true; rm -f "$PROXY" "$PROXY_LOG" "$RUNNER_TEMP/vos-a2-systemd-smoke.sh" "$RUNNER_TEMP/vos-a2-runtime-guest.sh" "$RUNNER_TEMP/vos-a2-runtime-unit.sh" "$RUNNER_TEMP/vos-a2-persist-unit.sh"; }
          trap cleanup EXIT INT TERM
          for _ in 1 2 3 4 5; do grep -q '^READY$' "$PROXY_LOG" 2>/dev/null && break; sleep 1; done
          grep -q '^READY$' "$PROXY_LOG" || fail PROXY_NOT_READY

          SMOKE="$RUNNER_TEMP/vos-a2-systemd-smoke.sh"
          cat >"$SMOKE" <<'SMOKE'
          #!/usr/bin/env bash
          printf '0\n' >/tmp/vos-a2-systemd-smoke.rc.tmp
          mv /tmp/vos-a2-systemd-smoke.rc.tmp /tmp/vos-a2-systemd-smoke.rc
          SMOKE
          chmod 700 "$SMOKE"

          GUEST="$RUNNER_TEMP/vos-a2-runtime-guest.sh"
          cat >"$GUEST" <<'GUEST'
          #!/usr/bin/env bash
          set -euo pipefail
          export LC_ALL=C LANG=C
          : "${VOS_PROXY_PORT:?}" "${AGY_VERSION:?}"
          export HTTPS_PROXY="http://192.168.64.1:${VOS_PROXY_PORT}" HTTP_PROXY="http://192.168.64.1:${VOS_PROXY_PORT}"
          export https_proxy="$HTTPS_PROXY" http_proxy="$HTTP_PROXY"
          export PATH="$HOME/.local/bin:$PATH"
          if ! test -x "$HOME/.local/bin/agy"; then
            t="$(mktemp -d -t agy.XXXXXX)"; tar -xzf /tmp/vos-a2-package.tar.gz -C "$t"; install -m0755 "$t/antigravity" "$HOME/.local/bin/agy"; rm -rf "$t"
          fi
          agy --version | grep -F "$AGY_VERSION" >/dev/null || { echo A2=VERSION_MISMATCH; exit 2; }
          settings="$HOME/.gemini/antigravity-cli/settings.json"
          [ -f "$settings" ] || { echo A2=BLOCKED_AUTH; exit 20; }
          python3 - "$settings" <<'PY'
          import json,os,sys
          p=sys.argv[1]
          with open(p,encoding='utf-8') as f:d=json.load(f)
          d.pop('modelProvider',None)
          d['useG1Credits']=False
          q=p+'.vos-zero-cost.tmp'
          with open(q,'w',encoding='utf-8') as f: json.dump(d,f,sort_keys=True,indent=2); f.write('\n')
          os.chmod(q,0o600); os.replace(q,p)
          PY
          python3 - "$settings" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f:d=json.load(f)
          if d.get('useG1Credits') is not False: raise SystemExit('credit fallback not disabled')
          if d.get('modelProvider')=='gemini': raise SystemExit('Gemini API provider forbidden')
          PY
          echo A2_ZERO_COST_SETTINGS=GREEN
          models="$(timeout -k 10s 60s agy models 2>/dev/null)" || { echo A2=BLOCKED_AUTH_OR_MODELS_TIMEOUT; exit 20; }
          model="$(printf '%s\n' "$models" | awk 'NF&&$1!~/^MODEL|^NAME|^-+$/{print $1;exit}')"
          [ -n "$model" ] || { echo A2=MODEL_LIST_EMPTY; exit 2; }
          chmod 755 /tmp/vos-a2-gate.sh
          timeout -k 15s 480s env VOS_AGY_MODEL="$model" VOS_AGY_ZERO_COST_EVIDENCE_REF=firstparty:antigravity-individual-zero-dollar:2026-09-15 VOS_AGY_TURN_TIMEOUT_SECONDS=180 /tmp/vos-a2-gate.sh qualify
          GUEST
          chmod 700 "$GUEST"

          UNIT="$RUNNER_TEMP/vos-a2-runtime-unit.sh"
          cat >"$UNIT" <<UNIT
          #!/usr/bin/env bash
          set +e
          export HOME=/home/ubuntu
          export PATH=/home/ubuntu/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export VOS_PROXY_PORT="$PROXY_PORT" AGY_VERSION="$AGY_VERSION"
          /tmp/vos-a2-runtime-guest.sh >/tmp/vos-a2-runtime.result 2>&1
          rc=\$?
          printf '%s\n' "\$rc" >/tmp/vos-a2-runtime.rc.tmp
          mv /tmp/vos-a2-runtime.rc.tmp /tmp/vos-a2-runtime.rc
          exit "\$rc"
          UNIT
          chmod 700 "$UNIT"

          PERSIST="$RUNNER_TEMP/vos-a2-persist-unit.sh"
          cat >"$PERSIST" <<UNIT
          #!/usr/bin/env bash
          set +e
          export HOME=/home/ubuntu
          export PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin
          export HTTPS_PROXY="http://192.168.64.1:$PROXY_PORT" HTTP_PROXY="http://192.168.64.1:$PROXY_PORT"
          export https_proxy="\$HTTPS_PROXY" http_proxy="\$HTTP_PROXY" SSH_CONNECTION='127.0.0.1 22000 127.0.0.1 22'
          timeout -k 10s 60s /home/ubuntu/.local/bin/agy models >/tmp/vos-a2-persist.result 2>&1
          rc=\$?
          printf '%s\n' "\$rc" >/tmp/vos-a2-persist.rc.tmp
          mv /tmp/vos-a2-persist.rc.tmp /tmp/vos-a2-persist.rc
          exit "\$rc"
          UNIT
          chmod 700 "$PERSIST"

          mpb 30 transfer "$SMOKE" vos-worker:/tmp/vos-a2-systemd-smoke.sh >/dev/null || fail SMOKE_TRANSFER
          mpb 30 transfer "$GUEST" vos-worker:/tmp/vos-a2-runtime-guest.sh >/dev/null || fail GUEST_TRANSFER
          mpb 30 transfer "$UNIT" vos-worker:/tmp/vos-a2-runtime-unit.sh >/dev/null || fail UNIT_TRANSFER
          mpb 30 transfer "$PERSIST" vos-worker:/tmp/vos-a2-persist-unit.sh >/dev/null || fail PERSIST_TRANSFER
          mpb 15 exec vos-worker -- chmod 700 /tmp/vos-a2-systemd-smoke.sh /tmp/vos-a2-runtime-guest.sh /tmp/vos-a2-runtime-unit.sh /tmp/vos-a2-persist-unit.sh || fail GUEST_CHMOD

          mpb 15 exec vos-worker -- sh -lc 'rm -f /tmp/vos-a2-systemd-smoke.rc*; sudo systemctl stop vos-a2-systemd-smoke.service >/dev/null 2>&1 || true; sudo systemctl reset-failed vos-a2-systemd-smoke.service >/dev/null 2>&1 || true' || fail SMOKE_RESET
          mpb 20 exec vos-worker -- sudo systemd-run --unit=vos-a2-systemd-smoke --property=Type=exec --property=User=ubuntu -- /tmp/vos-a2-systemd-smoke.sh >/dev/null || fail SMOKE_LAUNCH
          smoke=''
          for _ in $(seq 1 10); do smoke="$(mpb 10 exec vos-worker -- sh -lc 'cat /tmp/vos-a2-systemd-smoke.rc 2>/dev/null || true' || true)"; [ -n "$smoke" ] && break; sleep 1; done
          if [ "$smoke" != 0 ]; then mpb 10 exec vos-worker -- sudo systemctl --no-pager --full status vos-a2-systemd-smoke.service 2>/dev/null || true; fail SYSTEMD_DETACH_SMOKE_FAILED; fi
          echo A2_SYSTEMD_DETACH_SMOKE=GREEN

          mpb 15 exec vos-worker -- sh -lc 'rm -f /tmp/vos-a2-runtime.rc /tmp/vos-a2-runtime.rc.tmp /tmp/vos-a2-runtime.result; sudo systemctl stop vos-a2-runtime.service >/dev/null 2>&1 || true; sudo systemctl reset-failed vos-a2-runtime.service >/dev/null 2>&1 || true' || fail QUALIFIER_RESET
          mpb 20 exec vos-worker -- sudo systemd-run --unit=vos-a2-runtime --property=Type=exec --property=User=ubuntu -- /tmp/vos-a2-runtime-unit.sh >/dev/null || fail QUALIFIER_LAUNCH
          sleep 2
          unit_state="$(mpb 10 exec vos-worker -- sudo systemctl show vos-a2-runtime.service -p ActiveState -p SubState -p Result -p ExecMainStatus 2>/dev/null || true)"
          printf '%s\n' "$unit_state" | sed 's/^/A2_QUALIFIER_UNIT_/'
          if printf '%s\n' "$unit_state" | grep -q '^ActiveState=failed$'; then mpb 10 exec vos-worker -- sudo systemctl --no-pager --full status vos-a2-runtime.service 2>/dev/null || true; fail QUALIFIER_UNIT_FAILED_EARLY; fi

          grc=''
          for _ in $(seq 1 180); do
            poll_rc=0; candidate="$(mpb 10 exec vos-worker -- sh -lc 'cat /tmp/vos-a2-runtime.rc 2>/dev/null || true')" || poll_rc=$?
            if [ "$poll_rc" -eq 124 ]; then sleep 3; continue; fi
            [ "$poll_rc" -eq 0 ] || fail "QUALIFIER_POLL_RC_$poll_rc"
            if [ -n "$candidate" ]; then grc="$candidate"; break; fi
            sleep 3
          done
          [ -n "$grc" ] || { mpb 10 exec vos-worker -- sudo systemctl show vos-a2-runtime.service -p ActiveState -p SubState -p Result -p ExecMainCode -p ExecMainStatus 2>/dev/null || true; fail QUALIFIER_NO_RESULT_AFTER_540S; }
          case "$grc" in ''|*[!0-9]*) fail "QUALIFIER_BAD_RC_$grc";; esac
          qout="$(mpb 15 exec vos-worker -- sh -lc 'cat /tmp/vos-a2-runtime.result 2>/dev/null || true')" || fail QUALIFIER_RESULT_READ
          printf '%s\n' "$qout"
          prod || fail POST_QUALIFICATION_REGRESSION
          echo A2_POST_QUALIFICATION_PRODUCTION=GREEN
          if [ "$grc" -eq 20 ]; then echo A2=BLOCKED_AUTH; exit 20; fi
          [ "$grc" -eq 0 ] || fail "GUEST_RC_$grc"
          printf '%s\n' "$qout" | grep -q '^ANTIGRAVITY_DIRECT_OFFICIAL_WORKER_LOCAL_QUALIFICATION=GREEN$' || fail QUALIFIER_GREEN_MARKER_MISSING
          printf '%s\n' "$qout" | grep -q '^ANTIGRAVITY_EXACT_RESUME=GREEN$' || fail RESUME_GREEN_MARKER_MISSING
          printf '%s\n' "$qout" | grep -q '^ANTIGRAVITY_WORKSPACE_TOOL_EXECUTION=GREEN$' || fail TOOL_GREEN_MARKER_MISSING

          stop_cli_rc=0; mpb 25 stop vos-worker >/dev/null 2>&1 || stop_cli_rc=$?; echo "A2_STOP_CLI_RC=$stop_cli_rc"
          stopped=0
          for _ in $(seq 1 30); do state="$(mpb 10 info vos-worker 2>/dev/null || true)"; if printf '%s\n' "$state" | grep -q 'State:[[:space:]]*Stopped'; then stopped=1; break; fi; sleep 2; done
          [ "$stopped" -eq 1 ] || fail VM_STOP_STATE_NOT_REACHED
          prod || fail AFTER_STOP_REGRESSION
          echo A2_STOP_STATE=GREEN

          start_cli_rc=0; mpb 30 start vos-worker >/dev/null 2>&1 || start_cli_rc=$?; echo "A2_START_CLI_RC=$start_cli_rc"
          running=0
          for _ in $(seq 1 45); do state="$(mpb 10 info vos-worker 2>/dev/null || true)"; if printf '%s\n' "$state" | grep -q 'State:[[:space:]]*Running'; then running=1; break; fi; sleep 2; done
          [ "$running" -eq 1 ] || fail VM_START_STATE_NOT_REACHED
          owner_after="$(mpb 15 exec vos-worker -- sh -c 'cat /var/lib/vos-fabric/worker-owner 2>/dev/null||true')" || fail OWNER_AFTER_READ
          [ "$owner_after" = VOS_FABRIC_G2 ] || fail OWNER_AFTER
          mpb 15 exec vos-worker -- sh -lc "mount | grep -Eq 'type 9p|fuse\.sshfs|/Users/|/Volumes/' && exit 1 || exit 0" || fail HOST_MOUNT_AFTER_RESTART

          mpb 15 exec vos-worker -- sh -lc 'rm -f /tmp/vos-a2-persist.rc /tmp/vos-a2-persist.rc.tmp /tmp/vos-a2-persist.result; sudo systemctl stop vos-a2-persist.service >/dev/null 2>&1 || true; sudo systemctl reset-failed vos-a2-persist.service >/dev/null 2>&1 || true' || fail PERSIST_RESET
          mpb 20 exec vos-worker -- sudo systemd-run --unit=vos-a2-persist --property=Type=exec --property=User=ubuntu -- /tmp/vos-a2-persist-unit.sh >/dev/null || fail PERSIST_LAUNCH
          prc=''
          for _ in $(seq 1 40); do
            poll_rc=0; candidate="$(mpb 10 exec vos-worker -- sh -lc 'cat /tmp/vos-a2-persist.rc 2>/dev/null || true')" || poll_rc=$?
            if [ "$poll_rc" -eq 124 ]; then sleep 3; continue; fi
            [ "$poll_rc" -eq 0 ] || fail "PERSIST_POLL_RC_$poll_rc"
            if [ -n "$candidate" ]; then prc="$candidate"; break; fi
            sleep 3
          done
          [ -n "$prc" ] || fail AUTH_PERSISTENCE_NO_RESULT
          [ "$prc" -eq 0 ] || fail "AUTH_PERSISTENCE_RC_$prc"
          echo A2_AUTH_PERSISTENCE_AFTER_RESTART=GREEN

          prod || fail POST_RESTART_REGRESSION
          echo A2_POST_RESTART_PRODUCTION=GREEN
          echo A2=GREEN
          echo PAID_API_FALLBACK=0
          echo ANTIGRAVITY_CREDIT_FALLBACK=0
          echo PRODUCTION_MUTATIONS=0

      - name: Collect sanitized A2 terminal evidence
        if: always()
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/a2-terminal-evidence.txt"
          MP=""
          for c in "$(command -v multipass 2>/dev/null||true)" /usr/local/bin/multipass /opt/homebrew/bin/multipass "/Library/Application Support/com.canonical.multipass/bin/multipass"; do [ -z "$c" ] || [ ! -x "$c" ] || { MP="$c"; break; }; done
          {
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "HEAD_SHA=$GITHUB_SHA"
            echo "FABRIC_A2_SHA=$FABRIC_A2_SHA"
            if [ -z "$MP" ]; then
              echo DIAG_MULTIPASS_MISSING
            else
              /usr/bin/python3 - "$MP" <<'PY'
          import subprocess,sys
          mp=sys.argv[1]
          script=r'''
          for f in /tmp/vos-a2-systemd-smoke.rc /tmp/vos-a2-runtime.rc /tmp/vos-a2-runtime.result /tmp/vos-a2-persist.rc; do
            if [ -f "$f" ]; then echo "=== $f ==="; cat "$f"; else echo "=== $f MISSING ==="; fi
          done
          echo '=== runtime unit ==='
          sudo systemctl show vos-a2-runtime.service -p ActiveState -p SubState -p Result -p ExecMainCode -p ExecMainStatus 2>/dev/null || true
          echo '=== smoke unit ==='
          sudo systemctl show vos-a2-systemd-smoke.service -p ActiveState -p SubState -p Result -p ExecMainStatus 2>/dev/null || true
          '''
          try:
              p=subprocess.run([mp,'exec','vos-worker','--','sh','-lc',script],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=15)
              sys.stdout.write(p.stdout)
              if p.stderr: sys.stderr.write(p.stderr)
              print('DIAG_MP_RC='+str(p.returncode))
          except subprocess.TimeoutExpired:
              print('DIAG_MP_RC=124')
          PY
            fi
          } >"$OUT" 2>&1 || true
          cat "$OUT"

      - name: Upload sanitized A2 terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-terminal-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/a2-terminal-evidence.txt
          if-no-files-found: warn
          retention-days: 7
