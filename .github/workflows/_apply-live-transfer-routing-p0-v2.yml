name: Apply P0 live-transfer routing refinement v2

on:
  push:
    branches: [agent/sara-live-transfer-p0-v2]
    paths: [.github/workflows/_apply-live-transfer-routing-p0-v2.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sara-live-transfer-p0-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract and apply canonical routing patch
        id: apply_patch
        shell: bash
        run: |
          set -uo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/_apply-live-transfer-routing-p0.yml').read_text()
          marker = "python3 - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          body = src[start:end]
          lines = body.splitlines()
          # The original YAML run block indents the Python body by ten spaces.
          cleaned = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply-routing.py').write_text(cleaned)
          PY
          set +e
          python3 /tmp/apply-routing.py > >(tee /tmp/apply-routing.log) 2>&1
          rc=$?
          set -e
          echo "apply_rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Fast source gates
        id: fast_gates
        shell: bash
        run: |
          set -uo pipefail
          {
            cargo fmt --manifest-path src-tauri/Cargo.toml
            python3 -m py_compile \
              voice-agent/src/orchestrator.py \
              voice-agent/src/voip_goengine.py \
              voice-agent/src/voip_pjsua2.py
            git diff --check
          } > >(tee /tmp/fast-gates.log) 2>&1

      - name: Commit product routing slice
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/_apply-live-transfer-routing-p0.yml \
            .github/workflows/_apply-live-transfer-routing-p0-v2.yml
          git add \
            src-tauri/migrations/043_voice_transfer_routing.sql \
            src-tauri/src/lib.rs \
            src-tauri/src/commands/operatori.rs \
            src-tauri/src/http_bridge.rs \
            src/types/operatore.ts \
            src/components/operatori/OperatoreDialog.tsx \
            voice-agent/src/orchestrator.py \
            voice-agent/src/voip_goengine.py \
            voice-agent/src/voip_pjsua2.py \
            voice-agent/tests/test_live_transfer_goengine.py \
            voice-agent/tests/test_live_transfer_pjsua2.py \
            voice-agent/tests/test_live_transfer_orchestrator.py
          git diff --cached --check
          git commit -m "feat(voice): add production live-transfer routing chain"
          git push origin HEAD:agent/sara-live-transfer-p0-v2

      - name: Publish deterministic failure diagnostic
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard "$GITHUB_SHA"
          mkdir -p vos-out
          {
            echo "LIVE_TRANSFER_ROUTING_APPLY=FAILED"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo
            echo "=== APPLY LOG ==="
            cat /tmp/apply-routing.log 2>/dev/null || true
            echo
            echo "=== FAST GATES LOG ==="
            cat /tmp/fast-gates.log 2>/dev/null || true
          } > vos-out/live-transfer-routing-apply-failure.txt
          git rm \
            .github/workflows/_apply-live-transfer-routing-p0.yml \
            .github/workflows/_apply-live-transfer-routing-p0-v2.yml
          git add vos-out/live-transfer-routing-apply-failure.txt
          git commit -m "chore: record live-transfer routing apply failure"
          git push origin HEAD:agent/sara-live-transfer-p0-v2
