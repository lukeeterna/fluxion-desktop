name: FLUXION Runner Probe

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/fluxion-runner-probe.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Observe executor run and runner state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'fluxion-runner-probe',
          }

          def get(path):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  return exc.code, None

          status, data = get('/actions/workflows/fluxion-headless-executor.yml/runs?event=push&per_page=5')
          print(f'EXECUTOR_RUNS_API={status}')
          if status == 200 and data is not None:
              runs = data.get('workflow_runs', [])
              print(f'EXECUTOR_RUN_COUNT={len(runs)}')
              for run in runs:
                  print(
                      'EXECUTOR_RUN '
                      f"id={run.get('id')} "
                      f"status={run.get('status')} "
                      f"conclusion={run.get('conclusion')} "
                      f"head_sha={run.get('head_sha')} "
                      f"event={run.get('event')} "
                      f"created_at={run.get('created_at')}"
                  )

          status, data = get('/actions/runners?per_page=100')
          print(f'RUNNERS_API={status}')
          if status == 200 and data is not None:
              runners = data.get('runners', [])
              print(f'RUNNER_COUNT={len(runners)}')
              for runner in runners:
                  labels = sorted(
                      label.get('name', '')
                      for label in runner.get('labels', [])
                      if label.get('name')
                  )
                  print(
                      'RUNNER '
                      f"status={runner.get('status')} "
                      f"busy={str(runner.get('busy')).lower()} "
                      f"labels={','.join(labels)}"
                  )
          PY
