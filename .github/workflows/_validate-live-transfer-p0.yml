name: Finalize live-transfer P0 cleanly

on:
  push:
    branches: [agent/sara-live-transfer-p0-v2]
    paths: [.github/workflows/_validate-live-transfer-p0.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sara-live-transfer-p0-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-go@v5
        with:
          go-version-file: voice-agent/engine/go.mod

      - name: Apply production fixes and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          BASE = "9177ab1048ef1dd2f8ab69b12b7465d8e1519be3"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, got {count}")
              return text.replace(old, new, 1)

          def add_dependency(path: str, anchor: str, dep: str) -> None:
              p = Path(path)
              s = p.read_text()
              if dep in s:
                  return
              if s.count(anchor) != 1:
                  raise SystemExit(f"{path}: dependency anchor mismatch")
              p.write_text(s.replace(anchor, anchor + dep + "\n", 1))

          # Python 3.13+: audioop left the stdlib. Keep older interpreters untouched.
          dep = 'audioop-lts>=0.2.2; python_version >= "3.13"'
          add_dependency(
              "voice-agent/requirements.txt",
              "# ── Audio ────────────────────────────────────────────────────────────\n",
              dep,
          )
          add_dependency(
              "voice-agent/requirements-ci.txt",
              "# Core\n",
              dep,
          )
          add_dependency(
              "voice-agent/requirements-windows.txt",
              "# Audio processing\n",
              dep,
          )

          # Rust operator integration fixtures: include the dedicated transfer policy
          # fields and verify CRUD round-trip without weakening PII encryption.
          p = Path("src-tauri/tests/integration_operatori.rs")
          s = p.read_text()
          needle = "        genere: None,\n    };"
          count = s.count(needle)
          if count != 3:
              raise SystemExit(f"integration_operatori fixtures: expected 3 literals, got {count}")
          s = s.replace(
              needle,
              "        genere: None,\n"
              "        voice_transfer_enabled: None,\n"
              "        voice_transfer_reachable: None,\n"
              "        voice_transfer_priority: None,\n"
              "    };",
          )
          marker = (
              "// ═══════════════════════════════════════════════════════════════════\n"
              "// PII encryption at-rest — verify ciphertext per i 4 campi PII"
          )
          test = r'''// ═══════════════════════════════════════════════════════════════════
// P0 Sara live-transfer policy — dedicated fields roundtrip through encrypted
// operator CRUD without changing encrypted personal-phone semantics.
// ═══════════════════════════════════════════════════════════════════

#[tokio::test]
