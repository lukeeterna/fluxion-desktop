name: TEMP Export Voice Agent YAML Repair
on:
  push:
    branches: [fix/voice-agent-yaml-block-indentation-20260812]
    paths: [.github/workflows/tmp-fix-voice-agent-yaml.yml]
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voice-agent-yaml-block-indentation-20260812
          fetch-depth: 1
          sparse-checkout: |
            .github/tmp-fix-voice-agent-yaml.py
            .github/workflows/voice-agent.yml
          sparse-checkout-cone-mode: false
      - name: Repair and validate exact YAML bytes
        run: |
          set -euo pipefail
          python3 .github/tmp-fix-voice-agent-yaml.py
          ruby -r psych -e 'Psych.parse_file(ARGV[0]); puts "YAML_PARSE=PASS"' .github/workflows/voice-agent.yml
          git diff --check
          test "$(git diff --name-only)" = '.github/workflows/voice-agent.yml'
      - name: Upload repaired workflow
        uses: actions/upload-artifact@v4
        with:
          name: voice-agent-yaml-repaired-${{ github.sha }}
          path: .github/workflows/voice-agent.yml
          if-no-files-found: error
          retention-days: 1
