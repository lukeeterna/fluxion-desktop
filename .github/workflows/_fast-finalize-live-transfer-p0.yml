name: Fast finalize live-transfer P0

on:
  push:
    branches: [agent/sara-live-transfer-p0-v2]
    paths: [.github/workflows/_fast-finalize-live-transfer-p0.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sara-live-transfer-p0-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reuse canonical patch embedded in validation workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          src = Path('.github/workflows/_validate-live-transfer-p0.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          body = textwrap.dedent(src[start:end]) + "\n"
          Path('/tmp/apply-live-transfer-final.py').write_text(body)
          PY
          python3 /tmp/apply-live-transfer-final.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
          python3 -m py_compile \
            voice-agent/src/orchestrator.py \
            voice-agent/src/voip_goengine.py \
            voice-agent/src/voip_pjsua2.py
          git diff --check

      - name: Python 3.13 targeted gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r voice-agent/requirements-ci.txt
          PYTHONPATH=voice-agent python -m pytest \
            voice-agent/tests/test_live_transfer_goengine.py \
            voice-agent/tests/test_live_transfer_pjsua2.py \
            voice-agent/tests/test_live_transfer_orchestrator.py \
            voice-agent/tests/test_nlu_fsm_bypass.py -q

      - name: Go targeted gate
        working-directory: voice-agent/engine
        shell: bash
        run: go test ./...

      - name: Publish clean product commit
        shell: bash
        env:
          BASE_SHA: 9177ab1048ef1dd2f8ab69b12b7465d8e1519be3
          BRANCH: agent/sara-live-transfer-p0-v2
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git reset --mixed "$BASE_SHA"
          rm -f \
            .github/workflows/_validate-live-transfer-p0.yml \
            .github/workflows/_fast-finalize-live-transfer-p0.yml

          git add \
            voice-agent/requirements.txt \
            voice-agent/requirements-ci.txt \
            voice-agent/requirements-windows.txt \
            voice-agent/src/orchestrator.py \
            voice-agent/tests/test_live_transfer_orchestrator.py \
            src-tauri/tests/integration_operatori.rs

          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(voice): close live-transfer P0 validation gaps"
          git push \
            --force-with-lease="refs/heads/$BRANCH:$GITHUB_SHA" \
            origin "HEAD:refs/heads/$BRANCH"
