name: VOS Fabric G2 Qualify Codex Worker V2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vos-fabric-g2-qualify-v2
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 15
    env:
      VOS_CODEX_MODEL: gpt-5.6-terra
      CODEX_VERSION: 0.154.0
      FABRIC_SHA: 18752fb147f6700d4dc0633a55b9367d00ef0d91
    steps:
      - name: Phase 1 preflight exact worker and production
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$RUNNER_TEMP/g2-v2-preflight-${GITHUB_RUN_ID}.sh"
          cat > "$REMOTE" <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C LANG=C
          fail(){ echo "G2_V2_BLOCKED=$*"; exit 2; }
          bounded(){
            /usr/bin/python3 - "$@" <<'PY'
          import subprocess, sys
          try:
              p=subprocess.run(sys.argv[1:],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=12)
              if p.stdout: print(p.stdout,end='')
              raise SystemExit(p.returncode)
          except subprocess.TimeoutExpired as e:
              out=e.stdout or ''
              if isinstance(out,bytes): out=out.decode('utf-8','replace')
              if out: print(out,end='')
              print('BOUNDED_COMMAND_TIMEOUT=1')
              raise SystemExit(124)
          PY
          }
          production_green(){
            uid="$(id -u)"
            launch_running(){
              label="$1"
              for domain in "gui/$uid" "user/$uid" system; do
                if launchctl print "$domain/$label" 2>/dev/null | grep -Eq 'state = running|pid = [0-9]+'; then return 0; fi
              done
              launchctl list 2>/dev/null | awk -v label="$label" '$3==label && $1 ~ /^[0-9]+$/ {ok=1} END{exit ok?0:1}'
            }
            launch_running com.zeroclaw.fall-detector && launch_running com.go2rtc && launch_running com.mosquitto.broker && \
            curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null && \
            lsof -nP -iTCP:3002 -sTCP:LISTEN 2>/dev/null | grep -q ':3002' && \
            { lsof -nP -iUDP:5080 2>/dev/null | grep -q ':5080' || lsof -nP -iTCP:5080 -sTCP:LISTEN 2>/dev/null | grep -q ':5080'; } && \
            mount | grep -q ' on /Volumes/NAS_LOCAL '
          }
          production_green || fail PRE_PRODUCTION_REGRESSION
          MP=""
          for c in "$(command -v multipass 2>/dev/null || true)" /usr/local/bin/multipass /opt/homebrew/bin/multipass "/Library/Application Support/com.canonical.multipass/bin/multipass"; do
            if [ -n "$c" ] && [ -x "$c" ]; then MP="$c"; break; fi
          done
          [ -n "$MP" ] || fail MULTIPASS_MISSING
          bounded "$MP" info vos-worker >/dev/null || fail VOS_WORKER_INFO
          owner="$(bounded "$MP" exec vos-worker -- sh -c 'cat /var/lib/vos-fabric/worker-owner 2>/dev/null || true')"
          [ "$owner" = VOS_FABRIC_G2 ] || fail OWNER
          mounts="$(bounded "$MP" info vos-worker | awk '/Mounts:/ {print $2}')"
          [ -z "$mounts" ] || [ "$mounts" = -- ] || fail MOUNTS
          version="$(bounded "$MP" exec vos-worker -- /usr/local/bin/codex --version | head -1)"
          [ "$version" = "codex-cli ${CODEX_VERSION}" ] || fail CODEX_VERSION
          bounded "$MP" exec vos-worker -- timeout 15s env CODEX_HOME=/home/ubuntu/.codex-vos-fabric /usr/local/bin/codex login status >/dev/null || fail AUTH
          echo 'G2_V2_PHASE1=GREEN'
          REMOTE
          python3 - "$REMOTE" <<'PY'
          import subprocess,sys
          script=open(sys.argv[1],encoding='utf-8').read()
          p=subprocess.run(['ssh','-o','BatchMode=yes','-o','ConnectTimeout=8','imac','bash -s'],input=script,text=True,timeout=90)
          raise SystemExit(p.returncode)
          PY

      - name: Phase 2 exact Codex tool resume fork
        shell: bash
        run: |
          set -euo pipefail
          PROXY_PORT=$((21000 + GITHUB_RUN_ID % 15000))
          ROOT="$RUNNER_TEMP/g2-v2-${GITHUB_RUN_ID}"
          mkdir -p "$ROOT"
          GATE="$ROOT/codex_worker_gate.sh"
          curl -4 -fsSL --connect-timeout 8 --max-time 30 --retry 4 --retry-delay 2 --retry-all-errors \
            "https://raw.githubusercontent.com/lukeeterna/venture-os/${FABRIC_SHA}/tools/fabric/codex_worker_gate.sh" -o "$GATE"
          bash -n "$GATE"
          GATE_SHA="$(shasum -a 256 "$GATE" | awk '{print $1}')"

          PROXY="$ROOT/proxy.py"
          cat > "$PROXY" <<'PY'
          #!/usr/bin/env python3
          import os,select,socket,socketserver
          BIND=('192.168.64.1',int(os.environ['VOS_PROXY_PORT'])); ALLOWED='192.168.64.3'
          class H(socketserver.StreamRequestHandler):
              def handle(self):
                  if self.client_address[0]!=ALLOWED:return
                  line=self.rfile.readline(8192).decode('ascii','replace').strip(); p=line.split()
                  if len(p)!=3 or p[0].upper()!='CONNECT' or ':' not in p[1]: self.wfile.write(b'HTTP/1.1 405 Method Not Allowed\r\n\r\n'); return
                  host,ps=p[1].rsplit(':',1)
                  try: port=int(ps)
                  except ValueError:return
                  if port!=443:self.wfile.write(b'HTTP/1.1 403 Forbidden\r\n\r\n');return
                  print('CONNECT_HOST=%s:443'%host,flush=True)
                  while True:
                      h=self.rfile.readline(8192)
                      if h in (b'\r\n',b'\n',b''):break
                  try:u=socket.create_connection((host,443),timeout=20)
                  except OSError:self.wfile.write(b'HTTP/1.1 502 Bad Gateway\r\n\r\n');return
                  with u:
                      u.setblocking(False);self.connection.setblocking(False);self.wfile.write(b'HTTP/1.1 200 Connection Established\r\n\r\n')
                      ss=[self.connection,u]
                      while True:
                          r,_,x=select.select(ss,[],ss,120)
                          if x or not r:return
                          for s in r:
                              d=u if s is self.connection else self.connection
                              try:b=s.recv(65536)
                              except OSError:return
                              if not b:return
                              try:d.sendall(b)
                              except OSError:return
          class S(socketserver.ThreadingTCPServer):allow_reuse_address=True;daemon_threads=True
          with S(BIND,H) as s:print('READY=%s:%d'%BIND,flush=True);s.serve_forever()
          PY
          HOST="$ROOT/host.sh"
          cat > "$HOST" <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C LANG=C
          MP=""
          for c in "$(command -v multipass 2>/dev/null || true)" /usr/local/bin/multipass /opt/homebrew/bin/multipass "/Library/Application Support/com.canonical.multipass/bin/multipass"; do
            if [ -n "$c" ] && [ -x "$c" ]; then MP="$c"; break; fi
          done
          [ -n "$MP" ]
          "$MP" transfer /tmp/g2-v2-gate.sh vos-worker:/tmp/g2-v2-gate.sh
          "$MP" exec vos-worker -- sudo install -m 0755 /tmp/g2-v2-gate.sh /usr/local/lib/vos-fabric/codex_worker_gate.sh
          "$MP" exec vos-worker -- rm -f /tmp/g2-v2-gate.sh
          installed="$($MP exec vos-worker -- sha256sum /usr/local/lib/vos-fabric/codex_worker_gate.sh | awk '{print $1}')"
          [ "$installed" = "$GATE_SHA" ]
          proxy_pid=''
          cleanup(){ [ -z "$proxy_pid" ] || kill "$proxy_pid" >/dev/null 2>&1 || true; rm -f /tmp/g2-v2-proxy.py /tmp/g2-v2-proxy.log; }
          trap cleanup EXIT INT TERM
          VOS_PROXY_PORT="$VOS_PROXY_PORT" /usr/bin/python3 /tmp/g2-v2-proxy.py >/tmp/g2-v2-proxy.log 2>&1 & proxy_pid=$!
          for _ in 1 2 3 4 5; do grep -q "^READY=192.168.64.1:${VOS_PROXY_PORT}$" /tmp/g2-v2-proxy.log 2>/dev/null && break; sleep 1; done
          grep -q "^READY=192.168.64.1:${VOS_PROXY_PORT}$" /tmp/g2-v2-proxy.log
          set +e
          out="$($MP exec vos-worker -- env CODEX_HOME=/home/ubuntu/.codex-vos-fabric HTTPS_PROXY="http://192.168.64.1:${VOS_PROXY_PORT}" HTTP_PROXY="http://192.168.64.1:${VOS_PROXY_PORT}" https_proxy="http://192.168.64.1:${VOS_PROXY_PORT}" http_proxy="http://192.168.64.1:${VOS_PROXY_PORT}" VOS_CODEX_MODEL="$VOS_CODEX_MODEL" VOS_CODEX_TURN_TIMEOUT_SECONDS=120 /usr/local/lib/vos-fabric/codex_worker_gate.sh qualify 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          echo "G2_V2_GATE_RC=$rc"
          echo '--- PROXY TRACE ---'; grep -E '^(READY|CONNECT_HOST|UPSTREAM_ERROR)=' /tmp/g2-v2-proxy.log || true; echo '--- END PROXY TRACE ---'
          [ "$rc" -eq 0 ] || exit "$rc"
          echo 'G2_V2_PHASE2=GREEN'
          REMOTE
          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$GATE" imac:/tmp/g2-v2-gate.sh
          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$PROXY" imac:/tmp/g2-v2-proxy.py
          scp -q -o BatchMode=yes -o ConnectTimeout=8 "$HOST" imac:/tmp/g2-v2-host.sh
          python3 - "$PROXY_PORT" "$GATE_SHA" <<'PY'
          import os,subprocess,sys
          port,gate_sha=sys.argv[1:]
          env=os.environ.copy();env['VOS_PROXY_PORT']=port;env['GATE_SHA']=gate_sha
          cmd=['ssh','-o','BatchMode=yes','-o','ConnectTimeout=8','imac',
               "VOS_PROXY_PORT='%s' GATE_SHA='%s' FABRIC_SHA='%s' VOS_CODEX_MODEL='%s' bash /tmp/g2-v2-host.sh; rc=$?; rm -f /tmp/g2-v2-host.sh; exit $rc" % (port,gate_sha,env['FABRIC_SHA'],env['VOS_CODEX_MODEL'])]
          p=subprocess.run(cmd,env=env,timeout=420)
          raise SystemExit(p.returncode)
          PY

      - name: Phase 3 bounded clean stop restart and persistence
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$RUNNER_TEMP/g2-v2-lifecycle-${GITHUB_RUN_ID}.sh"
          cat > "$REMOTE" <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C LANG=C
          fail(){ echo "G2_V2_BLOCKED=$*"; exit 2; }
          bounded(){
            /usr/bin/python3 - "$@" <<'PY'
          import subprocess,sys
          try:
              p=subprocess.run(sys.argv[1:],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=30)
              if p.stdout: print(p.stdout,end='')
              raise SystemExit(p.returncode)
          except subprocess.TimeoutExpired as e:
              out=e.stdout or ''
              if isinstance(out,bytes):out=out.decode('utf-8','replace')
              if out:print(out,end='')
              print('BOUNDED_COMMAND_TIMEOUT=1')
              raise SystemExit(124)
          PY
          }
          production_green(){
            uid="$(id -u)"
            launch_running(){ label="$1"; for d in "gui/$uid" "user/$uid" system; do launchctl print "$d/$label" 2>/dev/null | grep -Eq 'state = running|pid = [0-9]+' && return 0; done; launchctl list 2>/dev/null | awk -v label="$label" '$3==label && $1 ~ /^[0-9]+$/ {ok=1} END{exit ok?0:1}'; }
            launch_running com.zeroclaw.fall-detector && launch_running com.go2rtc && launch_running com.mosquitto.broker && curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null && lsof -nP -iTCP:3002 -sTCP:LISTEN 2>/dev/null | grep -q ':3002' && { lsof -nP -iUDP:5080 2>/dev/null | grep -q ':5080' || lsof -nP -iTCP:5080 -sTCP:LISTEN 2>/dev/null | grep -q ':5080'; } && mount | grep -q ' on /Volumes/NAS_LOCAL '
          }
          MP=""
          for c in "$(command -v multipass 2>/dev/null || true)" /usr/local/bin/multipass /opt/homebrew/bin/multipass "/Library/Application Support/com.canonical.multipass/bin/multipass"; do [ -n "$c" ] && [ -x "$c" ] && { MP="$c"; break; }; done
          [ -n "$MP" ] || fail MULTIPASS_MISSING
          production_green || fail PRE_LIFECYCLE_PRODUCTION
          bounded "$MP" stop vos-worker || fail VM_STOP
          bounded "$MP" info vos-worker | grep -q 'State:[[:space:]]*Stopped' || fail VM_NOT_STOPPED
          production_green || fail PRODUCTION_AFTER_STOP
          echo 'G2_V2_CLEAN_STOP=GREEN'
          bounded "$MP" start vos-worker || fail VM_START
          started=0
          for _ in $(seq 1 30); do
            if bounded "$MP" info vos-worker 2>/dev/null | grep -q 'State:[[:space:]]*Running'; then started=1; break; fi
            sleep 2
          done
          [ "$started" -eq 1 ] || fail VM_NOT_RUNNING
          bounded "$MP" exec vos-worker -- timeout 15s env CODEX_HOME=/home/ubuntu/.codex-vos-fabric /usr/local/bin/codex login status >/dev/null || fail AUTH_AFTER_RESTART
          [ "$(bounded "$MP" exec vos-worker -- sh -c 'cat /var/lib/vos-fabric/worker-owner')" = VOS_FABRIC_G2 ] || fail OWNER_AFTER_RESTART
          mounts="$(bounded "$MP" info vos-worker | awk '/Mounts:/ {print $2}')"
          [ -z "$mounts" ] || [ "$mounts" = -- ] || fail MOUNTS_AFTER_RESTART
          production_green || fail POST_LIFECYCLE_PRODUCTION
          echo 'G2_V2_PHASE3=GREEN'
          echo 'PRODUCTION_REGRESSION=0'
          echo 'G2_PAID_API_FALLBACK=0'
          echo 'G2=GREEN'
          REMOTE
          python3 - "$REMOTE" <<'PY'
          import subprocess,sys
          script=open(sys.argv[1],encoding='utf-8').read()
          p=subprocess.run(['ssh','-o','BatchMode=yes','-o','ConnectTimeout=8','imac','bash -s'],input=script,text=True,timeout=180)
          raise SystemExit(p.returncode)
          PY
