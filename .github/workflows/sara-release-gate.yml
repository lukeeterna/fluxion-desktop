name: Sara Release Gate (Full)

# Exact-SHA behavioral/latency certification on the legacy shell-only MacBook
# runner and the iMac runtime host. No JavaScript Actions are used on this job.
# The canonical MacBook and iMac worktrees are never checked out/reset/cleaned.
# Each run gets detached temporary worktrees and the iMac candidate runs on a
# separate localhost port with SIP/WhatsApp side effects disabled. Live EHIWEB
# SIP certification remains a separate production gate.

on:
  pull_request:
    paths:
      - 'voice-agent/src/**'
      - 'voice-agent/tests/**'
      - 'voice-agent/requirements*.txt'
      - 'voice-agent/main.py'
      - 'scripts/sara-release-gate.sh'
      - '.github/workflows/sara-release-gate.yml'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Gate tier (1=core, 2=extended, 3=full)'
        required: false
        default: '3'
        type: choice
        options: ['1', '2', '3']
      skip_extended:
        description: 'Skip tier 2 extended smoke (faster)'
        required: false
        default: false
        type: boolean

# The iMac is a shared physical certification resource. Serialize globally so
# two PRs can never race on the candidate port or shared DB.
concurrency:
  group: sara-release-gate-imac
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sara-gate:
    name: Sara exact-SHA HTTP gate (MacBook → iMac)
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 30

    env:
      FLUXION_CANONICAL_ROOT: /Volumes/MontereyT7/FLUXION
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      P95_SLO_MS: '2000'

    steps:
      - name: Pre-flight immutable local candidate worktree
        run: |
          set -euo pipefail
          ROOT="$FLUXION_CANONICAL_ROOT"
          [ -d "$ROOT/.git" ] || { echo "::error::Repo canonico mancante: $ROOT"; exit 2; }

          # Fetch refs only; never mutate the canonical worktree, even if it is dirty.
          git -C "$ROOT" fetch origin --quiet "$TARGET_REF" || git -C "$ROOT" fetch origin --quiet
          git -C "$ROOT" cat-file -e "$TARGET_SHA^{commit}" 2>/dev/null || {
            echo "::error::TARGET_SHA non disponibile: $TARGET_SHA"
            exit 2
          }

          BASE_TMP="${RUNNER_TEMP:-/tmp}"
          CANDIDATE_ROOT="$BASE_TMP/fluxion-sara-gate-${GITHUB_RUN_ID}"
          REPORT_DIR="$BASE_TMP/fluxion-sara-gate-reports-${GITHUB_RUN_ID}"
          [ ! -e "$CANDIDATE_ROOT" ] || { echo "::error::candidate path già esistente"; exit 2; }
          mkdir -p "$REPORT_DIR"

          git -C "$ROOT" worktree add --detach --quiet "$CANDIDATE_ROOT" "$TARGET_SHA"
          ACTUAL_SHA="$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)"
          [ "$ACTUAL_SHA" = "$TARGET_SHA" ] || {
            echo "::error::Exact-SHA mismatch expected=$TARGET_SHA actual=$ACTUAL_SHA"
            exit 2
          }
          [ -z "$(git -C "$CANDIDATE_ROOT" status --porcelain)" ] || {
            echo "::error::Temporary candidate worktree dirty before execution"
            git -C "$CANDIDATE_ROOT" status --short
            exit 2
          }
          [ -x "$CANDIDATE_ROOT/scripts/sara-release-gate.sh" ] || {
            echo "::error::candidate scripts/sara-release-gate.sh non eseguibile"
            exit 2
          }
          python3 -m py_compile "$CANDIDATE_ROOT/voice-agent/tests/e2e/cert_server.py"

          echo "CANDIDATE_ROOT=$CANDIDATE_ROOT" >> "$GITHUB_ENV"
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
          echo "SARA_GATE_EXACT_SHA=$ACTUAL_SHA"
          echo "CANONICAL_HEAD=$(git -C "$ROOT" rev-parse HEAD)"
          echo "CANONICAL_DIRTY_COUNT=$(git -C "$ROOT" status --porcelain | wc -l | tr -d ' ')"
          echo "SARA_GATE_PREFLIGHT=PASS"

      - name: Run exact-SHA iMac certification
        env:
          TIER: ${{ inputs.tier || '3' }}
          SKIP_EXTENDED: ${{ inputs.skip_extended || 'false' }}
        run: |
          set -euo pipefail
          [ "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" = "$TARGET_SHA" ]
          [ -z "$(git -C "$CANDIDATE_ROOT" status --porcelain)" ]

          ARGS=()
          if [ "$TIER" = "1" ]; then
            ARGS+=("--tier=1")
          elif [ "$TIER" = "2" ]; then
            ARGS+=("--tier=2")
          fi
          if [ "$SKIP_EXTENDED" = "true" ]; then
            ARGS+=("--skip-extended")
          fi

          FLUXION_TARGET_SHA="$TARGET_SHA" \
          FLUXION_CERT_RUN_ID="$GITHUB_RUN_ID" \
          FLUXION_REPORT_DIR="$REPORT_DIR" \
          FLUXION_P95_SLO_MS="$P95_SLO_MS" \
            "$CANDIDATE_ROOT/scripts/sara-release-gate.sh" "${ARGS[@]}"

      - name: Emit immutable release-gate evidence
        if: always()
        run: |
          set +e
          echo "=== SARA EXACT-SHA GATE EVIDENCE ==="
          echo "expected_sha=$TARGET_SHA"
          if [ -n "${CANDIDATE_ROOT:-}" ] && [ -d "$CANDIDATE_ROOT" ]; then
            echo "candidate_sha=$(git -C "$CANDIDATE_ROOT" rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "candidate_dirty_count=$(git -C "$CANDIDATE_ROOT" status --porcelain 2>/dev/null | wc -l | tr -d ' ')"
          fi
          echo "canonical_sha=$(git -C "$FLUXION_CANONICAL_ROOT" rev-parse HEAD 2>/dev/null || echo unavailable)"
          echo "canonical_dirty_count=$(git -C "$FLUXION_CANONICAL_ROOT" status --porcelain 2>/dev/null | wc -l | tr -d ' ')"

          REPORT="$(ls -1t "${REPORT_DIR:-/nonexistent}"/release-gate-*.json 2>/dev/null | head -1)"
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            echo "report=$REPORT"
            shasum -a 256 "$REPORT" || true
            cat "$REPORT"
          else
            echo "report=NONE"
          fi
          echo "=== END EVIDENCE ==="

      - name: Cleanup temporary MacBook worktree
        if: always()
        run: |
          set +e
          if [ -n "${CANDIDATE_ROOT:-}" ] && [ -d "$CANDIDATE_ROOT" ]; then
            git -C "$FLUXION_CANONICAL_ROOT" worktree remove --force "$CANDIDATE_ROOT"
          fi
          git -C "$FLUXION_CANONICAL_ROOT" worktree prune
          if [ -n "${REPORT_DIR:-}" ] && [ -d "$REPORT_DIR" ]; then
            rm -rf "$REPORT_DIR"
          fi
          echo "SARA_GATE_CLEANUP=DONE"
