name: Sara Release Gate (Full)

# S207 — Release gate REALE completo (Opzione B).
# Esegue test_sara_stress_per_verticale.py su tutti i verticali + DB integrity
# usando self-hosted GitHub Actions runner su MacBook (zero-cost, outbound only).
# Il runner chiama orchestrator VOS che a sua volta SSH-a iMac e gira la pipeline live 3002.
#
# IMPORTANT: this runner is intentionally shell-only. Its legacy macOS/libc++ cannot
# execute the Node 24 runtime now used by JavaScript-based GitHub Actions such as
# actions/checkout and actions/upload-artifact. The canonical T7 checkout already
# exists locally, so the gate fetches and checks out the exact candidate SHA with
# system git and emits evidence directly into the immutable Actions job log.
#
# Setup runner una tantum (founder): vedi venture-os/docs/SETUP-SELFHOSTED-RUNNER.md

on:
  pull_request:
    paths:
      - 'voice-agent/src/**'
      - 'voice-agent/tests/**'
      - 'voice-agent/requirements*.txt'
      - 'voice-agent/main.py'
      - 'scripts/sara-release-gate.sh'
      - '.github/workflows/sara-release-gate.yml'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Gate tier (1=core, 2=extended, 3=full)'
        required: false
        default: '3'
        type: choice
        options: ['1', '2', '3']
      skip_extended:
        description: 'Skip tier 2 extended smoke (faster)'
        required: false
        default: false
        type: boolean

concurrency:
  group: sara-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sara-gate:
    name: Sara Gate (self-hosted MacBook → iMac pipeline)
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 20

    env:
      FLUXION_CANONICAL_ROOT: /Volumes/MontereyT7/FLUXION
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Pre-flight — canonical repo + exact clean candidate
        run: |
          set -euo pipefail

          ROOT="$FLUXION_CANONICAL_ROOT"
          if [ ! -d "$ROOT/.git" ]; then
            echo "::error::Repo canonico mancante — $ROOT"
            exit 2
          fi
          if [ ! -x "$ROOT/scripts/sara-release-gate.sh" ]; then
            echo "::error::scripts/sara-release-gate.sh non eseguibile"
            exit 2
          fi
          if [ ! -f "$HOME/venture-os/components/sara-gate-orchestrator/orchestrator.py" ]; then
            echo "::error::VOS orchestrator mancante — installa venture-os/components/sara-gate-orchestrator/"
            exit 2
          fi

          cd "$ROOT"
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Repo canonico dirty: il gate rifiuta checkout distruttivi"
            git status --short
            exit 2
          fi

          # Pull-request github.sha is a synthetic merge commit. The release gate
          # must certify the immutable PR HEAD itself, so TARGET_SHA is explicitly
          # github.event.pull_request.head.sha on PR events.
          git fetch origin --quiet "$TARGET_REF" || git fetch origin --quiet
          if ! git cat-file -e "$TARGET_SHA^{commit}" 2>/dev/null; then
            echo "::error::TARGET_SHA non disponibile dopo fetch: $TARGET_SHA"
            exit 2
          fi
          git checkout --detach --quiet "$TARGET_SHA"

          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$TARGET_SHA" ]; then
            echo "::error::Exact-SHA mismatch expected=$TARGET_SHA actual=$ACTUAL_SHA"
            exit 2
          fi

          echo "SARA_GATE_EXACT_SHA=$ACTUAL_SHA"
          echo "SARA_GATE_TARGET_REF=$TARGET_REF"
          echo "SARA_GATE_PREFLIGHT=PASS"

      - name: Build orchestrator args
        id: args
        env:
          TIER: ${{ inputs.tier || '3' }}
          SKIP_EXTENDED: ${{ inputs.skip_extended || 'false' }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "$TIER" = "1" ]; then
            ARGS="$ARGS --tier=1"
          elif [ "$TIER" = "2" ]; then
            ARGS="$ARGS --tier=2"
          fi
          if [ "$SKIP_EXTENDED" = "true" ]; then
            ARGS="$ARGS --skip-extended"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Args calcolati: '$ARGS'"

      - name: Run Sara Gate via VOS orchestrator
        env:
          SARA_GATE_ARGS: ${{ steps.args.outputs.args }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ env.TARGET_SHA }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$FLUXION_CANONICAL_ROOT"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 "$HOME/venture-os/components/sara-gate-orchestrator/orchestrator.py"

      - name: Emit release-gate evidence to Actions log
        if: always()
        run: |
          set +e
          ROOT="$FLUXION_CANONICAL_ROOT"
          echo "=== SARA GATE EVIDENCE ==="
          echo "expected_sha=$TARGET_SHA"
          if [ -d "$ROOT/.git" ]; then
            echo "actual_sha=$(git -C "$ROOT" rev-parse HEAD 2>/dev/null || echo unavailable)"
          fi

          REPORT="$(ls -1t "$ROOT"/docs/launch/sara-release-gate-reports/release-gate-*.json 2>/dev/null | head -1)"
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            echo "report=$REPORT"
            shasum -a 256 "$REPORT" || true
            cat "$REPORT"
          else
            echo "report=NONE"
          fi

          echo "=== VOS LAST RUN ==="
          tail -1 "$HOME/venture-os/state/sara-gate-runs.jsonl" 2>/dev/null || echo '{}'
          echo "=== END EVIDENCE ==="
