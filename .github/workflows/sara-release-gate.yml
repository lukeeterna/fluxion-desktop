name: Sara Release Gate (Full)

# Certification-only U1 runner for the current production candidate.
# No product/Sara code is changed. The T7 repo is used only to launch the
# existing gate script; the gate itself syncs the iMac to origin/master.

on:
  pull_request:
    paths:
      - '.github/workflows/sara-release-gate.yml'
  workflow_dispatch:

jobs:
  sara-gate:
    name: Sara Gate (self-hosted MacBook → iMac pipeline)
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 20

    steps:
      - name: Pre-flight — canonical master + gate script
        env:
          TARGET_SHA: 4aadf5590f030e6dd01b540063d13548be4234a8
        run: |
          set -e
          ROOT="/Volumes/MontereyT7/FLUXION"
          test -d "$ROOT" || { echo "::error::T7 non montato"; exit 2; }
          test -x "$ROOT/scripts/sara-release-gate.sh" || { echo "::error::sara-release-gate.sh mancante/non eseguibile"; exit 2; }
          test -f "$HOME/venture-os/components/sara-gate-orchestrator/orchestrator.py" || { echo "::error::VOS orchestrator mancante"; exit 2; }
          cd "$ROOT"
          git fetch origin master --quiet
          REMOTE_SHA="$(git rev-parse origin/master)"
          test "$REMOTE_SHA" = "$TARGET_SHA" || { echo "::error::origin/master moved: $REMOTE_SHA"; exit 2; }
          git diff --quiet "$TARGET_SHA" -- scripts/sara-release-gate.sh || { echo "::error::local gate script differs from production candidate"; exit 2; }
          echo "Canonical production candidate: $REMOTE_SHA"
          echo "T7 non-product dirty state (informational only):"
          git status --short -- tools/VectCutAPI vos-out/decisions.jsonl || true

      - name: Run U1 Sara stress gate — tier 3
        env:
          SARA_GATE_ARGS: ''
          GITHUB_EVENT_NAME: pull_request
          GITHUB_REF: refs/heads/master
          GITHUB_SHA: 4aadf5590f030e6dd01b540063d13548be4234a8
          GITHUB_PR_NUMBER: '39'
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          python3 "$HOME/venture-os/components/sara-gate-orchestrator/orchestrator.py"

      - name: Print U1 evidence
        if: always()
        run: |
          echo "===== VOS gate entry ====="
          tail -1 "$HOME/venture-os/state/sara-gate-runs.jsonl" 2>/dev/null || true
          echo "===== Latest release-gate report ====="
          LATEST="$(ls -t /Volumes/MontereyT7/FLUXION/docs/launch/sara-release-gate-reports/release-gate-*.json 2>/dev/null | head -1 || true)"
          if [ -n "$LATEST" ]; then
            echo "$LATEST"
            cat "$LATEST"
          else
            echo "No release-gate report found"
          fi
