name: Sara Release Gate (Full)

# Certification-only U1 runner for the current production candidate.
# No product/Sara code is changed. The canonical repository already exists on T7,
# so this avoids cloning the ~1.2 GB repository into the Actions workspace.

on:
  pull_request:
    paths:
      - '.github/workflows/sara-release-gate.yml'
  workflow_dispatch:

jobs:
  sara-gate:
    name: Sara Gate (self-hosted MacBook → iMac pipeline)
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 20

    steps:
      - name: Pre-flight — canonical T7 + orchestrator
        run: |
          set -e
          test -d "/Volumes/MontereyT7/FLUXION" || { echo "::error::T7 non montato"; exit 2; }
          test -x "/Volumes/MontereyT7/FLUXION/scripts/sara-release-gate.sh" || { echo "::error::sara-release-gate.sh mancante/non eseguibile"; exit 2; }
          test -f "$HOME/venture-os/components/sara-gate-orchestrator/orchestrator.py" || { echo "::error::VOS orchestrator mancante"; exit 2; }
          cd /Volumes/MontereyT7/FLUXION
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::repo canonico dirty; U1 fail-closed"
            git status --short
            exit 2
          fi
          echo "OK pre-flight"

      - name: Pin canonical repository to production candidate
        env:
          TARGET_SHA: 4aadf5590f030e6dd01b540063d13548be4234a8
        run: |
          set -e
          cd /Volumes/MontereyT7/FLUXION
          git fetch origin master --quiet
          git checkout --quiet "$TARGET_SHA"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$TARGET_SHA" || { echo "::error::SHA mismatch: $ACTUAL_SHA"; exit 2; }
          echo "Canonical HEAD: $ACTUAL_SHA"

      - name: Run U1 Sara stress gate — tier 3
        env:
          SARA_GATE_ARGS: ''
          GITHUB_EVENT_NAME: pull_request
          GITHUB_REF: refs/heads/master
          GITHUB_SHA: 4aadf5590f030e6dd01b540063d13548be4234a8
          GITHUB_PR_NUMBER: '39'
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          python3 "$HOME/venture-os/components/sara-gate-orchestrator/orchestrator.py"

      - name: Print U1 evidence
        if: always()
        run: |
          echo "===== VOS gate entry ====="
          tail -1 "$HOME/venture-os/state/sara-gate-runs.jsonl" 2>/dev/null || true
          echo "===== Latest release-gate report ====="
          LATEST="$(ls -t /Volumes/MontereyT7/FLUXION/docs/launch/sara-release-gate-reports/release-gate-*.json 2>/dev/null | head -1 || true)"
          if [ -n "$LATEST" ]; then
            echo "$LATEST"
            cat "$LATEST"
          else
            echo "No release-gate report found"
          fi
