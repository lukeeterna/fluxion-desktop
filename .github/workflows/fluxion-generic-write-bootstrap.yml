name: FLUXION Generic Write Lane Bootstrap

on:
  push:
    branches: [master]
    paths:
      - '.github/bootstrap/fluxion-draft-bus-executor'
      - '.github/bootstrap/fluxion-generic-write-executor'
      - '.github/bootstrap/fluxion-trusted-publish-gate.py'
      - '.github/bootstrap/install-generic-write-lane.zsh'
      - '.github/workflows/fluxion-generic-write-bootstrap.yml'
      - '.github/workflows/fluxion-sonnet-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluxion-generic-write-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || github.event.before == '70130f2d842ba4c2961f7621ef1f7b25cdf2f9c9'
    runs-on: [self-hosted, macbook, fluxion]
    timeout-minutes: 15
    outputs:
      packet_b64: ${{ steps.publish.outputs.packet_b64 }}
      result_b64: ${{ steps.publish.outputs.result_b64 }}
      packet_sha256: ${{ steps.publish.outputs.packet_sha256 }}
      publisher_rc: ${{ steps.publish.outputs.publisher_rc }}
    env:
      TASK_ID: WORKFLOW.WRITE-LANE.GENERIC-INSTALL.20260810
      CHANNEL: FXD-824F35830C8A
      PRE_BASE: 70130f2d842ba4c2961f7621ef1f7b25cdf2f9c9
      FLUXION_ROOT: /Volumes/MontereyT7/FLUXION

    steps:
      - name: Align canonical repository to trusted-published master
        id: align
        shell: bash
        continue-on-error: true
        run: |
          set -u
          RUN_ROOT="$HOME/.local/share/fluxion-draft-bus/bootstrap-runs"
          RUN_DIR="$RUN_ROOT/${TASK_ID}-${GITHUB_RUN_ID}"
          mkdir -p "$RUN_DIR"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          set +e
          (
            set -euo pipefail
            REPO="$FLUXION_ROOT"
            expected="$RUN_DIR/expected-control-paths.txt"
            cat > "$expected" <<'EOF'
          .github/bootstrap/install-generic-write-lane.zsh
          .github/workflows/fluxion-generic-write-bootstrap.yml
          EOF

            test -d "$REPO/.git"
            test "$(git -C "$REPO" branch --show-current)" = master
            remote="$(git -C "$REPO" remote get-url origin)"
            case "$remote" in
              https://github.com/lukeeterna/fluxion-desktop|https://github.com/lukeeterna/fluxion-desktop.git|git@github.com:lukeeterna/fluxion-desktop.git) ;;
              *) echo "BLOCKED: origin mismatch" >&2; exit 2 ;;
            esac

            before_head="$(git -C "$REPO" rev-parse HEAD)"
            before_origin="$(git -C "$REPO" rev-parse refs/remotes/origin/master)"
            git -C "$REPO" status --porcelain > "$RUN_DIR/align.status.before"
            printf '%s\n' "$before_head" > "$RUN_DIR/align.head.before"
            printf '%s\n' "$before_origin" > "$RUN_DIR/align.origin.before"

            python3 - "$RUN_DIR/align.status.before" <<'PY'
          import sys
          allowed={
              'tools/VectCutAPI',
              'src-tauri/fluxion.db',
              'src-tauri/fluxion.db-shm',
              'src-tauri/fluxion.db-wal',
              'vos-out/decisions.jsonl',
              '.claude/session_state.md',
          }
          for raw in open(sys.argv[1],encoding='utf-8'):
              line=raw.rstrip('\n')
              if not line: continue
              path=line[3:]
              if ' -> ' in path: path=path.split(' -> ',1)[1]
              if path not in allowed:
                  raise SystemExit(f'BLOCKED: unexpected dirty path: {path}')
          PY

            case "$before_head" in
              "$PRE_BASE"|"$GITHUB_SHA") ;;
              *) echo "BLOCKED: canonical HEAD is neither PRE_BASE nor trusted candidate" >&2; exit 2 ;;
            esac

            (
              cd "$HOME"
              git --git-dir="$REPO/.git" fetch --no-tags origin 'refs/heads/master:refs/remotes/origin/master'
            )
            fetched="$(git -C "$REPO" rev-parse refs/remotes/origin/master)"
            test "$fetched" = "$GITHUB_SHA" || { echo "BLOCKED: fetched origin/master != event SHA" >&2; exit 2; }

            git -C "$REPO" diff --name-only "$PRE_BASE..$GITHUB_SHA" | sort > "$RUN_DIR/align.changed-paths"
            sort "$expected" > "$RUN_DIR/expected-control-paths.sorted"
            cmp -s "$RUN_DIR/align.changed-paths" "$RUN_DIR/expected-control-paths.sorted" || {
              echo "BLOCKED: candidate control-plane diff is not exact" >&2
              exit 2
            }

            if [ "$before_head" = "$PRE_BASE" ]; then
              git -C "$REPO" -c core.hooksPath=/dev/null merge --ff-only "$GITHUB_SHA"
              state=FAST_FORWARDED
            else
              state=ALREADY_ALIGNED
            fi

            after_head="$(git -C "$REPO" rev-parse HEAD)"
            after_origin="$(git -C "$REPO" rev-parse refs/remotes/origin/master)"
            git -C "$REPO" status --porcelain > "$RUN_DIR/align.status.after"
            printf '%s\n' "$after_head" > "$RUN_DIR/align.head.after"
            printf '%s\n' "$after_origin" > "$RUN_DIR/align.origin.after"
            printf '%s\n' "$state" > "$RUN_DIR/align.state"
            test "$after_head" = "$GITHUB_SHA"
            test "$after_origin" = "$GITHUB_SHA"
            cmp -s "$RUN_DIR/align.status.before" "$RUN_DIR/align.status.after"
            echo "ALIGN_STATE=$state"
            echo "CANONICAL_HEAD=$after_head"
            echo "ORIGIN_MASTER=$after_origin"
          ) > >(tee "$RUN_DIR/align.stdout") 2> >(tee "$RUN_DIR/align.stderr" >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUN_DIR/align.rc"
          [ "$rc" = 0 ] && echo "BASE=$GITHUB_SHA" >> "$GITHUB_ENV"
          exit "$rc"

      - name: Capture TCC evidence from the real runner context
        id: tcc
        if: steps.align.outcome == 'failure'
        shell: bash
        continue-on-error: true
        run: |
          set -u
          : "${RUN_DIR:?RUN_DIR missing}"
          start="$(date -v-5M '+%Y-%m-%d %H:%M:%S')"
          end="$(date '+%Y-%m-%d %H:%M:%S')"
          set +e
          /usr/bin/log show --start "$start" --end "$end" \
            --style compact \
            --predicate '(process == "tccd") OR (subsystem == "com.apple.TCC")' \
            > "$RUN_DIR/tcc.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUN_DIR/tcc.rc"
          printf 'TCC_WINDOW_START=%s\nTCC_WINDOW_END=%s\n' "$start" "$end"
          if [ "$rc" = 0 ] && [ -s "$RUN_DIR/tcc.log" ]; then
            echo 'TCC_LOG=AVAILABLE'
            tail -100 "$RUN_DIR/tcc.log" || true
          else
            echo 'TCC_LOG=UNAVAILABLE'
          fi
          exit 0

      - name: Install generic write lane and trusted publish gate
        id: install
        if: steps.align.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          : "${RUN_DIR:?RUN_DIR missing}"
          : "${BASE:?BASE missing}"
          set +e
          /bin/zsh "$FLUXION_ROOT/.github/bootstrap/install-generic-write-lane.zsh" \
            "$FLUXION_ROOT/.github/bootstrap" "$BASE" \
            > >(tee "$RUN_DIR/install.stdout") \
            2> >(tee "$RUN_DIR/install.stderr" >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUN_DIR/install.rc"
          exit "$rc"

      - name: Verify idempotent second install
        id: reinstall
        if: steps.install.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          : "${RUN_DIR:?RUN_DIR missing}"
          : "${BASE:?BASE missing}"
          before_generic="$(shasum -a 256 "$HOME/.local/bin/fluxion-generic-write-executor" | awk '{print $1}')"
          before_router="$(shasum -a 256 "$HOME/.local/bin/fluxion-draft-bus-executor" | awk '{print $1}')"
          before_gate="$(shasum -a 256 "$HOME/.local/bin/fluxion-trusted-publish-gate" | awk '{print $1}')"
          set +e
          /bin/zsh "$FLUXION_ROOT/.github/bootstrap/install-generic-write-lane.zsh" \
            "$FLUXION_ROOT/.github/bootstrap" "$BASE" \
            > >(tee "$RUN_DIR/reinstall.stdout") \
            2> >(tee "$RUN_DIR/reinstall.stderr" >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUN_DIR/reinstall.rc"
          test "$rc" = 0
          grep -qx 'ALREADY_INSTALLED_EXACT' "$RUN_DIR/reinstall.stdout"
          test "$before_generic" = "$(shasum -a 256 "$HOME/.local/bin/fluxion-generic-write-executor" | awk '{print $1}')"
          test "$before_router" = "$(shasum -a 256 "$HOME/.local/bin/fluxion-draft-bus-executor" | awk '{print $1}')"
          test "$before_gate" = "$(shasum -a 256 "$HOME/.local/bin/fluxion-trusted-publish-gate" | awk '{print $1}')"
          echo 'BOOTSTRAP_IDEMPOTENCE=PASS'

      - name: Publish trusted bootstrap RESULT draft
        id: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DRAFT="$HOME/.local/bin/fluxion-draft-bus-secure"
          : "${RUN_DIR:?RUN_DIR missing}"
          test -x "$DRAFT"

          touch \
            "$RUN_DIR/align.stdout" "$RUN_DIR/align.stderr" "$RUN_DIR/align.rc" \
            "$RUN_DIR/align.status.before" "$RUN_DIR/align.status.after" \
            "$RUN_DIR/align.head.before" "$RUN_DIR/align.head.after" \
            "$RUN_DIR/align.origin.before" "$RUN_DIR/align.origin.after" \
            "$RUN_DIR/align.changed-paths" "$RUN_DIR/align.state" \
            "$RUN_DIR/tcc.log" "$RUN_DIR/tcc.rc" \
            "$RUN_DIR/install.stdout" "$RUN_DIR/install.stderr" "$RUN_DIR/install.rc" \
            "$RUN_DIR/reinstall.stdout" "$RUN_DIR/reinstall.stderr" "$RUN_DIR/reinstall.rc"

          read_rc() {
            local f="$1"
            if [ -s "$f" ]; then
              cat "$f"
            else
              printf '2\n'
            fi
          }

          align_rc="$(read_rc "$RUN_DIR/align.rc")"
          install_rc="$(read_rc "$RUN_DIR/install.rc")"
          reinstall_rc="$(read_rc "$RUN_DIR/reinstall.rc")"
          install_state="$(grep '^INSTALL_STATE=' "$RUN_DIR/install.stdout" 2>/dev/null | tail -1 | cut -d= -f2- || true)"
          [ -n "$install_state" ] || install_state=NOT_RUN

          if [ "$align_rc" = 0 ] && [ "$install_rc" = 0 ] && [ "$reinstall_rc" = 0 ] \
             && grep -qx 'INSTALL_RESULT=PASS' "$RUN_DIR/install.stdout" \
             && grep -qx 'ALREADY_INSTALLED_EXACT' "$RUN_DIR/reinstall.stdout" \
             && grep -qx 'TRUSTED_PUBLISH_GATE_INSTALLED=YES' "$RUN_DIR/install.stdout"; then
            status=PASS; verdict=VERDE; next_event=GENERIC_WRITE_LANE_CERT
          else
            status=FAIL; verdict=ROSSO; next_event=SOL_ORCHESTRATOR_TRIAGE
          fi

          base_commit="$(cat "$RUN_DIR/align.head.before" 2>/dev/null || true)"
          [ -n "$base_commit" ] || base_commit="$PRE_BASE"
          result_commit="$(cat "$RUN_DIR/align.head.after" 2>/dev/null || true)"
          [ -n "$result_commit" ] || result_commit="$base_commit"
          python3 - "$base_commit" "$result_commit" <<'PY'
          import re,sys
          for name,value in zip(('base_commit','result_commit'),sys.argv[1:]):
              if not re.fullmatch(r'[0-9a-f]{40}',value):
                  raise SystemExit(f'{name} is not 40-hex')
          PY

          packet="$RUN_DIR/result-${TASK_ID}.zip"
          (
            cd "$RUN_DIR"
            zip -q "$packet" \
              align.stdout align.stderr align.rc align.status.before align.status.after \
              align.head.before align.head.after align.origin.before align.origin.after \
              align.changed-paths align.state tcc.log tcc.rc \
              install.stdout install.stderr install.rc \
              reinstall.stdout reinstall.stderr reinstall.rc
          )
          sha="$(shasum -a 256 "$packet" | awk '{print $1}')"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          result="$RUN_DIR/result.json"
          python3 - "$result" "$created" "$status" "$verdict" "$sha" "$base_commit" "$result_commit" "$install_state" "$next_event" <<'PY'
          import json,sys
          p,created,status,verdict,sha,base,result,install_state,next_event=sys.argv[1:]
          d={
            "schema_version":1,"channel":"FXD-824F35830C8A","kind":"RESULT",
            "session_id":"GH-SELFHOSTED-GENERIC-WRITE-BOOTSTRAP",
            "task_id":"WORKFLOW.WRITE-LANE.GENERIC-INSTALL.20260810",
            "created_at":created,"base_commit":base,"result_commit":result,"status":status,
            "packet_name":"result-WORKFLOW.WRITE-LANE.GENERIC-INSTALL.20260810.zip",
            "packet_sha256":sha,
            "summary":f"executor=github-selfhosted-bootstrap;profile=INFRASTRUCTURE_BOOTSTRAP;verdict=VERDETTO: {verdict};publisher_boundary=trusted-non-llm;install_state={install_state};idempotence={'PASS' if status=='PASS' else 'UNKNOWN'};next_event={next_event}"
          }
          open(p,"w",encoding="utf-8").write(json.dumps(d,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          PY

          set +e
          "$DRAFT" create-result-draft "$result" "$packet" \
            >"$RUN_DIR/publisher.stdout" 2>"$RUN_DIR/publisher.stderr"
          publisher_rc=$?
          set -e
          printf '%s\n' "$publisher_rc" > "$RUN_DIR/publisher.rc"

          {
            printf 'packet_b64=%s\n' "$(base64 < "$packet" | tr -d '\n')"
            printf 'result_b64=%s\n' "$(base64 < "$result" | tr -d '\n')"
            printf 'packet_sha256=%s\n' "$sha"
            printf 'publisher_rc=%s\n' "$publisher_rc"
          } >> "$GITHUB_OUTPUT"
          test "$publisher_rc" = 0

      - name: Enforce bootstrap success
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUN_DIR/align.rc")" = 0
          test "$(cat "$RUN_DIR/install.rc")" = 0
          test "$(cat "$RUN_DIR/reinstall.rc")" = 0
          grep -qx 'INSTALL_RESULT=PASS' "$RUN_DIR/install.stdout"
          grep -qx 'ALREADY_INSTALLED_EXACT' "$RUN_DIR/reinstall.stdout"
          grep -qx 'TRUSTED_PUBLISH_GATE_INSTALLED=YES' "$RUN_DIR/install.stdout"
          test "$(cat "$RUN_DIR/publisher.rc")" = 0

  mirror-result:
    name: Mirror bootstrap evidence for connector
    if: always() && needs.bootstrap.outputs.packet_b64 != '' && needs.bootstrap.outputs.result_b64 != ''
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rebuild and verify exact result evidence
        shell: bash
        env:
          TASK_ID: WORKFLOW.WRITE-LANE.GENERIC-INSTALL.20260810
          PACKET_B64: ${{ needs.bootstrap.outputs.packet_b64 }}
          RESULT_B64: ${{ needs.bootstrap.outputs.result_b64 }}
          EXPECTED_SHA256: ${{ needs.bootstrap.outputs.packet_sha256 }}
          PUBLISHER_RC: ${{ needs.bootstrap.outputs.publisher_rc }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s' "$PACKET_B64" | base64 -d > "evidence/result-${TASK_ID}.zip"
          printf '%s' "$RESULT_B64" | base64 -d > evidence/result.json
          actual="$(sha256sum "evidence/result-${TASK_ID}.zip" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          printf 'packet_sha256=%s\npublisher_rc=%s\ntransport=github-actions-artifact\n' \
            "$actual" "$PUBLISHER_RC" > evidence/MANIFEST.txt

      - name: Upload connector-readable evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generic-write-bootstrap-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
