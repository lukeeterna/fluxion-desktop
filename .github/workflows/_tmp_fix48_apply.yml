name: FIX48 temporary deterministic repair

on:
  push:
    branches:
      - fix/soleur-export-branch-discovery-20260814

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/soleur-export-branch-discovery-20260814
          fetch-depth: 0

      - name: Apply exact repair
        run: |
          set -euo pipefail
          python3 .github/bootstrap/_tmp_fix48_apply.py

      - name: Deterministic regression
        run: |
          set -euo pipefail
          python3 -m py_compile .github/bootstrap/fluxion-soleur-adapter.py
          python3 .github/bootstrap/fluxion-soleur-adapter.py self-test
          python3 .github/bootstrap/fluxion-soleur-adapter.py static-workflow --workflow .github/workflows/fluxion-soleur.yml
          git diff --check

      - name: Commit only permanent adapter repair
        run: |
          set -euo pipefail
          git config user.name 'FLUXION deterministic repair'
          git config user.email 'fluxion-repair@users.noreply.github.com'
          git rm .github/bootstrap/_tmp_fix48_apply.py .github/workflows/_tmp_fix48_apply.yml
          git add .github/bootstrap/fluxion-soleur-adapter.py
          git diff --cached --check
          CHANGED="$(git diff --cached --name-only | sort)"
          test "$CHANGED" = '.github/bootstrap/fluxion-soleur-adapter.py'
          git commit -m 'fix(ci): recover reviewed Soleur branch after worktree lifecycle'
          git push origin HEAD:fix/soleur-export-branch-discovery-20260814
