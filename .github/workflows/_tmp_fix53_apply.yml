name: FIX53 temporary deterministic repair

on:
  push:
    branches:
      - fix/soleur-final-result-marker-20260814

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/soleur-final-result-marker-20260814
          fetch-depth: 1
          sparse-checkout: |
            .github/bootstrap
            .github/workflows

      - name: Apply exact repair
        run: |
          set -euo pipefail
          python3 .github/bootstrap/_tmp_fix53_apply.py

      - name: Deterministic regression
        run: |
          set -euo pipefail
          python3 -m py_compile .github/bootstrap/fluxion-soleur-adapter.py
          python3 .github/bootstrap/fluxion-soleur-adapter.py self-test
          python3 .github/bootstrap/fluxion-soleur-adapter.py static-workflow --workflow .github/workflows/fluxion-soleur.yml
          git diff --check

      - name: Commit permanent repair and remove bootstrap
        run: |
          set -euo pipefail
          git config user.name 'FLUXION deterministic repair'
          git config user.email 'fluxion-repair@users.noreply.github.com'
          git rm .github/bootstrap/_tmp_fix53_apply.py .github/workflows/_tmp_fix53_apply.yml
          git add .github/bootstrap/fluxion-soleur-adapter.py .github/workflows/fluxion-soleur.yml
          git diff --cached --check
          CHANGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/bootstrap/_tmp_fix53_apply.py' \
            '.github/bootstrap/fluxion-soleur-adapter.py' \
            '.github/workflows/_tmp_fix53_apply.yml' \
            '.github/workflows/fluxion-soleur.yml' | sort)"
          test "$CHANGED" = "$EXPECTED"
          git commit -m 'fix(ci): validate Soleur completion markers in final result only'
          git push origin HEAD:fix/soleur-final-result-marker-20260814
